# Design child: detect workspace infrastructure -> clarify-first architecture interview (infrastructure
# questions only as relevant to that profile) -> one HLD write -> conditional post-check
# -> architecture review by a fresh reviewer -> human approval. The architect role owns three jobs
# (the question queue, the HLD itself, and answering review findings); the reviewer role reviews.
# The engine checks every job on hand-off and sends a failed check back to the same job. The review
# runs here, before anything is built on the HLD: a wrong architecture call costs one document
# edit now instead of a redo of the contract, LLDs and code. Entered by design.yaml after PRD
# approval.
version: 1
name: design-hld
title: HLD and architecture review
description: Clarify and write the feature HLD, then get it approved.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  feedback: {type: string, default: "", description: revision note from a design-review gate (empty on first pass)}
  greenfield: {type: string, default: "false", description: "true when the workspace has no code yet (greenfield.py check)"}
defaults:
  model: opus
  agent: architect
  max_visits: 10
start: infra_profile
nodes:
  # Engine-owned: which infrastructure the workspace defines decides whether the HLD asks
  # infrastructure questions at all, and whether it needs an Infrastructure and operations section.
  - id: infra_profile
    type: script
    label: Detect workspace infrastructure
    run: [python3, .maestro/engine/infra_scan.py, --root, ".", --out, ".maestro/runs/${inputs.slug}/infra-profile.json"]
    next: living_domains

  # Engine-owned: the living-doc domains of the repositories the impact assessment names, so the
  # architecture steps load those technical docs only (all domains when no assessment ran).
  - id: living_domains
    type: script
    label: Find the affected domains' docs
    run: [python3, .maestro/engine/living_docs.py, domains, --root, ".", --impact, ".maestro/runs/${inputs.slug}/impact.json"]
    next: prepare_hld_questions

  - id: prepare_hld_questions
    type: agent
    execution: lead
    label: Find the next material architecture gaps
    instruction: |
      Build the next architecture Grill queue at
      .maestro/runs/${inputs.slug}/hld-questions.json before HLD prose is written. Read every
      requirement file, the maintained codebase map in each affected repo, docs/architecture.md and
      the affected domains' technical docs (${steps.living_domains.outputs.technical_paths}),
      existing confirmed HLD decisions when present, and revision feedback. Explore source only
      when a material decision depends on detail absent from the maps. A direction that would
      break an existing invariant (INV) or change a business rule (BR) is a material decision:
      name the ID in the question.

      Ask only unresolved decisions that change system ownership, boundaries, data authority,
      cross-repo interaction, security/privacy, failure or recovery behavior, execution-mode
      support, migration, rollout, or a material trade-off. Do not ask for endpoint fields, table
      columns, filenames, task breakdowns, or other LLD details. Audit earlier answers against their
      must_resolve facts and each other; a saved answer is not automatically complete. Use only the
      stored answer as confirmed for user-answer decisions, never its unaccepted proposal. Treat
      user-raised points as the human's own constraints, honour discussion summaries, re-ask a
      blocking deferred decision with sharper options, and keep a non-blocking one deferred to LLD.

      Infrastructure: ${steps.infra_profile.outputs.summary} (evidence:
      ${steps.infra_profile.outputs.profile_path}). Follow that rule exactly. Level none: ask no
      infrastructure, deployment or scaling-topology questions; stay within the application
      architecture. Level containers: ask only the runtime and configuration questions this
      feature changes (a new service or process, ports, config and secrets, resource limits).
      Level iac: read the infrastructure repositories (the `iac_repos` input)
      and ask every material infrastructure decision this feature changes or depends on —
      scaling (instances, autoscaling triggers), data-store capacity and topology, queues and
      topics, caching, networking and ingress, config and secrets, environments and rollout,
      observability (SLOs, alerts), and cost — each checked against the PRD's Non-functional
      requirements. At any level, a feature that changes and depends on no infrastructure asks
      none; never ask an infrastructure question only to fill a checklist.

      Greenfield: ${inputs.greenfield}. When true the workspace has no code yet: decide the
      repositories to create (one per deployable service or shared library, no more), each with its
      stack, and ask the stack and structure choices that are genuinely open, each with a
      recommendation that fits the requirement and the team's existing tools.

      Make it a design conversation, not a questionnaire: give every genuine trade-off its
      recommendation plus up to two real alternatives with their concrete consequences.

      Ask as few questions as the evidence allows; there is no minimum. The approved PRD is the
      product authority: never ask the person to confirm or restate anything it, the decision log,
      the code or the docs already settle. A question earns its place only when reasonable
      architects would choose differently AND the choice is costly to change after approval. A
      point with one sensible answer is not a question: record it under `settled` when a source
      states it, otherwise design it — the architecture review and the approval gate check the
      HLD. When the PRD and the existing architecture leave no such choice, write an empty queue:
      that is the expected result, and the HLD is written straight away.

      When you do ask, put every material gap in this one queue and end it with one kind
      "direction" question whose proposal summarises the intended architecture (owners, main
      flow, key trade-offs) assuming each recommendation is accepted: a round accepted as
      recommended goes straight to writing. Ask a fresh direction in a later round only when an
      answer changed it. Never ask a direction question on its own in a stage that asked nothing.

      Write schema_version 2, with an empty queue once all material architecture facts are
      concrete and consistent and, when anything was asked in this stage, the latest direction is
      confirmed. Every question declares 1-4 short must_resolve facts.
      Include audit.unresolved and audit.contradictions; both must be empty with an empty queue.
      Decision log: .maestro/runs/${inputs.slug}/decision-log.md (every earlier stage's decisions).
      Never ask a topic already decided there or in this stage's decisions: give every question a
      short kebab-case `topic`; to refine a recorded answer, ask at most one follow-up with
      `follow_up_of: <its id>`. Decide from evidence first: when the requirement, an approved
      document, the code or the docs already settle a point, record it under `settled`
      ({topic, title, decision, source: "<path>[#section|:line]"}) instead of asking.
      Validate before completing.
      If the engine's check failed, fix only the defects it names in the existing file and
      validate again — do not rebuild the queue or re-read sources.
      Run mode: ${run.mode}. In auto mode nobody answers: every recommendation is adopted as a
      logged assumption and this is the only round, so give every question a grounded
      recommendation from the evidence and put every material gap in this one queue.
      Because each recommendation then becomes the decision, recommend the smallest design that
      meets the requirement: no component, store, queue, cache or infrastructure it does not
      need.
    skill: hld-interview
    inputs:
      feature: "${inputs.feature}"
      slug: "${inputs.slug}"
      requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
      decisions_path: ".maestro/runs/${inputs.slug}/hld-context.json"
      validator: ".maestro/engine/validate_prd_questions.py"
      revision_feedback: "${steps.hld_approval.outputs.feedback} ${inputs.feedback}"
      iac_repos: "${steps.infra_profile.outputs.iac_repos_csv}"
      codebase_lessons: "${memory.knowledge.codebase}"
    outputs: [summary]
    artifact: ".maestro/runs/${inputs.slug}/hld-questions.json"
    check: {run: [python3, .maestro/engine/validate_prd_questions.py, ".maestro/runs/${inputs.slug}/hld-questions.json", --decisions, ".maestro/runs/${inputs.slug}/hld-context.json", --require-version, "2", --require-direction, --log, ".maestro/runs/${inputs.slug}/decision-log.json", --require-topics, --root, ".", --report]}
    max_visits: 8
    on_exhausted: hld_clarity_limit
    routes:
      - {when: "${steps.prepare_hld_questions.outputs.state} == clear", to: write_hld}
      - {to: hld_interview}

  - id: hld_interview
    type: interview
    label: Clarify material architecture decisions
    skill: hld-interview
    context: |
      Feature: ${inputs.feature}
      Approved PRD: .maestro/runs/${inputs.slug}/requirement/prd.md
    questions_artifact: ".maestro/runs/${inputs.slug}/hld-questions.json"
    batch_size: 12
    presentation: popup
    discuss:
      inputs:
        requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
        codebase_maps: "docs/architecture.md (Cross-repo flows and contracts, Platform-wide invariants); the affected domains' technical docs: ${steps.living_domains.outputs.technical_paths}; one section of docs/_generated/<domain>.inventory.md when you need it; docs/codebase-maps/<repo>.md for each affected repo"
        source: "only the files that settle this question"
    artifact: ".maestro/runs/${inputs.slug}/hld-context.json"
    # Autopilot (auto mode): recommendations become logged assumptions; one round, then write.
    auto: {modes: [auto]}
    routes:
      - {when: "${run.mode} == auto", to: write_hld}
      # A round accepted as recommended, direction included, leaves nothing to audit: write.
      - {when: "${steps.hld_interview.outputs.direction_accepted} == false", to: prepare_hld_questions}
      - {when: "${steps.hld_interview.outputs.all_accepted} == true", to: write_hld}
      - {to: prepare_hld_questions}

  - id: hld_clarity_limit
    type: gate
    label: HLD clarity checkpoint
    prompt: |
      Eight architecture rounds are complete and material decisions remain unresolved.
      Maestro will not finalize the HLD while those decisions are unclear. Continue with focused
      questions, or stop this run?
    options:
      - {id: more, label: Continue with focused questions, to: prepare_hld_questions}
      - {id: reject, label: Abort the run, to: abort}

  # Architect role: the only HLD writer. A revision is a targeted edit; only feedback that needs
  # a new architecture decision goes back through the clarification loop ('rethink' is the full
  # pass). Its checks validate the post-check queue, then the HLD.
  - id: write_hld
    type: agent
    execution: lead
    label: Architect — write the HLD
    instruction: |
      HLD approval choice (empty before the first approval): ${steps.hld_approval.outputs.choice}.

      When the choice is revise, apply this feedback to .maestro/runs/${inputs.slug}/hld.md as a
      targeted edit: ${steps.hld_approval.outputs.feedback}
      Change only the sections the feedback affects, plus any a decision recorded after the HLD
      was last written affects (a clarification round may have added one); keep every other
      section and confirmed decision unchanged. Read only the HLD, the confirmed decisions at
      .maestro/runs/${inputs.slug}/hld-context.json, and source the change itself depends on — do
      not re-run clarification, survey the codebase, or rewrite the HLD. Keep
      open-questions.json consistent with the edit. If the feedback needs a new architecture
      decision the confirmed decisions cannot settle, do not guess: leave the HLD unchanged and
      return needs_clarification true.

      Otherwise, write the final high-level design from the approved requirement, maintained
      codebase maps, relevant source details, and confirmed architecture decisions at
      .maestro/runs/${inputs.slug}/hld-context.json. Honour review feedback without mentioning the
      review: ${steps.hld_approval.outputs.feedback} ${inputs.feedback}

      Write concise, skimmable technical English. Do not reopen settled decisions, invent missing
      facts, repeat the PRD, or drift into endpoint fields, schema columns, file lists, or task-level
      implementation. Create the HLD skeleton before filling it: the seven required sections, plus
      Infrastructure and operations right after Interfaces when the infrastructure level is
      containers or iac (${steps.infra_profile.outputs.level}). That section lists each
      infrastructure change the feature makes — deployment and runtime, scaling, data stores,
      messaging, networking, config and secrets, observability, rollout — each naming the
      repository that owns it in backticks (one of ${steps.infra_profile.outputs.repos_csv}), or says
      None. A new deployable service ships complete: list its container image, CI pipeline and
      deployment definitions (Terraform, Helm or manifests) in the repositories that hold them. Put a
      Repositories section right after Context and scope listing each repository to create as
      `name` (stack): purpose when greenfield is true (${inputs.greenfield}), and a
      Mermaid architecture diagram (components, owners, main flows) in Proposed design whenever the
      feature crosses repositories or changes infrastructure. Use the architecture-patterns skill
      for the patterns you choose and, for each detected platform (the `platforms` input), the
      matching infrastructure pack when it is installed. Validate with `python3 .maestro/engine/validate_hld.py
      .maestro/runs/${inputs.slug}/hld.md --open-questions
      .maestro/runs/${inputs.slug}/open-questions.json --infra-level
      ${steps.infra_profile.outputs.level} --repos ${steps.infra_profile.outputs.repos_csv} --greenfield ${inputs.greenfield}`. Use the shortest clear wording that preserves every
      material decision and all context needed to understand the architecture; never remove
      necessary content to reduce length.

      Also write open-questions.json containing only questions explicitly deferred to LLD, and
      hld-post-questions.json as a schema-version-2 post-check. The post-check must be empty when no
      new material gap emerged during synthesis. If a new blocking gap did emerge, put only that
      gap in the post-check; do not silently guess. Validate the HLD, deferred-question ledger, and
      post-check before completing, repairing deterministic defects inside this same call.

      Deal with every item in the impact assessment at .maestro/runs/${inputs.slug}/impact.json
      (domains, tables, jobs, queues, endpoints and their consumers, INV rules, CS scenarios): name
      each where the design handles it, or write "<item>: no change needed, because …". The engine
      checks this and sends any gap back.

      If the HLD already exists from an earlier pass, update it in place: change only the sections
      whose decisions changed. If the engine's check failed, fix only the file and defects it
      names and leave everything else untouched.

      Ground the design in the living docs (the `living_docs` input) and cite the IDs of the
      business rules, invariants and change scenarios it relies on or changes (e.g. PL-INV-001),
      so later steps load exactly those rows.

      Return needs_clarification false unless a revision needs a new decision.
    skill: hld-writing
    inputs:
      feature: "${inputs.feature}"
      slug: "${inputs.slug}"
      requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
      decisions_path: ".maestro/runs/${inputs.slug}/hld-context.json"
      hld_path: ".maestro/runs/${inputs.slug}/hld.md"
      impact_path: ".maestro/runs/${inputs.slug}/impact.json"
      open_questions_path: ".maestro/runs/${inputs.slug}/open-questions.json"
      post_questions_path: ".maestro/runs/${inputs.slug}/hld-post-questions.json"
      hld_validator: ".maestro/engine/validate_hld.py"
      approval_choice: "${steps.hld_approval.outputs.choice}"
      revision_feedback: "${steps.hld_approval.outputs.feedback}"
      question_validator: ".maestro/engine/validate_prd_questions.py"
      platforms: "${steps.infra_profile.outputs.platforms_csv}"
      infra_profile: "${steps.infra_profile.outputs.profile_path}"
      infra_level: "${steps.infra_profile.outputs.level}"
      living_docs: "docs/architecture.md; ${steps.living_domains.outputs.technical_paths}"
      codebase_lessons: "${memory.knowledge.codebase}"
      lessons: "${memory.knowledge.plan}"
    outputs: [hld_summary, needs_clarification]
    artifact:
      - ".maestro/runs/${inputs.slug}/hld.md"
      - ".maestro/runs/${inputs.slug}/open-questions.json"
      - ".maestro/runs/${inputs.slug}/hld-post-questions.json"
    check:
      - {run: [python3, .maestro/engine/validate_prd_questions.py, ".maestro/runs/${inputs.slug}/hld-post-questions.json", --decisions, ".maestro/runs/${inputs.slug}/hld-context.json", --require-version, "2", --log, ".maestro/runs/${inputs.slug}/decision-log.json", --require-topics, --root, ".", --report]}
      - {run: [python3, .maestro/engine/validate_hld.py, ".maestro/runs/${inputs.slug}/hld.md", --open-questions, ".maestro/runs/${inputs.slug}/open-questions.json", --infra-level, "${steps.infra_profile.outputs.level}", --repos, "${steps.infra_profile.outputs.repos_csv}", --greenfield, "${inputs.greenfield}", --report]}
      # every item the impact assessment lists is dealt with (none to trace on greenfield)
      - {run: [python3, .maestro/engine/impact_trace.py, check, --root, ".", --impact, ".maestro/runs/${inputs.slug}/impact.json", --docs, ".maestro/runs/${inputs.slug}/hld.md", --stage, hld, --out, ".maestro/runs/${inputs.slug}/impact-trace.md"]}
    max_visits: 6
    routes:
      - {when: "${steps.write_hld.outputs.needs_clarification} == true", to: prepare_hld_questions}
      - {when: "${steps.write_hld.outputs.state} == ask", to: hld_post_interview}
      - {to: validate_hld}

  - id: hld_post_interview
    type: interview
    label: Resolve newly discovered HLD gaps
    skill: hld-interview
    context: |
      A material gap emerged while connecting the complete HLD. Resolve it before final approval.
    questions_artifact: ".maestro/runs/${inputs.slug}/hld-post-questions.json"
    batch_size: 12
    presentation: popup
    discuss:
      inputs:
        requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
        hld_draft: ".maestro/runs/${inputs.slug}/hld.md"
        codebase_maps: "docs/architecture.md (Cross-repo flows and contracts, Platform-wide invariants); the affected domains' technical docs: ${steps.living_domains.outputs.technical_paths}; one section of docs/_generated/<domain>.inventory.md when you need it; docs/codebase-maps/<repo>.md for each affected repo"
    artifact: ".maestro/runs/${inputs.slug}/hld-context.json"
    auto: {modes: [auto]}
    next: write_hld

  # Engine-owned: every writer already passed this check; it runs once more where their paths
  # meet to record the HLD facts the stage reports (interfaces, infrastructure, new repositories).
  - id: validate_hld
    type: script
    label: Record HLD facts
    run: [python3, .maestro/engine/validate_hld.py, ".maestro/runs/${inputs.slug}/hld.md", --open-questions, ".maestro/runs/${inputs.slug}/open-questions.json", --infra-level, "${steps.infra_profile.outputs.level}", --repos, "${steps.infra_profile.outputs.repos_csv}", --greenfield, "${inputs.greenfield}", --report]
    max_visits: 12
    on_exhausted: abort
    routes:
      - {when: "${steps.validate_hld.outputs.valid} == true", to: sync_decisions}
      - {to: write_hld}

  # Engine-owned: rebuild the feature's decision log from every stage's decisions, so later
  # stages never re-ask a decided topic and the approval shows every decision.
  - id: sync_decisions
    type: script
    label: Update the decision log
    run:
      - python3
      - .maestro/engine/decision_log.py
      - sync
      - --root
      - .
      - --log
      - ".maestro/runs/${inputs.slug}/decision-log.json"
      - --stage
      - "PRD=.maestro/runs/${inputs.slug}/prd-context.json,.maestro/runs/${inputs.slug}/prd-questions.json"
      - --stage
      - "HLD=.maestro/runs/${inputs.slug}/hld-context.json,.maestro/runs/${inputs.slug}/hld-questions.json"
      - --stage
      - "LLD=.maestro/runs/${inputs.slug}/lld-context.json,.maestro/runs/${inputs.slug}/lld-questions.json"
    next: arch_scope

  # Engine-owned: a re-review sees the HLD changes since its last round, not the whole HLD again.
  - id: arch_scope
    type: script
    label: What changed since the last architecture review
    run: [python3, .maestro/engine/review_scope.py, prepare, --dir, ".maestro/runs/${inputs.slug}/reviews", --name, architecture, --files, ".maestro/runs/${inputs.slug}/hld.md", --findings, ".maestro/runs/${inputs.slug}/reviews/architecture-findings.json"]
    next: arch_review

  - id: arch_review
    type: agent
    label: Architecture review (fresh reviewer)
    brief: full
    instruction: |
      Review the HLD at .maestro/runs/${inputs.slug}/hld.md before it is approved, as a reviewer
      who did not write it. Read the approved requirement in .maestro/runs/${inputs.slug}/requirement/
      and the maintained architecture summaries and codebase maps; read source only to check a
      specific claim. Judge the architecture against the requirement: style, boundaries and data
      ownership, the listed interfaces, security and privacy, failure and recovery, scale,
      operations, and over- or under-engineering. Check every target in the PRD's Non-functional
      requirements against a mechanism in the design that meets it; a target the design cannot
      meet, or one it ignores, is blocking. Infrastructure: ${steps.infra_profile.outputs.summary}.
      When the level is iac or containers, review the Infrastructure and operations section
      against the infrastructure repositories and the detected platforms (the `platforms`
      input): scaling, capacity, failure domains, secrets,
      rollout and observability. When it is none, raise no infrastructure findings beyond what the
      requirement's targets need. Use the architecture-patterns skill and the matching
      infrastructure pack as your reference. The decisions the person confirmed are in
      .maestro/runs/${inputs.slug}/decision-log.md: a confirmed decision is not a finding unless it
      breaks a requirement or carries a risk they may not have seen, and then say the finding
      overrides it. Findings need evidence; severity blocking only for must-fix issues.
      Write every finding to .maestro/runs/${inputs.slug}/reviews/architecture-findings.json as well as
      the report (the engine decides from that file). If it exists from an earlier round, this is a
      re-review: read it and the author's resolutions at .maestro/runs/${inputs.slug}/reviews/architecture-resolutions.json first. Mark a fixed finding
      resolved; for a contested one, mark it withdrawn when the author is right or upheld with your
      reason; keep finding ids stable and give new findings new ids.
      ${steps.arch_scope.outputs.summary}. On a re-review the changes since your last round are at
      ${steps.arch_scope.outputs.diff_path}: check those, not the unchanged text. Raise a new
      blocking finding only for a problem the revision introduced, and mark it
      "introduced_by_revision": true; anything you could have raised earlier goes to the person as
      late, not back to the author. Then overwrite both files.
    skill: architecture-review
    agent: reviewer
    model: opus
    inputs:
      slug: "${inputs.slug}"
      hld_path: ".maestro/runs/${inputs.slug}/hld.md"
      requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
      codebase_maps: "docs/architecture.md (Cross-repo flows and contracts, Platform-wide invariants); the affected domains' technical docs: ${steps.living_domains.outputs.technical_paths}; one section of docs/_generated/<domain>.inventory.md when you need it; docs/codebase-maps/<repo>.md for each affected repo"
      decision_log: ".maestro/runs/${inputs.slug}/decision-log.md"
      previous_review: ".maestro/runs/${inputs.slug}/reviews/architecture.md"
      changes_since_last_review: "${steps.arch_scope.outputs.diff_path}"
      findings_path: ".maestro/runs/${inputs.slug}/reviews/architecture-findings.json"
      resolutions_path: ".maestro/runs/${inputs.slug}/reviews/architecture-resolutions.json"
      platforms: "${steps.infra_profile.outputs.platforms_csv}"
      infra_profile: "${steps.infra_profile.outputs.profile_path}"
      lessons: "${memory.knowledge.architecture-review}"
    outputs: [review_path, blocking, summary]
    artifact:
      - ".maestro/runs/${inputs.slug}/reviews/architecture.md"
      - ".maestro/runs/${inputs.slug}/reviews/architecture-findings.json"
    fresh: true
    max_visits: 6
    on_exhausted: hld_approval
    next: review_verdict

  # Engine-owned: blocking is decided from the findings file, not the reviewer's own flag. The
  # engine also bounds the loop: after reviews.max_rounds reviews (default 3), or for a blocking
  # finding first raised on a re-review, the person decides at approval instead of another round.
  - id: review_verdict
    type: script
    label: Blocking architecture findings?
    run: [python3, .maestro/engine/findings.py, verdict, --findings, ".maestro/runs/${inputs.slug}/reviews/architecture-findings.json", --previous, ".maestro/runs/${inputs.slug}/reviews/architecture-findings.previous.json", --round, "${steps.arch_review.visits}", --root, "."]
    max_visits: 8
    on_exhausted: hld_approval
    routes:
      - {when: "${steps.review_verdict.outputs.valid} == false", to: arch_review}
      - {when: "${steps.review_verdict.outputs.revise} == true", to: revise_from_review}
      - {to: hld_approval}

  # The author resolves the reviewer's blocking findings; the human sees the review at approval.
  - id: revise_from_review
    type: agent
    execution: lead
    label: Revise the HLD for blocking review findings
    instruction: |
      Resolve each blocking finding (status open or upheld) in .maestro/runs/${inputs.slug}/reviews/architecture-findings.json
      one way, and record it in .maestro/runs/${inputs.slug}/reviews/architecture-resolutions.json as
      {"schema_version": 1, "resolutions": [{"id", "resolution", "note"}]}:
      - fixed: a targeted edit to .maestro/runs/${inputs.slug}/hld.md; the note says what changed;
      - contested: the finding is wrong — the note gives the evidence (requirement, decision, code);
        a finding the reviewer already upheld cannot be contested again;
      - escalated: it needs a person's decision — the note states the decision.
      Change only what the fixes need and keep every confirmed decision a finding does not
      contradict. A finding that would overturn a decision the person confirmed is never fixed
      silently: contest it, citing the decision, when the decision still meets the requirements;
      otherwise escalate it so the person decides. Keep open-questions.json consistent with the edit. If a fix needs a new
      architecture decision the confirmed decisions cannot settle and you are not escalating it,
      return needs_clarification true; otherwise return false.
    skill: hld-writing
    inputs:
      slug: "${inputs.slug}"
      hld_path: ".maestro/runs/${inputs.slug}/hld.md"
      decisions_path: ".maestro/runs/${inputs.slug}/hld-context.json"
      open_questions_path: ".maestro/runs/${inputs.slug}/open-questions.json"
      hld_validator: ".maestro/engine/validate_hld.py"
      revision_feedback: ".maestro/runs/${inputs.slug}/reviews/architecture.md"
      findings_path: ".maestro/runs/${inputs.slug}/reviews/architecture-findings.json"
      resolutions_path: ".maestro/runs/${inputs.slug}/reviews/architecture-resolutions.json"
    outputs: [hld_summary, needs_clarification]
    artifact:
      - ".maestro/runs/${inputs.slug}/hld.md"
      - ".maestro/runs/${inputs.slug}/reviews/architecture-resolutions.json"
    check:
      - {run: [python3, .maestro/engine/validate_hld.py, ".maestro/runs/${inputs.slug}/hld.md", --open-questions, ".maestro/runs/${inputs.slug}/open-questions.json", --infra-level, "${steps.infra_profile.outputs.level}", --repos, "${steps.infra_profile.outputs.repos_csv}", --greenfield, "${inputs.greenfield}", --report]}
      - {run: [python3, .maestro/engine/impact_trace.py, check, --root, ".", --impact, ".maestro/runs/${inputs.slug}/impact.json", --docs, ".maestro/runs/${inputs.slug}/hld.md", --stage, hld, --out, ".maestro/runs/${inputs.slug}/impact-trace.md"]}
    max_visits: 3
    on_exhausted: hld_approval
    routes:
      - {when: "${steps.revise_from_review.outputs.needs_clarification} == true", to: prepare_hld_questions}
      - {to: review_resolution}

  # Engine-owned: fixed and contested findings go back to the reviewer; an escalation, or a second
  # contest of a finding the reviewer upheld, goes to the person at HLD approval.
  - id: review_resolution
    type: script
    label: Findings fixed, contested or escalated?
    run: [python3, .maestro/engine/findings.py, resolve, --findings, ".maestro/runs/${inputs.slug}/reviews/architecture-findings.json", --resolutions, ".maestro/runs/${inputs.slug}/reviews/architecture-resolutions.json"]
    max_visits: 8
    on_exhausted: hld_approval
    routes:
      - {when: "${steps.review_resolution.outputs.state} == escalate", to: hld_approval}
      - {when: "${steps.review_resolution.outputs.state} == incomplete", to: revise_from_review}
      - {to: validate_hld}

  - id: hld_approval
    type: gate
    label: HLD approval
    prompt: |
      Impact report (read this first): .maestro/runs/${inputs.slug}/impact-trace.md — everything
      the feature touches and where the HLD deals with it.
      HLD ready at .maestro/runs/${inputs.slug}/hld.md — ${steps.write_hld.outputs.hld_summary}
      Architecture review: ${steps.arch_review.outputs.summary}
      Blocking findings (engine): ${steps.review_verdict.outputs.summary}
      Escalated by the author: ${steps.review_resolution.outputs.escalated_csv} ${steps.review_resolution.outputs.summary}
      Decisions: ${steps.sync_decisions.outputs.summary} (${steps.sync_decisions.outputs.md_path})
      Report: .maestro/runs/${inputs.slug}/reviews/architecture.md

      Review the document and the review, then choose.
    options:
      - {id: approve, label: Approve — write the detailed designs, to: end}
      - {id: revise, label: Request changes — targeted edit of this HLD, to: write_hld, input: feedback}
      - {id: rethink, label: Re-clarify the architecture and regenerate, to: prepare_hld_questions, input: feedback}
      - {id: reject, label: Reject — abort the run, to: abort}
    # Autopilot approves only an HLD the fresh architecture review cleared; blocking findings left
    # after the round limit, or late ones, stop the run here.
    auto:
      option: approve
      modes: [auto]
      when: ["${steps.review_verdict.outputs.blocking} == false", "${steps.review_verdict.outputs.late} == false"]

outputs:
  hld_summary: "${steps.write_hld.outputs.hld_summary}"
  interfaces_changed: "${steps.validate_hld.outputs.interfaces_changed}"
  infra_changed: "${steps.validate_hld.outputs.infra_changed}"
  infra_repos_csv: "${steps.validate_hld.outputs.infra_repos_csv}"
  new_repos_csv: "${steps.validate_hld.outputs.new_repos_csv}"
  infra_level: "${steps.infra_profile.outputs.level}"
  review_summary: "${steps.arch_review.outputs.summary}"
  hld_path: ".maestro/runs/${inputs.slug}/hld.md"
