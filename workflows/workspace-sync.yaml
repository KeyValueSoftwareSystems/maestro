# Fast, deterministic workspace sync used at feature boundaries. Fetch/status/fast-forward,
# provenance and commit pinning are engine-owned; Sonnet is invoked only when living docs
# genuinely need judgement-based refresh.
version: 1
name: workspace-sync
title: Sync the workspace
description: Fetch repository upstreams, safely update on approval, refresh stale knowledge, and pin commits.
inputs:
  slug: {type: string, required: true}
  checkpoint: {type: string, default: feature-start}
  # note: a failed fetch alone (offline, no access) does not stop for the person — set by a later
  # checkpoint, after the first one has already asked
  fetch_errors: {type: string, default: ask}
defaults:
  model: haiku
  agent: analyst
  max_visits: 6
start: plan
nodes:
  - id: plan
    type: script
    label: Fetch and inspect workspace
    run:
      - python3
      - .maestro/engine/workspace_sync.py
      - plan
      - --root
      - .
      - --out
      - ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/plan.json"
      - --lock
      - ".maestro/runs/${inputs.slug}/.engine/workspace-lock.json"
      - --fetch-errors
      - "${inputs.fetch_errors}"
    on_fail: abort
    routes:
      - {when: "${steps.plan.outputs.needs_attention} == true", to: sync_gate}
      - {to: lock}

  - id: sync_gate
    type: gate
    label: Workspace updates available
    prompt: |
      Maestro fetched the upstream for each repository's current branch.

      ${steps.plan.outputs.summary}

      Safe updates use fast-forward only. Dirty, detached or diverged repositories are never
      modified automatically. A documentation refresh runs only when commit provenance says
      the living domain docs or codebase maps are stale — for example after
      commits made outside Maestro. Continuing uses committed HEADs; uncommitted application
      changes are not part of the feature lock or its implementation worktrees.

      Before implementation, "Apply safe updates" moves the commits the approved design was
      grounded in and sends the run back to design (PRD, HLD and LLDs are redone and approved
      again, often hours) when an update touches code the design cites, or a migration. Pick
      "Keep current commits" unless you need the updates now; they can be pulled at the next
      feature start. With `design.sync_restart: always` in maestro.config.yaml, any moved
      commit sends the design back.
    options:
      - {id: sync, label: Apply safe updates and refresh stale docs; leave blocked repos unchanged, to: apply}
      - {id: current, label: Keep current commits; refresh stale docs, to: keep_current}
      - {id: as_is, label: Keep current commits and docs as they are, to: lock}
      - {id: reject, label: Abort the run, to: abort}
    # Autopilot never moves a person's checkouts: it keeps the current commits and refreshes
    # only the docs that are stale.
    auto: {option: current}

  # Route-only: refresh stale docs and maps at the current commits, without updating any repo.
  - id: keep_current
    type: script
    label: Refresh stale docs without updating repos
    run: [python3, .maestro/engine/entry_serve.py, "${steps.plan.outputs.refresh_needed}"]
    routes:
      - {when: "${steps.plan.outputs.refresh_needed} == true", to: map_plan}
      - {to: lock}

  - id: apply
    type: script
    label: Fast-forward approved repositories
    run:
      - python3
      - .maestro/engine/workspace_sync.py
      - apply
      - --root
      - .
      - --plan
      - "${steps.plan.outputs.plan_path}"
      - --plan-sha256
      - "${steps.plan.outputs.plan_sha256}"
      - --out
      - ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/result.json"
    on_fail: abort
    routes:
      - {when: "${steps.apply.outputs.refresh_needed} == true", to: map_plan}
      - {to: lock}

  - id: map_plan
    type: script
    label: Plan incremental map refresh
    run: [python3, .maestro/engine/codebase_scan.py, plan, --root, .]
    routes:
      - {when: "${steps.map_plan.outputs.stale} == true", to: snapshot_maps}
      - {to: snapshot_docs}

  - id: snapshot_maps
    type: script
    label: Snapshot stale maps
    run:
      - python3
      - .maestro/engine/codebase_scan.py
      - snapshot
      - --root
      - .
      - --out
      - ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/map-snapshot.json"
    on_fail: abort
    next: snapshot_docs

  - id: snapshot_docs
    type: script
    label: Snapshot living docs before refresh
    # Lets the stamp step below mark exactly the docs this refresh rewrote. --migrate first moves
    # an old-layout docs/ into one doc per domain, content unchanged.
    run: [python3, .maestro/engine/living_docs.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/docs-snapshot.json", --migrate]
    on_fail: abort
    next: snapshot_sources

  - id: snapshot_sources
    type: script
    label: Snapshot the team's source docs
    # The team's own documents (every file under docs/ Maestro does not write, plus docs.sources):
    # the writer may add to them, never rewrite them; the copies (git-ignored) let the engine
    # put them back.
    run: [python3, .maestro/engine/source_docs.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/sources"]
    on_fail: abort
    next: extract_inventory

  - id: extract_inventory
    type: script
    label: Extract the workspace inventory (engine)
    # Endpoints, calls, events, jobs, tables and config read from code and contracts, so the
    # writer never has to restate or grep for them.
    run: [python3, .maestro/engine/living_docs.py, extract, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/inventory.md"]
    on_fail: abort
    next: refresh_knowledge

  - id: refresh_knowledge
    type: agent
    label: Refresh affected workspace knowledge
    model: sonnet
    instruction: |
      Refresh only the living knowledge affected by the fetched/current commit changes.
      Read ${steps.plan.outputs.plan_path} for per-repo provenance and changed files, and, when
      the sync fast-forwarded repositories, the apply result (the `apply_result` input).

      For every stale repo, update its codebase map (docs/codebase-maps/<repo>.md) only where the changed files alter
      modules, flows, execution modes, APIs or conventions. Do not touch its engine-owned
      maestro-codebase-map marker. In the domains the changes touch, update the rows of
      docs/<domain>.md (business rules, failure behaviour, gotchas, known gaps) whose anchored
      code changed, keeping every ID stable and each fact in one section; a
      new fact takes the next free number. Invariants and change scenarios are team-owned: never
      edit them or docs/impact/side-effects.yaml (the engine restores them); when changed code
      breaks one, say so in the audit and propose the fix under §Proposed rules and scenarios.
      Update docs/architecture.md only when repos, ownership or cross-repo flows changed;
      otherwise preserve it byte-for-byte. Create missing knowledge surfaces when this is the first indexed run.
      Follow docs-format.md in the build-knowledge skill. Endpoints, events, jobs, tables,
      config and cross-repo calls are generated (the extracted inventory is the `inventory`
      input): never restate them, and never edit docs/architecture.mmd, docs/code-to-facts.md,
      a generated: block or verified_at. Preserve unrelated sections and human edits. Do not edit
      application code. Fix only what the check reports as an ERROR: warnings (token budgets,
      anchors changed, draft docs) do not fail it, and an error that needs a change outside
      docs/ (an R6 call no repository serves) is not yours; name it in the audit and stop.

      The team's own documents (the `sources` input) come first: the living docs follow them and
      cite them, never contradict them. Where the code disagrees with one, follow the document,
      add the difference to the domain doc's Open questions and known gaps, and list it in
      .maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/source-conflicts.json as
      {"conflicts":[{"source":"<its path>","source_says":"…","code_says":"…","evidence":"repo · path · symbol","doc":"docs/<domain>.md"}]}
      for a person to decide. You may add to a source document; never change or remove what it
      says (the engine puts the original back and asks a person).
      Write a concise audit of files assessed, docs changed, and why unchanged docs remained
      valid to .maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/knowledge.md.
      A person's answer on the conflicts with the team's documents, if any: ${steps.source_gate.outputs.feedback}
    skill: build-knowledge
    inputs:
      slug: "${inputs.slug}"
      checkpoint: "${inputs.checkpoint}"
      plan_path: "${steps.plan.outputs.plan_path}"
      apply_result: "${steps.apply.outputs.result_path}"
      updated_repos: "${steps.apply.outputs.updated_repos_csv}"
      inventory: ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/inventory.md"
      sources: "${steps.snapshot_sources.outputs.paths_csv}"
    outputs: [domains_written, architecture_path, summary]
    artifact:
      - docs/architecture.md
      - ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/knowledge.md"
    # Regenerates the generated files and blocks, then checks the format, IDs and anchors.
    check:
      # The team's documents first: a rewrite is put back and kept as a proposal, the conflict
      # list is checked, and the person's report is written.
      - {run: [python3, .maestro/engine/source_docs.py, guard, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/sources", --conflicts, ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/source-conflicts.json", --report, ".maestro/runs/${inputs.slug}/decisions/source-conflicts-sync.md"]}
      - {run: [python3, .maestro/engine/living_docs.py, check, --root, ., --write, --locked-from, ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/docs-snapshot.json", --report]}
    next: source_review

  - id: source_review
    type: script
    label: Any conflicts with the team's docs?
    run: [python3, .maestro/engine/source_docs.py, review, --snapshot, ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/sources"]
    routes:
      - {when: "${steps.source_review.outputs.has_source_conflicts} == true", to: source_gate}
      - {to: stamp_docs}

  - id: source_gate
    type: gate
    label: Decide the conflicts with your documents
    # Person only: no `auto:` policy, so autopilot stops here too. The team's documents win
    # until a person says otherwise.
    prompt: |
      The docs refresh found conflicts with your team's own documents. Nothing of yours was
      changed: the living docs follow your documents for now.

      ${steps.source_review.outputs.summary}
    options:
      - {id: keep, label: Keep my documents as they are — they are right, to: stamp_docs}
      - {id: apply, label: Apply Maestro's proposed edits to my documents, to: apply_sources}
      - {id: revise, label: Tell the writer what to change — then describe it, to: refresh_knowledge, input: feedback}

  - id: apply_sources
    type: script
    label: Apply the approved edits to the source docs (engine)
    # Writes each proposal only where the document is still exactly as snapshotted.
    run: [python3, .maestro/engine/source_docs.py, apply, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/sources"]
    on_fail: abort
    next: stamp_docs

  - id: stamp_docs
    type: script
    label: Stamp refreshed docs (engine)
    # verified_at = each repo's HEAD, status back to draft, only on the docs this refresh changed.
    run: [python3, .maestro/engine/living_docs.py, stamp, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/docs-snapshot.json"]
    on_fail: abort
    routes:
      # A refresh that was skipped after failing its check (`valid` stays false) verified nothing:
      # record_maps would refuse the unchanged maps and fail the whole sync, so go straight to the
      # lock, which still pins the commits.
      - {when: "${steps.refresh_knowledge.outputs.valid} == false", to: lock}
      - {when: "${steps.map_plan.outputs.stale} == true", to: record_maps}
      - {to: record_knowledge}

  - id: record_maps
    type: script
    label: Verify and record refreshed maps
    run:
      - python3
      - .maestro/engine/codebase_scan.py
      - record
      - --root
      - .
      - --snapshot
      - "${steps.snapshot_maps.outputs.snapshot_path}"
      - --snapshot-sha256
      - "${steps.snapshot_maps.outputs.snapshot_sha256}"
    on_fail: abort
    next: record_knowledge

  - id: record_knowledge
    type: script
    label: Record knowledge provenance
    run:
      - python3
      - .maestro/engine/workspace_sync.py
      - record-knowledge
      - --root
      - .
      - --evidence
      - ".maestro/runs/${inputs.slug}/.engine/sync/${inputs.checkpoint}/knowledge.md"
    on_fail: abort
    next: lock

  - id: lock
    type: script
    label: Pin exact workspace commits
    run:
      - python3
      - .maestro/engine/workspace_sync.py
      - lock
      - --root
      - .
      - --out
      - ".maestro/runs/${inputs.slug}/.engine/workspace-lock.json"
      - --result
      - "${steps.apply.outputs.result_path}"
      - --slug
      - "${inputs.slug}"
    on_fail: abort
    next: end

outputs:
  changed: "${steps.lock.outputs.changed}"
  updated: "${steps.lock.outputs.updated}"
  lock_path: "${steps.lock.outputs.lock_path}"
  lock_sha256: "${steps.lock.outputs.lock_sha256}"
