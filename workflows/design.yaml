# Design phase: requirement -> PRD, then two stages at the same time: the solution design
# (impact, sizing, HLD, contract, repository LLDs) and the functional test cases.
#
#   intake -> prd -> ( solution || tests )
#
# Composition: each stage is its own small child workflow (design-intake / -prd / -solution /
# -tests), so this file owns only the ordering. The test cases are black-box and come from the
# approved PRD alone: which cases exist and what each should observe. They need nothing the
# solution design writes, so they are written beside it, and a design revision never rewrites
# them; QA takes the exact values to check (status codes, messages, fields) from the approved
# design when it runs them. Each stage node sets `on_fail: abort`, so a rejection inside a stage
# fails this workflow.
version: 1
name: design
title: Design
description: Design a feature end-to-end, from requirement folder to approved repository designs and test cases.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  feedback: {type: string, default: "", description: revision note from the release gate (empty on first pass)}
  path: {type: string, default: auto, description: "design path: auto (sized after the PRD), full or light"}
defaults:
  model: opus
  agent: architect
  max_visits: 10
start: intake
nodes:
  - id: intake
    type: subworkflow
    label: Requirement and context
    workflow: .maestro/workflows/design-intake.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    on_fail: abort
    next: prd

  - id: prd
    type: subworkflow
    label: PRD
    workflow: .maestro/workflows/design-prd.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      project_context: "${steps.intake.outputs.project_context}"
      references: "${steps.intake.outputs.references}"
    on_fail: abort
    next: solution_and_tests

  # The solution design and the test cases both start from the approved PRD, each with its own
  # approvals; delivery starts when both are done.
  - id: solution_and_tests
    type: parallel
    label: Solution design and test cases
    join: all
    on_branch_fail: fail_all
    branches:
      - id: solution
        start: solution
        steps:
          - id: solution
            type: subworkflow
            label: Solution design
            workflow: .maestro/workflows/design-solution.yaml
            inputs:
              slug: "${inputs.slug}"
              feature: "${inputs.feature}"
              feedback: "${inputs.feedback}"
              path: "${inputs.path}"
            on_fail: abort
            next: end
      - id: tests
        start: tests
        steps:
          - id: tests
            type: subworkflow
            label: Functional test cases
            workflow: .maestro/workflows/design-tests.yaml
            inputs:
              slug: "${inputs.slug}"
              feature: "${inputs.feature}"
              feedback: "${inputs.feedback}"
            on_fail: abort
            next: end
    on_fail: abort
    next: end

outputs:
  design_path: "${steps.solution_and_tests.branches.solution.outputs.design_path}"
  hld_summary: "${steps.solution_and_tests.branches.solution.outputs.hld_summary}"
  contract_summary: "${steps.solution_and_tests.branches.solution.outputs.contract_summary}"
  # empty when the stage did not run (the light path writes no HLD or contract)
  hld_path: "${steps.solution_and_tests.branches.solution.outputs.hld_path}"
  contract_path: "${steps.solution_and_tests.branches.solution.outputs.contract_path}"
  test_cases_path: "${steps.solution_and_tests.branches.tests.outputs.test_cases_path}"
  repos_csv: "${steps.solution_and_tests.branches.solution.outputs.repos_csv}"
