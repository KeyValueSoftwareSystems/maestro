# Design phase: requirement -> PRD -> HLD (reviewed by a fresh architect, then approved) ->
# contract (only when the HLD lists cross-repository interfaces) -> repository LLDs and
# functional test cases (one run, readiness-checked, approved).
#
#   intake -> prd -> hld -> [contract] -> lld
#
# Composition: each stage is its own small child workflow (design-intake / -prd / -hld /
# -contract / -lld), so this file owns only the ordering. Every revision loop stays inside its
# stage. The contract comes before the LLDs so every repository builds against one version of
# it; the HLD validator's `interfaces_changed` decides whether it runs. Each stage node sets
# `on_fail: abort`, so a rejection inside a stage fails this workflow.
version: 1
name: design
title: Design
description: Design a feature end-to-end, from requirement folder to approved repository designs.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  feedback: {type: string, default: "", description: revision note from the release gate (empty on first pass)}
  path: {type: string, default: auto, description: "design path: auto (sized after the PRD), full or light"}
defaults:
  model: opus
  agent: architect
  max_visits: 10
start: intake
nodes:
  - id: intake
    type: subworkflow
    label: Requirement and context
    workflow: .maestro/workflows/design-intake.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    on_fail: abort
    next: prd

  - id: prd
    type: subworkflow
    label: PRD
    workflow: .maestro/workflows/design-prd.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      project_context: "${steps.intake.outputs.project_context}"
      references: "${steps.intake.outputs.references}"
    on_fail: abort
    next: greenfield_check

  # Engine-owned: no repository in the workspace yet means the HLD decides which to create and a
  # scaffold stage builds them before the contract and LLDs.
  - id: greenfield_check
    type: script
    label: Existing code or a new product?
    run: [python3, .maestro/engine/greenfield.py, check, --root, "."]
    routes:
      - {when: "${steps.greenfield_check.outputs.greenfield} == true", to: sizing}
      - {to: impact}

  # Which repositories the feature changes, and whether it crosses a boundary between them. The
  # agent judges; the engine checks the names and decides the design path and the LLD scope.
  - id: impact
    type: agent
    label: Impact assessment
    model: sonnet
    brief: minimal
    instruction: |
      Assess which repositories the approved PRD at
      .maestro/runs/${inputs.slug}/requirement/prd.md changes, and whether it changes an interface
      between repositories, stored data (a migration) or infrastructure. Use each repository's
      codebase map and only the source needed to place a change; do not design. Write the
      assessment to .maestro/runs/${inputs.slug}/impact.json.
    skill: feature-impact
    inputs:
      slug: "${inputs.slug}"
      prd_path: ".maestro/runs/${inputs.slug}/requirement/prd.md"
      impact_path: ".maestro/runs/${inputs.slug}/impact.json"
    outputs: [impact_summary, repos_csv]
    artifact: ".maestro/runs/${inputs.slug}/impact.json"
    fresh: true
    # repos_csv downstream is the engine's validated list, not the agent's claim
    check: {run: [python3, .maestro/engine/impact.py, validate, --root, ".", --impact, ".maestro/runs/${inputs.slug}/impact.json"]}
    max_visits: 3
    on_exhausted: sizing
    # the assessment only narrows the LLD scope: one that never validates is skipped
    on_fail: sizing
    next: sizing

  # Engine-owned: a small change to one repository, with no interface, infrastructure or
  # non-functional targets, skips the HLD and contract (PRD -> LLD -> readiness -> test cases ->
  # approval); everything else, the full path.
  - id: sizing
    type: script
    label: Full or light design?
    run: [python3, .maestro/engine/sizing.py, --root, ".", --prd, ".maestro/runs/${inputs.slug}/requirement/prd.md", --impact, ".maestro/runs/${inputs.slug}/impact.json", --path, "${inputs.path}"]
    routes:
      - {when: "${steps.sizing.outputs.path} == light", to: lld}
      - {to: hld}

  - id: hld
    type: subworkflow
    label: HLD and architecture review
    workflow: .maestro/workflows/design-hld.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${inputs.feedback}"
      greenfield: "${steps.greenfield_check.outputs.greenfield}"
    on_fail: abort
    routes:
      - {when: "${steps.greenfield_check.outputs.greenfield} == true", to: scaffold}
      - {when: "${steps.hld.outputs.interfaces_changed} == true", to: contract}
      - {to: lld}

  - id: scaffold
    type: subworkflow
    label: Scaffold the new repositories
    workflow: .maestro/workflows/scaffold.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    on_fail: abort
    routes:
      - {when: "${steps.hld.outputs.interfaces_changed} == true", to: contract}
      - {to: lld}

  - id: contract
    type: subworkflow
    label: API contract
    workflow: .maestro/workflows/design-contract.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${inputs.feedback}"
    on_fail: abort
    next: lld

  - id: lld
    type: subworkflow
    label: Repository LLDs and test cases
    workflow: .maestro/workflows/design-lld.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${inputs.feedback}"
      light: "${steps.sizing.outputs.path}"
      required_repos: "${steps.hld.outputs.infra_repos_csv}"
      impact_repos: "${steps.impact.outputs.repos_csv}"
    on_fail: abort
    next: end

outputs:
  design_path: "${steps.sizing.outputs.path}"
  hld_summary: "${steps.hld.outputs.hld_summary}"
  contract_summary: "${steps.contract.outputs.contract_summary}"
  # empty when the stage did not run (the light path writes no HLD or contract)
  hld_path: "${steps.hld.outputs.hld_path}"
  contract_path: "${steps.contract.outputs.contract_path}"
  test_cases_path: ".maestro/runs/${inputs.slug}/test-cases.md"
  repos_csv: "${steps.lld.outputs.repos_csv}"
