# Design phase: requirement -> PRD -> HLD (reviewed by a fresh architect, then approved) ->
# contract (only when the HLD lists cross-repository interfaces) -> repository LLDs and
# functional test cases (one run, readiness-checked, approved).
#
#   intake -> prd -> hld -> [contract] -> lld
#
# Composition: each stage is its own small child workflow (design-intake / -prd / -hld /
# -contract / -lld), so this file owns only the ordering. Every revision loop stays inside its
# stage. The contract comes before the LLDs so every repository builds against one version of
# it; the HLD validator's `interfaces_changed` decides whether it runs. Each stage node sets
# `on_fail: abort`, so a rejection inside a stage fails this workflow.
version: 1
name: design
description: Design a feature end-to-end, from requirement folder to approved repository designs.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  feedback: {type: string, default: "", description: revision note from the release gate (empty on first pass)}
defaults:
  model: opus
  agent: planner
  max_visits: 10
start: intake
nodes:
  - id: intake
    type: subworkflow
    label: Requirement and context
    workflow: .maestro/workflows/design-intake.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    on_fail: abort
    next: prd

  - id: prd
    type: subworkflow
    label: PRD
    workflow: .maestro/workflows/design-prd.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      project_context: "${steps.intake.outputs.project_context}"
      references: "${steps.intake.outputs.references}"
    on_fail: abort
    next: hld

  - id: hld
    type: subworkflow
    label: HLD and architecture review
    workflow: .maestro/workflows/design-hld.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${inputs.feedback}"
    on_fail: abort
    routes:
      - {when: "${steps.hld.outputs.interfaces_changed} == true", to: contract}
      - {to: lld}

  - id: contract
    type: subworkflow
    label: API contract
    workflow: .maestro/workflows/design-contract.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${inputs.feedback}"
    on_fail: abort
    next: lld

  - id: lld
    type: subworkflow
    label: Repository LLDs and test cases
    workflow: .maestro/workflows/design-lld.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${inputs.feedback}"
    on_fail: abort
    next: end

outputs:
  hld_summary: "${steps.hld.outputs.hld_summary}"
  contract_summary: "${steps.contract.outputs.contract_summary}"
  hld_path: ".maestro/runs/${inputs.slug}/hld.md"
  contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
  test_cases_path: ".maestro/runs/${inputs.slug}/test-cases.md"
  repos_csv: "${steps.lld.outputs.repos_csv}"
