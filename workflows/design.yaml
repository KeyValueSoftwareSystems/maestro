# Design phase: requirement -> PRD, then two stages at the same time: the plan (brainstorm, the
# plan document, its approval) and the functional test cases; then the approval is bound to the
# test cases too.
#
#   intake -> prd -> ( plan || tests ) -> bind test cases
#
# Composition: each stage is its own small child workflow (design-intake / -prd / -plan / -tests),
# so this file owns only the ordering. `path` is the invoker's choice: major (full PRD, full plan)
# or minor (mini PRD, a 5-10 line plan); nothing is inferred. The test cases are black-box and come
# from the approved PRD alone, so they are written beside the plan and a plan revision never
# rewrites them; QA takes the exact values to check (status codes, messages, fields) from the
# approved plan when it runs them. Each stage node sets `on_fail: abort`, so a rejection inside a
# stage fails this workflow.
version: 1
name: design
title: Design
description: Design a feature end-to-end, from requirement folder to an approved plan and test cases.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  feedback: {type: string, default: "", description: revision note from the release gate (empty on first pass)}
  path: {type: string, required: true, enum: [major, minor], description: "major: full PRD and plan; minor: mini PRD and a 5-10 line plan"}
defaults:
  model: opus
  agent: architect
  max_visits: 10
start: intake
nodes:
  - id: intake
    type: subworkflow
    label: Requirement and context
    say: Reading the requirement and the project context.
    workflow: .maestro/workflows/design-intake.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    on_fail: abort
    next: prd

  - id: prd
    type: subworkflow
    label: PRD
    say: Settling the product requirement.
    workflow: .maestro/workflows/design-prd.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      project_context: "${steps.intake.outputs.project_context}"
      references: "${steps.intake.outputs.references}"
      path: "${inputs.path}"
    on_fail: abort
    next: plan_and_tests

  # The plan and the test cases both start from the approved PRD; delivery starts when both are
  # done.
  - id: plan_and_tests
    type: parallel
    label: Plan and test cases
    say: Planning the change and writing the test cases.
    join: all
    on_branch_fail: fail_all
    branches:
      - id: plan
        start: plan
        steps:
          - id: plan
            type: subworkflow
            label: Plan
            say: Planning the change with you.
            workflow: .maestro/workflows/design-plan.yaml
            inputs:
              slug: "${inputs.slug}"
              feature: "${inputs.feature}"
              feedback: "${inputs.feedback}"
              path: "${inputs.path}"
            on_fail: abort
            next: end
      - id: tests
        start: tests
        steps:
          - id: tests
            type: subworkflow
            label: Functional test cases
            say: Writing the functional test cases.
            workflow: .maestro/workflows/design-tests.yaml
            inputs:
              slug: "${inputs.slug}"
              feature: "${inputs.feature}"
              feedback: "${inputs.feedback}"
            on_fail: abort
            next: end
    on_fail: abort
    next: bind_test_cases

  # Engine-owned: the plan approval (recorded inside the plan stage) is bound again with the test
  # cases now that both branches are done, so delivery's staleness check covers all three.
  - id: bind_test_cases
    type: script
    label: Bind the test cases to the approval
    say: Recording the approved plan with its test cases.
    run: [python3, .maestro/engine/plan_doc.py, approve, --root, ".", --slug, "${inputs.slug}", --test-cases, ".maestro/runs/${inputs.slug}/design/test-cases.md"]
    on_fail: abort
    next: end

outputs:
  plan_path: "${steps.plan_and_tests.branches.plan.outputs.plan_path}"
  plan_summary: "${steps.plan_and_tests.branches.plan.outputs.plan_summary}"
  test_cases_path: "${steps.plan_and_tests.branches.tests.outputs.test_cases_path}"
  repos_csv: "${steps.bind_test_cases.outputs.repos_csv}"
