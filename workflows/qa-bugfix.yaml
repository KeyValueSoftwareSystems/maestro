# Fix a product bug QA found in ONE implemented repository, on its existing feature branch and
# worktree: fix with a regression test -> engine build/lint/test -> re-review of the new diff,
# decided from the review's findings file (the fixer fixes, contests or escalates each one).
# Entered by delivery.yaml for each repository QA's diagnosis names; delivery then records the
# worktree's new HEAD, rebuilds the manifest (finalize re-checks every receipt against its commit)
# and re-runs QA.
version: 1
name: qa-bugfix
title: Fix a QA bug
description: Fix a QA-found product bug in one repository's verified worktree, re-verify and re-review it.
inputs:
  slug: {type: string, required: true}
  repo: {type: string, required: true, description: implemented repository name}
  repo_path: {type: string, required: true, description: path to the repository's main checkout}
  branch: {type: string, required: true, description: the feature branch QA tested}
  worktree: {type: string, required: true, description: the verified worktree QA tested}
  commit: {type: string, required: true, description: the commit QA tested}
  bug_report: {type: string, required: true, description: QA's product-bug diagnosis}
  stack_skills: {type: string, default: "", description: installed stack skills for this repository}
defaults:
  model: sonnet
  agent: implementer
  max_visits: 10
start: fix
nodes:
  - id: fix
    type: agent
    label: Fix the product bug
    instruction: |
      One fix attempt on branch ${inputs.branch} in exact worktree ${inputs.worktree}, starting
      from commit ${inputs.commit}. QA found a product bug in the ${inputs.repo} repository:
      read the diagnosis at ${inputs.bug_report} and the QA report beside it, and fix only what it
      names for ${inputs.repo}, against the LLD at .maestro/runs/${inputs.slug}/lld/${inputs.repo}.md
      and the contract at .maestro/runs/${inputs.slug}/openapi.yaml (when it exists). Add a
      regression test that fails before the fix and passes after it. Never weaken, skip or delete
      a test. If the fix needs a design or contract change, do not make it: escalate.
      When the engine checks or the review sent you back, address what they found:
      failing checks "${steps.verify.outputs.failed_checks}" (receipt
      ${steps.verify.outputs.receipt_path}; checks marked pre-existing fail on the base commit too
      and are not yours to fix) and blocking findings (status open or upheld) in
      .maestro/runs/${inputs.slug}/${inputs.repo}/reviews/findings.json: answer each one in
      .maestro/runs/${inputs.slug}/${inputs.repo}/reviews/resolutions.json as
      {"schema_version": 1, "resolutions": [{"id", "resolution", "note"}]} — fixed, contested
      (with the evidence; never a second time for a finding the reviewer upheld) or escalated.
      Honour any human guidance:
      ${steps.fix_gate.outputs.guidance}
      Re-run only what proves your fix (the failing test, package or file), never a whole suite:
      the engine re-runs every check after you. Commit the fix on the branch; a round that commits
      nothing goes to a person. Do NOT loop — the workflow re-invokes you if needed.
      Apply the repository's stack skills (${inputs.stack_skills}): load each installed one and
      follow its conventions; when none is listed, follow the repository's own conventions.
    skill: fix-loop
    inputs:
      slug: "${inputs.slug}"
      stack: "${inputs.repo}"
      branch: "${inputs.branch}"
      repo_path: "${inputs.repo_path}"
      worktree: "${inputs.worktree}"
      bug_report: "${inputs.bug_report}"
      verify_receipt: "${steps.verify.outputs.receipt_path}"
      review_path: ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/summary.md"
      findings_path: ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/findings.json"
      resolutions_path: ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/resolutions.json"
      guidance: "${steps.fix_gate.outputs.guidance}"
      stack_skills: "${inputs.stack_skills}"
    outputs: [fix_summary, checks_passed, escalate]
    max_visits: 3
    on_exhausted: fix_gate
    routes:
      - {when: "${steps.fix.outputs.escalate} == true", to: fix_gate}
      - {to: review_resolution}

  # Engine-owned: on the first attempt (no re-review yet) nothing is blocking and this proceeds.
  - id: review_resolution
    type: script
    label: Findings fixed, contested or escalated?
    run: [python3, .maestro/engine/findings.py, resolve, --findings, ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/findings.json", --resolutions, ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/resolutions.json"]
    max_visits: 8
    on_exhausted: fix_gate
    routes:
      - {when: "${steps.review_resolution.outputs.state} == escalate", to: fix_gate}
      - {when: "${steps.review_resolution.outputs.state} == incomplete", to: fix}
      - {to: handoff}

  - id: handoff
    type: script
    label: Verify the fixed worktree
    run: [python3, .maestro/engine/implementation_pool.py, inspect, --root, ".", --repo, "${inputs.repo}", --branch, "${inputs.branch}", --worktree, "${inputs.worktree}"]
    on_fail: abort
    next: verify

  - id: verify
    type: script
    label: Build, lint and test (engine)
    run:
      - python3
      - .maestro/engine/repo_checks.py
      - --root
      - "."
      - --repo
      - "${inputs.repo}"
      - --worktree
      - "${steps.handoff.outputs.worktree}"
      - --out
      - ".maestro/runs/${inputs.slug}/${inputs.repo}/verify.json"
      - --base-repo
      - "${inputs.repo_path}"
      - --reuse-key
      - "fix_gate-${steps.fix_gate.visits}"
    timeout: 3600
    max_visits: 6
    on_exhausted: fix_gate
    routes:
      - {when: "${steps.verify.outputs.passed} == true", to: review_scope}
      # the fix round committed nothing: the same failures stand, so a person decides
      - {when: "${steps.verify.outputs.unchanged} == true", to: fix_gate}
      - {to: fix}

  # Engine-owned: keeps the previous round's findings so the verdict can tell new ones apart.
  - id: review_scope
    type: script
    label: Previous review round
    run: [python3, .maestro/engine/review_scope.py, prepare, --dir, ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews", --name, code-review, --findings, ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/findings.json"]
    next: review

  - id: review
    type: agent
    label: Re-review the fix
    instruction: |
      Re-review the ${inputs.repo} bug fix on branch ${inputs.branch}: review only the diff from
      ${inputs.commit} (what QA tested) to ${steps.handoff.outputs.commit}, against the LLD at
      .maestro/runs/${inputs.slug}/lld/${inputs.repo}.md, the contract at
      .maestro/runs/${inputs.slug}/openapi.yaml (when it exists) and the standards. The engine ran build, lint and tests
      (${steps.verify.outputs.summary}; receipt: ${steps.verify.outputs.receipt_path}); a failure
      still listed there was accepted by a person. Existing test files this branch changed
      (engine-detected): ${steps.verify.outputs.tests_changed} — a weakened, skipped or deleted
      assertion is blocking. Confirm the regression test covers the bug in ${inputs.bug_report}.
      Read the earlier report at .maestro/runs/${inputs.slug}/${inputs.repo}/reviews/summary.md
      first, then overwrite it with the reviewed commit at the top. Write every finding to
      .maestro/runs/${inputs.slug}/${inputs.repo}/reviews/findings.json (the engine decides from
      that file; severity blocking only for must-fix issues). When it holds findings from an
      earlier round, read the fixer's resolutions at
      .maestro/runs/${inputs.slug}/${inputs.repo}/reviews/resolutions.json: mark a fixed finding
      resolved; for a contested one, mark it withdrawn when the fixer is right or upheld with your
      reason; keep finding ids stable and give new findings new ids. On such a re-review a new
      blocking finding is only for a problem the latest fix introduced (mark it
      "introduced_by_revision": true); anything you could have raised earlier goes to the person
      as late.
    skill: repo-review
    agent: reviewer
    model: opus
    inputs:
      slug: "${inputs.slug}"
      repo_path: "${inputs.repo_path}"
      worktree: "${steps.handoff.outputs.worktree}"
      commit: "${steps.handoff.outputs.commit}"
      branch: "${inputs.branch}"
      verify_receipt: "${steps.verify.outputs.receipt_path}"
      tests_changed: "${steps.verify.outputs.tests_changed}"
      lld_path: ".maestro/runs/${inputs.slug}/lld/${inputs.repo}.md"
      contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
      previous_review: ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/summary.md"
      findings_path: ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/findings.json"
      resolutions_path: ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/resolutions.json"
      fix_summary: "${steps.fix.outputs.fix_summary}"
    outputs: [review_path, blocking, summary]
    artifact:
      - ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/summary.md"
      - ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/findings.json"
    fresh: true
    max_visits: 4
    on_exhausted: fix_gate
    next: review_verdict

  # Engine-owned: blocking is decided from the findings file, not the reviewer's own flag.
  - id: review_verdict
    type: script
    label: Blocking review findings?
    run: [python3, .maestro/engine/findings.py, verdict, --findings, ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/findings.json", --previous, ".maestro/runs/${inputs.slug}/${inputs.repo}/reviews/code-review-findings.previous.json", --round, "${steps.review.visits}", --commit, "${steps.handoff.outputs.commit}", --root, "."]
    max_visits: 8
    on_exhausted: fix_gate
    routes:
      - {when: "${steps.review_verdict.outputs.valid} == false", to: review}
      - {when: "${steps.review_verdict.outputs.revise} == true", to: fix}
      # round limit reached with blocking findings open, or late ones: a person decides
      - {when: "${steps.review_verdict.outputs.blocking} == true", to: fix_gate}
      - {when: "${steps.review_verdict.outputs.late} == true", to: fix_gate}
      - {to: end}

  - id: fix_gate
    type: gate
    label: Bug-fix escalation
    prompt: |
      The QA bug fix for ${inputs.repo} needs a decision: the fixer escalated, the engine checks
      or the review still fail after the automated rounds, or a re-review raised a blocking
      finding late.
      Fix attempt: ${steps.fix.outputs.fix_summary}
      Engine checks: ${steps.verify.outputs.summary}
      Review: ${steps.review.outputs.summary}
      Blocking findings (engine): ${steps.review_verdict.outputs.summary}
      Escalated: ${steps.review_resolution.outputs.escalated_csv} ${steps.review_resolution.outputs.summary}
      Diagnosis: ${inputs.bug_report}
    options:
      - {id: retry, label: One more fix round (with your guidance), to: fix, input: guidance}
      - {id: review, label: Accept the failing checks and continue to code review, to: review_scope}
      - {id: accept, label: Keep the current commit (no code review of it) and re-run QA, to: end}
      - {id: abandon, label: Abort, to: abort}

outputs:
  commit: "${steps.handoff.outputs.commit}"
  summary: "${steps.fix.outputs.fix_summary}"
