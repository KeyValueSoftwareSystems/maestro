# A large feature: turn the request into requirements, ask the person the design questions,
# plan with them, review the plan, build and write tests in parallel, then loop on review and on
# verification until both pass, quiz the person on the change, then ship.
name: major-feature
description: Requirements, questions, plan and plan review, parallel build and tests, review and verify loops, a quiz, then ship.
max_steps: 60
steps:
  - id: intake
    agent: worker
    model: sonnet
    template: .maestro/workflows/templates/requirements.md
    instructions: |
      Rewrite ${run}/requirements.md in place, following the template. It holds the request as it
      was given: a ticket, a link or free text. Put that original text under Source, word for word.
      Keep the requester's words and add no requirement of your own. Put what is unclear under
      Open questions.

  - id: questions
    agent: worker
    run: inline
    instructions: |
      Ask the person the questions in .maestro/workflows/templates/questions.md, as that file
      says. Skip a question that ${run}/requirements.md already answers. Write each question with
      the person's answer, word for word, to ${run}/answers.md.

  - id: plan
    agent: keystone
    run: inline
    skills: {brainstorm: grill-the-idea, design: system-design}
    instructions: |
      Plan the feature in ${run}/requirements.md. The person's answers are in ${run}/answers.md:
      don't ask those again. Read .maestro/workspace.yaml and docs/architecture.md first, then
      only the domain docs for the domains this change touches or that read what it changes.
      For each real choice, show the options with their pros and cons and agree one with the person.
      Write the plan to ${run}/plan.md. Its Test plan has at least one e2e row per acceptance
      criterion. If ${run}/plan-review.md exists, also fix or dispute each open finding in it.
      Record the repos the plan touches as `repos`.

  - id: plan-review
    agent: birbal
    model: opus
    instructions: |
      Review the plan ${run}/plan.md against ${run}/requirements.md, the person's answers in
      ${run}/answers.md, and the code it will change. Write the review to ${run}/plan-review.md.
    on_fail: approve-plan

  - id: approve-plan
    mode: gate
    prompt: |
      The design and the test plan for ${slug} are in ${run}/plan.md, and the review of the plan
      is in ${run}/plan-review.md.
      Approve, or tell me what to change.
    on_reject: plan

  - id: worktree
    agent: worker
    model: haiku
    foreach: repo
    instructions: |
      In repo ${repo} (path in .maestro/workspace.yaml), create a git worktree at the absolute path of
      .maestro/worktrees/${slug}/${repo} on a new branch feat/${slug}, starting from origin's latest
      default branch. If that worktree already exists, reuse it.
      Then run the repo's `setup` command in the worktree, if it has one.
      Record the worktree path as `worktree` and the branch name as `branch`.

  - parallel:
      - id: build
        agent: brew
        model: sonnet
        foreach: repo
        instructions: |
          Build the ${repo} tasks in ${run}/plan.md in ${worktree}, with their unit tests.
          Leave the integration and e2e tests in the Test plan to the tester.
          Do not commit: a later step commits.
      - id: write-tests
        agent: litmus
        model: sonnet
        instructions: |
          Write mode. Write the integration and e2e tests in the Test plan of ${run}/plan.md,
          in the worktrees ${worktree}. Touch only test files. Do not commit: a later step commits.

  - id: commit
    agent: worker
    model: haiku
    foreach: repo
    instructions: |
      In ${worktree}, commit all changes on branch ${branch} with a one-line message in the repo's
      commit convention (otherwise Conventional Commits). If nothing changed, pass without committing.

  - id: checks
    mode: exec
    foreach: repo
    command: [build, lint, test]
    on_fail: build

  - id: code-review
    agent: birbal
    model: opus
    instructions: |
      Review the changes on branch ${branch} in ${worktree} against ${run}/plan.md.
      Write the review to ${run}/review.md.
    on_fail: fix-review

  - id: verify
    agent: litmus
    model: sonnet
    instructions: |
      Run mode. Run the whole Test plan of ${run}/plan.md in ${worktree}.
      Write the report to ${run}/test-report.md.
    on_fail: fix-tests

  - id: commit-pending-changes
    agent: worker
    model: haiku
    foreach: repo
    instructions: |
      In ${worktree}, commit all pending changes on branch ${branch} (the review and test fixes)
      with a one-line message in the repo's commit convention (otherwise Conventional Commits).
      If nothing changed, pass without committing.

  - id: quiz-write
    agent: worker
    model: sonnet
    instructions: |
      Read ${run}/plan.md and the changes on branch ${branch} in ${worktree}. Write 5 questions
      to ${run}/quiz.md, each followed by its answer:
      - 2 on the feature: what it does and why a design choice in the plan was made;
      - 3 that ask where something is done in the code, answered with file, function and line.
      Ask about this change's core logic, not trivia.

  - id: quiz
    agent: worker
    run: inline
    instructions: |
      Offer the person the quiz in ${run}/quiz.md and let them skip it. If they take it, ask
      the questions one at a time, and show each answer only after they reply. The quiz never
      fails the run.

  - id: archive
    mode: workflow
    workflow: subworkflows/archive.yaml

  # Reached only through on_fail.
  - id: fix-review
    agent: brew
    model: sonnet
    next: code-review
    instructions: |
      Fix the review findings in ${run}/review.md, in the worktrees ${worktree}, and update each
      row's Status and Note in that file.

  - id: fix-tests
    agent: brew
    model: sonnet
    next: verify
    instructions: |
      Fix the failing tests in ${run}/test-report.md, in the worktrees ${worktree}.
