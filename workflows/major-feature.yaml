# A large feature: turn the request into requirements, ask the person for a rough plan and up to
# 4 questions on it, plan with them, review the plan, build, loop on code review, then write and
# run the tests and fix the code they catch, quiz the person on the change, then ship.
name: major-feature
description: Requirements, a sketch with questions, plan and plan review, build, a review loop, tests with code fixes, a quiz, then ship.
max_steps: 60
steps:
  - id: intake
    agent: worker
    model: sonnet
    template: .maestro/workflows/templates/requirements.md
    instructions: |
      Rewrite ${run}/requirements.md in place, following the template. It holds the request as it
      was given: a ticket, a link or free text. Put that original text under Source, word for word.
      Keep the requester's words and add no requirement of your own. Put what is unclear under
      Open questions.

  - id: questions
    agent: worker
    run: inline
    instructions: |
      Ask the person for a rough plan of ${run}/requirements.md in their own words: the parts,
      the data, the flow. Any form works: notes, a list, a text or Mermaid diagram, or the path
      to an image. Don't suggest anything. Save it word for word as the first section of
      ${run}/answers.md, Sketch. Copy an image into ${run}/ and link it from Sketch.
      Then read docs/architecture.md and compare the sketch with the requirements. Ask up to 4
      questions, one at a time, on what the sketch leaves out or leaves vague. Pick from: the
      data flow, the data schema, the volume, failure cases, who may use it. Ask only about a
      topic this change touches: no schema question when nothing new is stored, no volume
      question when the data stays small. Use the names from the sketch and the code. Skip
      anything already answered, and don't suggest answers.
      Add each question with the person's answer, word for word, to ${run}/answers.md.

  - id: plan
    agent: keystone
    run: inline
    skills: {brainstorm: grill-the-idea, design: system-design}
    instructions: |
      Plan the feature in ${run}/requirements.md. The person's sketch and answers are in
      ${run}/answers.md: don't ask those again, and where your design differs from the sketch,
      say so and why. Read .maestro/workspace.yaml and docs/architecture.md first, then
      only the domain docs for the domains this change touches or that read what it changes.
      For each real choice, show the options with their pros and cons and agree one with the person.
      Write the plan to ${run}/plan.md. Its Test plan has at least one e2e row per acceptance
      criterion. If ${run}/plan-review.md exists, also fix or dispute each open finding in it.
      Record the repos the plan touches as `repos`.

  - id: plan-review
    agent: birbal
    model: opus
    instructions: |
      Review the plan ${run}/plan.md against ${run}/requirements.md, the person's answers in
      ${run}/answers.md, and the code it will change. Write the review to ${run}/plan-review.md.
    on_fail: approve-plan

  - id: approve-plan
    mode: gate
    prompt: |
      The design and the test plan for ${slug} are in ${run}/plan.md, and the review of the plan
      is in ${run}/plan-review.md.
      Approve, or tell me what to change.
    on_reject: plan

  - id: worktree
    agent: worker
    model: haiku
    instructions: |
      Create a worktree for each repo in ${repos} on a new branch feat/${slug} from origin's
      latest default branch, reusing any that exist. If .maestro/workspace.yaml has `worktrees`,
      use its `create` command. Otherwise create a git worktree in each repo at
      .maestro/worktrees/${slug}/<repo>.
      Then run each repo's `setup` command in its worktree, if it has one.
      Record `worktree` (absolute paths) and `branch` as maps keyed by repo.

  - id: build
    agent: brew
    model: sonnet
    foreach: repo
    instructions: |
      Build the ${repo} tasks in ${run}/plan.md in ${worktree}, with their unit tests.
      Leave the integration and e2e tests in the Test plan to the tester.
      Do not commit: a later step commits.

  - id: commit
    agent: worker
    model: haiku
    foreach: repo
    instructions: |
      In ${worktree}, commit all changes on branch ${branch} with a one-line message in the repo's
      commit convention (otherwise Conventional Commits). If nothing changed, pass without committing.

  - id: checks
    mode: exec
    foreach: repo
    command: [build, lint, test]
    on_fail: build

  - id: code-review
    agent: birbal
    model: opus
    instructions: |
      Review the changes on branch ${branch} in ${worktree} against ${run}/plan.md.
      Write the review to ${run}/review.md.
    on_fail: fix-review

  - id: test
    agent: litmus
    model: sonnet
    instructions: |
      Write then run. Write the integration and e2e tests in the Test plan of ${run}/plan.md in
      ${worktree}, then run the whole Test plan. Fix a test that is wrong; report a code bug.
      If ${run}/test-report.md exists, the tests are already written: run mode only. Keep its
      Failures rows. Mark a `fixed` row `closed` if its test passes, otherwise `open` with a note.
      For a `disputed` row, fix the test and mark it `closed` if the dispute is right, otherwise
      keep it `open` and say why in Note. Add rows for new failures.
      Use the `environment` commands in .maestro/workspace.yaml, if it has them, for the stack.
      Write the report to ${run}/test-report.md. Do not commit: a later step commits.
    on_fail: fix-code

  - id: commit-pending
    agent: worker
    model: haiku
    foreach: repo
    instructions: |
      In ${worktree}, commit all pending changes on branch ${branch} (the review and test fixes)
      with a one-line message in the repo's commit convention (otherwise Conventional Commits).
      If nothing changed, pass without committing.

  - id: quiz-write
    agent: worker
    model: sonnet
    instructions: |
      Read ${run}/plan.md and the changes on branch ${branch} in ${worktree}. Write 5 questions
      to ${run}/quiz.md, each followed by its answer:
      - 2 on the feature: what it does and why a design choice in the plan was made;
      - 3 that ask where something is done in the code, answered with file, function and line.
      Ask about this change's core logic, not trivia.

  - id: quiz
    agent: worker
    run: inline
    instructions: |
      Offer the person the quiz in ${run}/quiz.md and let them skip it. If they take it, ask
      the questions one at a time, and show each answer only after they reply. The quiz never
      fails the run.

  - id: archive
    mode: workflow
    workflow: subworkflows/archive.yaml

  # Reached only through on_fail.
  - id: fix-review
    agent: brew
    model: sonnet
    next: code-review
    instructions: |
      Fix the review findings in ${run}/review.md, in the worktrees ${worktree}, and update each
      row's Status and Note in that file. Then run each repo's build, lint and test commands from
      .maestro/workspace.yaml in its worktree, and fix what fails.

  - id: fix-code
    agent: brew
    model: sonnet
    next: test
    instructions: |
      Fix the `open` product failures in ${run}/test-report.md, in the worktrees ${worktree}.
      Leave the integration and e2e tests as they are. Set each row's Status to `fixed`, or to
      `disputed` with the reason in Note if you think the test is wrong. Then run each repo's
      build, lint and test commands from .maestro/workspace.yaml in its worktree, and fix what fails.
