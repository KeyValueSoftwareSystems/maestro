# Implementation phase for ONE selected repository.
#
# Showcases: a repo-parameterized workflow, engine-validated task DAGs, exact git
# handoffs, engine-run verification (build/lint/test from maestro.config.yaml), a code review
# decided from its findings file (the author fixes, contests or escalates each blocking finding),
# and a bounded fix cycle built from a visit-capped back-edge.
version: 1
name: impl
title: Implement one repository
description: Build one selected repo from its approved LLD — task DAG, sliced implementation, engine verification, review, bounded fix loop.
inputs:
  slug: {type: string, required: true}
  stack: {type: string, required: true, description: selected repository name}
  repo_path: {type: string, required: true, description: path to the selected git repository}
  worktree: {type: string, default: "", description: the feature worktree the engine created for this repository (empty - the implementer creates one)}
  branch: {type: string, default: "feature/${inputs.slug}-${inputs.stack}", description: the feature branch checked out in that worktree}
  feature: {type: string, default: "${inputs.slug}"}
  stack_skills: {type: string, default: "", description: installed stack skills for this repository (stack_skills.py)}
defaults:
  model: sonnet
  agent: implementer
  max_visits: 10
start: tasks
nodes:
  - id: tasks
    type: agent
    label: Task DAG
    instruction: |
      Produce the parallel task DAG for the ${inputs.stack} repository from its LLD at
      .maestro/runs/${inputs.slug}/lld/${inputs.stack}.md and the contract at
      .maestro/runs/${inputs.slug}/openapi.yaml (when the feature has one). Group tasks into slices with intra-group
      dependencies only and disjoint writes across groups (schema
      .maestro/engine/schemas/tasks.schema.json). If the engine's check failed, fix what it
      reported. If the LLD needs work it does not plan (a change in another repository, or an
      unplanned migration, permission change or dependency), plan what it does plan and return
      escalate true with the gap in escalation. Honour the person's guidance (the `guidance`
      input) when there is any.
    skill: repo-tasks
    inputs:
      slug: "${inputs.slug}"
      stack: "${inputs.stack}"
      schema: .maestro/engine/schemas/tasks.schema.json
      validator: .maestro/engine/validate_tasks.py
      guidance: "${steps.stop_gate.outputs.guidance}"
    outputs: [task_count, slice_count, escalate, escalation]
    artifact: ".maestro/runs/${inputs.slug}/${inputs.stack}/tasks.json"
    check: {run: [python3, .maestro/engine/validate_tasks.py, ".maestro/runs/${inputs.slug}/${inputs.stack}/tasks.json"]}
    max_visits: 3
    on_exhausted: abort
    routes:
      - {when: "${steps.tasks.outputs.escalate} == true", to: stop_gate}
      - {to: facts}

  # Engine-owned: the living-doc rows (rules, invariants, change scenarios) this repository's LLD
  # cites, so the implementer and reviewer load exactly those facts.
  - id: facts
    type: script
    label: Collect the facts the LLD cites
    run: [python3, .maestro/engine/living_docs.py, cited, --root, ".", --from, ".maestro/runs/${inputs.slug}/lld/${inputs.stack}.md", --out, ".maestro/runs/${inputs.slug}/${inputs.stack}/facts.md"]
    next: implement

  - id: implement
    type: agent
    label: Implement slices
    instruction: |
      Implement the ${inputs.stack} repository for this feature from
      .maestro/runs/${inputs.slug}/${inputs.stack}/tasks.json — every slice, with tests. The
      skill owns slice fan-out and worktree hygiene. Work against the LLD at
      .maestro/runs/${inputs.slug}/lld/${inputs.stack}.md and the contract at
      .maestro/runs/${inputs.slug}/openapi.yaml (when the feature has one), grounded in the
      maintained codebase map
      at docs/codebase-maps/${inputs.stack}.md and the living-doc facts the LLD cites at
      ${steps.facts.outputs.facts_path}: keep every invariant listed there, and when you change
      something a change scenario names, also handle and test what it says is affected. Explore
      the live source further only where the map or LLD doesn't cover what a slice
      touches. Report tests honestly. The approved LLD and contract are the human approval for
      what they describe, including tasks marked needs_human_gate: build those exactly as
      designed. When the work needs something they do not describe (an unplanned migration,
      permission change, payment logic, production config, secret or dependency upgrade, or a
      design decision that looks wrong), stop and return escalate true with the reason in
      escalation. Honour the person's guidance (the `guidance` input) when there is any.
      Apply the repository's stack skills (${inputs.stack_skills}): load each installed one and
      follow its conventions; when none is listed, follow the repository's own conventions.
    skill: repo-implement
    isolate: worktree
    inputs:
      slug: "${inputs.slug}"
      stack: "${inputs.stack}"
      tasks_path: ".maestro/runs/${inputs.slug}/${inputs.stack}/tasks.json"
      repo_path: "${inputs.repo_path}"
      worktree: "${inputs.worktree}"
      branch: "${inputs.branch}"
      guidance: "${steps.stop_gate.outputs.guidance}"
      stack_skills: "${inputs.stack_skills}"
    outputs: [branch, worktree, commit, summary, tests_passed, escalate, escalation]
    retries: 1
    max_visits: 3
    routes:
      - {when: "${steps.implement.outputs.escalate} == true", to: stop_gate}
      - {to: handoff}

  - id: stop_gate
    type: gate
    label: Implementation needs a decision
    prompt: |
      The ${inputs.stack} implementation stopped because the work needs something the approved
      design does not describe.
      Task planning: ${steps.tasks.outputs.escalation}
      Implementation: ${steps.implement.outputs.escalation}
      Continue with your guidance (it reaches the task plan and the implementation), or stop. A change
      to the design itself goes back through design: abort here and revise the LLD.
    options:
      - {id: continue, label: Continue with my guidance, to: tasks, input: guidance}
      - {id: abandon, label: Abort this stack, to: abort}

  - id: handoff
    type: script
    label: Verify live feature worktree
    run:
      - python3
      - .maestro/engine/implementation_pool.py
      - inspect
      - --root
      - "."
      - --repo
      - "${inputs.stack}"
      - --branch
      - "${steps.implement.outputs.branch}"
      - --worktree
      - "${steps.implement.outputs.worktree}"
    on_fail: abort
    max_visits: 10
    next: verify

  # The engine, not an agent, decides whether the code builds and passes its tests: it runs the
  # repo's commands from maestro.config.yaml in the exact worktree and writes a receipt.
  # A missing config fails closed (on_fail ask) instead of passing silently.
  - id: verify
    type: script
    label: Build, lint and test (engine)
    run:
      - python3
      - .maestro/engine/repo_checks.py
      - --root
      - "."
      - --repo
      - "${inputs.stack}"
      - --worktree
      - "${steps.handoff.outputs.worktree}"
      - --out
      - ".maestro/runs/${inputs.slug}/${inputs.stack}/verify.json"
      - --base-repo
      - "${inputs.repo_path}"
      - --reuse-key
      - "impl_gate-${steps.impl_gate.visits}"
    timeout: 3600
    max_visits: 10
    on_exhausted: impl_gate
    routes:
      - {when: "${steps.verify.outputs.passed} == true", to: domain_rules}
      # the fix round committed nothing: the same failures stand, so a person decides
      - {when: "${steps.verify.outputs.unchanged} == true", to: impl_gate}
      - {to: fix}

  # Engine-owned and optional: when people have written domain rules and change scenarios
  # (docs/functional/<domain>.md, docs/impact/side-effects.yaml), check this branch still matches
  # every name they rely on. Never blocks: the result goes to the reviewer. No rules: skipped.
  - id: domain_rules
    type: script
    label: Domain rules (engine)
    run: [python3, .maestro/engine/domain_rules.py, check, --root, ".", --repo, "${inputs.stack}", --worktree, "${steps.handoff.outputs.worktree}", --out, ".maestro/runs/${inputs.slug}/${inputs.stack}/domain-rules.json"]
    max_visits: 10
    on_exhausted: review_scope
    on_fail: review_scope
    next: review_scope

  # Engine-owned: keeps the previous round's findings so the verdict can tell new ones apart.
  - id: review_scope
    type: script
    label: Previous review round
    run: [python3, .maestro/engine/review_scope.py, prepare, --dir, ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews", --name, code-review, --findings, ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/findings.json"]
    next: review

  - id: review
    type: agent
    label: Code review
    instruction: |
      Review the ${inputs.stack} implementation on branch
      ${steps.handoff.outputs.branch} at exact commit ${steps.handoff.outputs.commit}
      against the LLD at .maestro/runs/${inputs.slug}/lld/${inputs.stack}.md, the contract at
      .maestro/runs/${inputs.slug}/openapi.yaml (when the feature has one), the task list at
      .maestro/runs/${inputs.slug}/${inputs.stack}/tasks.json, the functional test cases at
      .maestro/runs/${inputs.slug}/test-cases.md, the standards and the maintained codebase map
      (docs/codebase-maps/${inputs.stack}.md) — use the map to check blast radius, not
      just the diff in isolation. A change that breaks an invariant in the living-doc facts (the
      `living_doc_facts` input) or skips what a change scenario there says is affected is
      blocking. Check every task in the task list is built; look closely at the tasks marked
      needs_human_gate. The engine ran build, lint and tests
      (${steps.verify.outputs.summary}; receipt: ${steps.verify.outputs.receipt_path}); a failure
      still listed there was accepted by a person. Review the design and code, not whether it
      compiles. When the `pre_existing_checks` input names checks that also fail on the base
      commit (not this branch's doing), check the branch's own new tests by reading them, since
      that suite cannot prove them. Existing test files this branch changed are in the
      `tests_changed` input (engine-detected). For each one, state in the report
      whether the change follows the approved design; a weakened, skipped or deleted assertion
      without that basis is blocking. Findings need file:line evidence; severity blocking only
      for must-fix issues. Record the reviewed commit at the top of the report.
      When the `domain_rules_present` input is true, the workspace has domain rules and change
      scenarios: the engine's check (${steps.domain_rules.outputs.summary}; report:
      ${steps.domain_rules.outputs.report_path}) lists names the code no longer matches. A mismatch
      this branch caused, or a change that breaks a rule, is blocking; for each change scenario
      whose files this branch touches, check the places it says to check. Otherwise ignore them.
      Write every finding to .maestro/runs/${inputs.slug}/${inputs.stack}/reviews/findings.json as
      well as the report (the engine decides from that file). If it exists from an earlier round,
      this is a re-review after a fix (the `fix_summary` input says what changed): read it, the report and
      the author's resolutions at
      .maestro/runs/${inputs.slug}/${inputs.stack}/reviews/resolutions.json first; review only the
      diff from the commit the report records to this commit; mark a fixed finding resolved; for a
      contested one, mark it withdrawn when the author is right or upheld with your reason; keep
      finding ids stable and give new findings new ids. Do not re-audit unchanged code. A new blocking finding is only for a problem the fix introduced
      (mark it "introduced_by_revision": true); anything you could have raised earlier goes to the
      person as late.
      Then overwrite both files.
      Apply the repository's stack skills (${inputs.stack_skills}): load each installed one and
      follow its conventions; when none is listed, follow the repository's own conventions.
    skill: repo-review
    agent: reviewer
    model: opus
    inputs:
      slug: "${inputs.slug}"
      repo_path: "${inputs.repo_path}"
      worktree: "${steps.handoff.outputs.worktree}"
      commit: "${steps.handoff.outputs.commit}"
      branch: "${steps.handoff.outputs.branch}"
      lld_path: ".maestro/runs/${inputs.slug}/lld/${inputs.stack}.md"
      contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
      tasks_path: ".maestro/runs/${inputs.slug}/${inputs.stack}/tasks.json"
      test_cases_path: ".maestro/runs/${inputs.slug}/test-cases.md"
      living_doc_facts: "${steps.facts.outputs.facts_path}"
      verify_receipt: "${steps.verify.outputs.receipt_path}"
      tests_changed: "${steps.verify.outputs.tests_changed}"
      previous_review: ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/summary.md"
      findings_path: ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/findings.json"
      resolutions_path: ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/resolutions.json"
      fix_summary: "${steps.fix.outputs.fix_summary}"
      pre_existing_checks: "${steps.verify.outputs.pre_existing_csv}"
      domain_rules_present: "${steps.domain_rules.outputs.present}"
      domain_rules_report: "${steps.domain_rules.outputs.report_path}"
      lessons: "${memory.knowledge.${inputs.stack}-review}"
      stack_skills: "${inputs.stack_skills}"
    outputs: [review_path, blocking, summary]
    artifact:
      - ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/summary.md"
      - ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/findings.json"
    fresh: true
    max_visits: 5
    on_exhausted: impl_gate
    next: review_verdict

  # Only engine-produced signals route this loop: verify decides build/test health and
  # findings.py decides from the review's findings file. Agent-reported `blocking`,
  # `tests_passed` and `checks_passed` never do.
  - id: review_verdict
    type: script
    label: Blocking review findings?
    run: [python3, .maestro/engine/findings.py, verdict, --findings, ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/findings.json", --previous, ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/code-review-findings.previous.json", --round, "${steps.review.visits}", --commit, "${steps.handoff.outputs.commit}", --root, "."]
    max_visits: 8
    on_exhausted: impl_gate
    routes:
      - {when: "${steps.review_verdict.outputs.valid} == false", to: review}
      - {when: "${steps.review_verdict.outputs.revise} == true", to: fix}
      # round limit reached with blocking findings open, or late ones: a person decides
      - {when: "${steps.review_verdict.outputs.blocking} == true", to: impl_gate}
      - {when: "${steps.review_verdict.outputs.late} == true", to: impl_gate}
      - {to: end}

  - id: fix
    type: agent
    label: Fix findings
    instruction: |
      One fix attempt on branch ${steps.handoff.outputs.branch} in exact worktree
      ${steps.handoff.outputs.worktree}. Address what sent you here:
      - failing engine checks (the `failed_checks` input) — read the receipt at
        ${steps.verify.outputs.receipt_path} and the logs it names. Checks marked pre-existing
        (the `pre_existing_checks` input) fail on the base commit too: they are not yours to fix;
      - blocking review findings (status open or upheld) in
        .maestro/runs/${inputs.slug}/${inputs.stack}/reviews/findings.json, when that file exists:
        answer each one in .maestro/runs/${inputs.slug}/${inputs.stack}/reviews/resolutions.json as
        {"schema_version": 1, "resolutions": [{"id", "resolution", "note"}]} — fixed (the note says
        what changed), contested (the finding is wrong; the note gives the evidence from the LLD,
        contract or code; never a second time for a finding the reviewer upheld) or escalated (it
        needs a person's decision; the note states it). The report is
        ${steps.review.outputs.review_path}.
      Smallest safe fix; never weaken, skip or delete a test. Start from the implement report
      (${steps.implement.outputs.summary}) instead of rediscovering context. Before returning,
      re-run only what proves your fix (the failing test, package or file), never a whole suite or
      a pre-existing check: the engine re-runs every check after you. Commit your fix on the
      branch; a round that commits nothing goes to a person, not another round.
      If a hard stop applies (an unapproved migration, a contract or permission change, a
      dependency upgrade, or a fix that would weaken a test), make no change and return escalate
      true. Honour the person's guidance (the `guidance` input) when there is any.
      Do NOT loop — the workflow re-invokes you if needed.
      Apply the repository's stack skills (${inputs.stack_skills}): load each installed one and
      follow its conventions; when none is listed, follow the repository's own conventions.
    skill: fix-loop
    inputs:
      slug: "${inputs.slug}"
      stack: "${inputs.stack}"
      branch: "${steps.handoff.outputs.branch}"
      repo_path: "${inputs.repo_path}"
      worktree: "${steps.handoff.outputs.worktree}"
      verify_receipt: "${steps.verify.outputs.receipt_path}"
      review_path: ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/summary.md"
      findings_path: ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/findings.json"
      resolutions_path: ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/resolutions.json"
      failed_checks: "${steps.verify.outputs.failed_checks}"
      pre_existing_checks: "${steps.verify.outputs.pre_existing_csv}"
      implement_summary: "${steps.implement.outputs.summary}"
      guidance: "${steps.impl_gate.outputs.guidance}"
      stack_skills: "${inputs.stack_skills}"
    outputs: [fix_summary, checks_passed, escalate]
    max_visits: 3
    on_exhausted: impl_gate
    routes:
      - {when: "${steps.fix.outputs.escalate} == true", to: impl_gate}
      - {to: review_resolution}

  # Engine-owned: each blocking finding must be fixed, contested or escalated. An escalation, or
  # a second contest of a finding the reviewer upheld, goes to the person; a fix for failing
  # checks alone (no blocking finding) proceeds.
  - id: review_resolution
    type: script
    label: Findings fixed, contested or escalated?
    run: [python3, .maestro/engine/findings.py, resolve, --findings, ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/findings.json", --resolutions, ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/resolutions.json"]
    max_visits: 8
    on_exhausted: impl_gate
    routes:
      - {when: "${steps.review_resolution.outputs.state} == escalate", to: impl_gate}
      - {when: "${steps.review_resolution.outputs.state} == incomplete", to: fix}
      - {to: handoff}

  - id: impl_gate
    type: gate
    label: Implementation escalation
    prompt: |
      The ${inputs.stack} implementation needs a decision: the automated fix or review rounds ran
      out, the fixer escalated, or a re-review raised a blocking finding late.
      Engine checks: ${steps.verify.outputs.summary}
      Last review: ${steps.review.outputs.summary}
      Blocking findings (engine): ${steps.review_verdict.outputs.summary}
      Escalated: ${steps.review_resolution.outputs.escalated_csv} ${steps.review_resolution.outputs.summary}
      Last fix: ${steps.fix.outputs.fix_summary}
      Branch: ${steps.handoff.outputs.branch}
    options:
      - {id: retry, label: One more fix round (with your guidance), to: fix, input: guidance}
      - {id: review, label: Accept the failing checks and continue to code review, to: review_scope}
      - {id: accept, label: Accept as-is without a code review of this commit — I'll handle the rest, to: end}
      - {id: abandon, label: Abort this stack, to: abort}

outputs:
  branch: "${steps.handoff.outputs.branch}"
  worktree: "${steps.handoff.outputs.worktree}"
  commit: "${steps.handoff.outputs.commit}"
  summary: "${steps.implement.outputs.summary}"
  review_path: "${steps.review.outputs.review_path}"
  verify_receipt: "${steps.verify.outputs.receipt_path}"
