# Implementation phase for ONE selected repository.
#
# Showcases: a repo-parameterized workflow, engine-validated task DAGs, exact git
# handoffs, engine-run verification (build/lint/test from maestro.config.yaml), and a bounded
# fix cycle built from a visit-capped back-edge.
version: 1
name: impl
description: Build one selected repo from its approved LLD — task DAG, sliced implementation, engine verification, review, bounded fix loop.
inputs:
  slug: {type: string, required: true}
  stack: {type: string, required: true, description: selected repository name}
  repo_path: {type: string, required: true, description: path to the selected git repository}
  feature: {type: string, default: "${inputs.slug}"}
defaults:
  model: sonnet
  agent: implementer
  max_visits: 10
start: tasks
nodes:
  - id: tasks
    type: agent
    label: Task DAG
    instruction: |
      Produce the parallel task DAG for the ${inputs.stack} repository from its LLD at
      .maestro/runs/${inputs.slug}/lld/${inputs.stack}.md and the contract at
      .maestro/runs/${inputs.slug}/openapi.yaml. Also read approved-corrections.md; its approved
      decisions override conflicting base text. Group tasks into slices with intra-group
      dependencies only and disjoint writes across groups (schema
      .maestro/engine/schemas/tasks.schema.json). If a previous validation failed, fix what it
      reported.
    skill: repo-tasks
    agent: planner
    inputs:
      slug: "${inputs.slug}"
      stack: "${inputs.stack}"
      schema: .maestro/engine/schemas/tasks.schema.json
      validator: .maestro/engine/validate_tasks.py
    outputs: [task_count, slice_count]
    artifact: ".maestro/runs/${inputs.slug}/${inputs.stack}/tasks.json"
    max_visits: 3
    on_exhausted: abort
    next: validate_tasks

  - id: validate_tasks
    type: script
    label: Validate task DAG
    run: [python3, .maestro/engine/validate_tasks.py, ".maestro/runs/${inputs.slug}/${inputs.stack}/tasks.json"]
    max_visits: 3
    on_fail: tasks
    next: implement

  - id: implement
    type: agent
    label: Implement slices
    instruction: |
      Implement the ${inputs.stack} repository for this feature from
      .maestro/runs/${inputs.slug}/${inputs.stack}/tasks.json — every slice, with tests. The
      skill owns slice fan-out and worktree hygiene. Work against the LLD at
      .maestro/runs/${inputs.slug}/lld/${inputs.stack}.md and the contract at
      .maestro/runs/${inputs.slug}/openapi.yaml, with approved-corrections.md overriding any
      conflicting base statement, grounded in the maintained codebase map
      at ${inputs.repo_path}/docs/codebase-map.md. Explore
      the live source further only where the map or LLD doesn't cover what a slice
      touches. Report tests honestly.
    skill: repo-implement
    isolate: worktree
    inputs:
      slug: "${inputs.slug}"
      stack: "${inputs.stack}"
      tasks_path: ".maestro/runs/${inputs.slug}/${inputs.stack}/tasks.json"
      repo_path: "${inputs.repo_path}"
      branch: "feature/${inputs.slug}-${inputs.stack}"
    outputs: [branch, worktree, commit, summary, tests_passed]
    retries: 1
    max_visits: 3
    next: handoff

  - id: handoff
    type: script
    label: Verify live feature worktree
    run:
      - python3
      - .maestro/engine/implementation_pool.py
      - inspect
      - --root
      - "."
      - --repo
      - "${inputs.stack}"
      - --branch
      - "${steps.implement.outputs.branch}"
      - --worktree
      - "${steps.implement.outputs.worktree}"
    on_fail: abort
    max_visits: 10
    next: verify

  # The engine, not an agent, decides whether the code builds and passes its tests: it runs the
  # repo's commands from maestro.config.yaml in the exact worktree and writes a receipt.
  # A missing config fails closed (on_fail ask) instead of passing silently.
  - id: verify
    type: script
    label: Build, lint and test (engine)
    run:
      - python3
      - .maestro/engine/repo_checks.py
      - --root
      - "."
      - --repo
      - "${inputs.stack}"
      - --worktree
      - "${steps.handoff.outputs.worktree}"
      - --out
      - ".maestro/runs/${inputs.slug}/${inputs.stack}/verify.json"
      - --base-repo
      - "${inputs.repo_path}"
    timeout: 3600
    max_visits: 10
    on_exhausted: impl_gate
    routes:
      - {when: "${steps.verify.outputs.passed} == true", to: review}
      - {to: fix}

  - id: review
    type: agent
    label: Code review
    instruction: |
      Review the ${inputs.stack} implementation on branch
      ${steps.handoff.outputs.branch} at exact commit ${steps.handoff.outputs.commit}
      against the LLD, contract, approved-corrections.md, standards and the
      maintained codebase map (docs/codebase-map.md in the ${inputs.stack} repo) — use the
      map to check blast radius, not just the diff in isolation. Build, lint and tests already
      passed in the engine's run (receipt: ${steps.verify.outputs.receipt_path}); review the
      design and code, not whether it compiles. Existing test files this branch changed
      (engine-detected): ${steps.verify.outputs.tests_changed}. For each one, state in the report
      whether the change follows the approved design; a weakened, skipped or deleted assertion
      without that basis is blocking. Findings need file:line evidence; set blocking=true only
      for must-fix issues. Record the reviewed commit at the top of the report.
      If the report from an earlier round exists at
      .maestro/runs/${inputs.slug}/${inputs.stack}/reviews/summary.md, this is a re-review after a
      fix (${steps.fix.outputs.fix_summary}): read it first, review only the diff from the commit
      it records to this commit, confirm each earlier blocking finding is resolved, and do not
      re-audit unchanged code. Then overwrite the report.
    skill: repo-review
    agent: reviewer
    model: opus
    inputs:
      slug: "${inputs.slug}"
      repo_path: "${inputs.repo_path}"
      worktree: "${steps.handoff.outputs.worktree}"
      commit: "${steps.handoff.outputs.commit}"
      branch: "${steps.handoff.outputs.branch}"
      verify_receipt: "${steps.verify.outputs.receipt_path}"
      tests_changed: "${steps.verify.outputs.tests_changed}"
      previous_review: ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/summary.md"
      fix_summary: "${steps.fix.outputs.fix_summary}"
      lessons: "${memory.knowledge.${inputs.stack}-review}"
    outputs: [review_path, blocking, summary]
    artifact: ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/summary.md"
    fresh: true
    max_visits: 5
    on_exhausted: impl_gate
    # Only engine-produced signals route this loop: verify decides build/test health and the
    # review decides design findings. Agent-reported `tests_passed`/`checks_passed` never do.
    routes:
      - {when: "${steps.review.outputs.blocking} == true", to: fix}
      - {to: end}

  - id: fix
    type: agent
    label: Fix findings
    instruction: |
      One fix attempt on branch ${steps.handoff.outputs.branch} in exact worktree
      ${steps.handoff.outputs.worktree}. Address what sent you here:
      - failing engine checks "${steps.verify.outputs.failed_checks}" — read the receipt at
        ${steps.verify.outputs.receipt_path} and the logs it names;
      - blocking review findings in ${steps.review.outputs.review_path}, when that report exists.
      Smallest safe fix; never weaken, skip or delete a test. Start from the implement report
      (${steps.implement.outputs.summary}) instead of rediscovering context. Re-run the failing
      commands before returning; the engine re-verifies after you. Commit your fix on the branch.
      Honour any human guidance: ${steps.impl_gate.outputs.guidance}
      Do NOT loop — the workflow re-invokes you if needed.
    skill: fix-loop
    inputs:
      slug: "${inputs.slug}"
      stack: "${inputs.stack}"
      branch: "${steps.handoff.outputs.branch}"
      repo_path: "${inputs.repo_path}"
      worktree: "${steps.handoff.outputs.worktree}"
      verify_receipt: "${steps.verify.outputs.receipt_path}"
      review_path: ".maestro/runs/${inputs.slug}/${inputs.stack}/reviews/summary.md"
      implement_summary: "${steps.implement.outputs.summary}"
      guidance: "${steps.impl_gate.outputs.guidance}"
    outputs: [fix_summary, checks_passed]
    max_visits: 3
    on_exhausted: impl_gate
    next: handoff

  - id: impl_gate
    type: gate
    label: Implementation escalation
    prompt: |
      The ${inputs.stack} implementation still has problems after the automated fix
      rounds.
      Engine checks: ${steps.verify.outputs.summary}
      Last review: ${steps.review.outputs.summary}
      Branch: ${steps.handoff.outputs.branch}
    options:
      - {id: retry, label: One more fix round (with your guidance), to: fix, input: guidance}
      - {id: accept, label: Accept as-is — I'll handle the rest, to: end}
      - {id: abandon, label: Abort this stack, to: abort}

outputs:
  branch: "${steps.handoff.outputs.branch}"
  worktree: "${steps.handoff.outputs.worktree}"
  commit: "${steps.handoff.outputs.commit}"
  summary: "${steps.implement.outputs.summary}"
  review_path: "${steps.review.outputs.review_path}"
  verify_receipt: "${steps.verify.outputs.receipt_path}"
