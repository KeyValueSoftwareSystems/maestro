# Post-release phase (invoked by sdlc-main.yaml after release approval, or on its own later): a
# person confirms the archive, then deliver the verified branches and harvest lessons into memory.
#   check the release record -> confirm (person only) -> deliver (branch report, or push + pull
#   requests per maestro.config.yaml) -> harvest -> cleanup
# Nothing is merged here: a person merges the pull requests (or the reported branches).
version: 1
name: archive
title: Deliver and archive
description: Deliver the released feature's branches (or pull requests), then harvest its lessons.
inputs:
  slug: {type: string, required: true}
  feature: {type: string, default: "${inputs.slug}"}
  # Defaults let a person archive later on its own: /maestro <slug> .maestro/workflows/archive.yaml
  manifest: {type: string, default: ".maestro/runs/${inputs.slug}/implementation-manifest.json", description: engine-verified repo/branch/commit manifest}
  pack: {type: string, default: ".maestro/runs/${inputs.slug}/review-pack.md", description: the release review pack}
defaults:
  model: haiku
  agent: analyst
start: check_release
nodes:
  # Engine-owned: the release gate must have approved exactly this manifest (release.json, written
  # by delivery). Refuses an unapproved feature, or one rebuilt since the approval — which matters
  # when this workflow is run on its own.
  - id: check_release
    type: script
    label: Check the release was approved
    run: [python3, .maestro/engine/release_record.py, check, --root, ., --slug, "${inputs.slug}", --manifest, "${inputs.manifest}"]
    on_fail: abort
    next: confirm_archive

  # Always a person: no `auto:` policy, so an autopilot release stops here too. "Not now" ends the
  # stage with nothing pushed, no lessons harvested, the living docs untouched and the worktrees kept
  # (the person pushes from them); running this workflow on the slug later archives it.
  - id: confirm_archive
    type: gate
    label: Archive confirmation
    prompt: |
      Release approved. Archive this feature now?
      Archiving pushes the code (or opens pull requests) and updates the docs/ folder.
      Not now: you push the code yourself, and docs/ is not updated until you archive with
      /maestro ${inputs.slug} .maestro/workflows/archive.yaml
    options:
      - {id: archive, label: Archive now, to: deliver}
      - {id: skip, label: Not now — I will push the code myself, to: end}

  # Engine-owned: re-checks each branch is still at its verified commit, then (delivery.mode
  # pull-request) pushes it and opens or reuses a pull request — a draft when autopilot approved
  # the release. Never force-pushes; a failure (gh missing, push rejected) asks a person.
  - id: deliver
    type: script
    label: Deliver branches or pull requests
    run:
      - python3
      - .maestro/engine/deliver.py
      - --root
      - .
      - --slug
      - "${inputs.slug}"
      - --manifest
      - "${inputs.manifest}"
      - --pack
      - "${inputs.pack}"
      - --trace
      - ".maestro/runs/${inputs.slug}/ac-trace.md"
      - --assumptions
      - ".maestro/runs/${inputs.slug}/assumptions.md"
      - --release-by
      - "${steps.check_release.outputs.release_by}"
    timeout: 900
    on_fail: ask
    next: harvest

  - id: harvest
    type: subworkflow
    label: Harvest lessons into memory
    workflow: .maestro/workflows/retrospect.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    next: cleanup

  # Engine-owned and never fails the run: removes only the worktrees Maestro created, and keeps
  # any with uncommitted changes, or a configured sandbox whose branches were not pushed.
  - id: cleanup
    type: script
    label: Remove the worktrees Maestro created
    run: [python3, .maestro/engine/worktrees.py, remove, --root, ., --slug, "${inputs.slug}"]
    timeout: 900
    next: end

outputs:
  archive: "${steps.confirm_archive.outputs.choice}"
  delivery: "${steps.deliver.outputs.summary}"
  pull_requests: "${steps.deliver.outputs.pr_urls_csv}"
  worktrees: "${steps.cleanup.outputs.summary}"
