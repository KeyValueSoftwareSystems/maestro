# Post-release phase (invoked by sdlc-main.yaml after release approval, or on its own later): a
# person confirms the archive, then deliver the verified branches, file the feature's plan as
# completed and harvest lessons into memory.
#   check the release record -> confirm (person only) -> deliver (branch report, or push + pull
#   requests per maestro.config.yaml) -> plan status -> [reconcile the plan with the delivered
#   commits -> plan changes (person only, when they differ)] -> archive the plan + commit
#   -> harvest -> cleanup
# A run without an active plan (a bugfix, or a plan already archived) goes straight to harvest.
# Nothing is merged here: a person merges the pull requests (or the reported branches).
version: 1
name: archive
title: Deliver and archive
description: Deliver the released feature's branches (or pull requests), then harvest its lessons.
inputs:
  slug: {type: string, required: true}
  feature: {type: string, default: "${inputs.slug}"}
  # Defaults let a person archive later on its own: /maestro <slug> .maestro/workflows/archive.yaml
  manifest: {type: string, default: ".maestro/runs/${inputs.slug}/build/manifest.json", description: engine-verified repo/branch/commit manifest}
  pack: {type: string, default: ".maestro/runs/${inputs.slug}/release/review-pack.md", description: the release review pack}
defaults:
  model: haiku
  agent: analyst
start: check_release
nodes:
  # Engine-owned: the release gate must have approved exactly this manifest (release.json, written
  # by delivery). Refuses an unapproved feature, or one rebuilt since the approval — which matters
  # when this workflow is run on its own.
  - id: check_release
    type: script
    label: Check the release was approved
    say: Checking the release was approved.
    run: [python3, .maestro/engine/release_record.py, check, --root, ., --slug, "${inputs.slug}", --manifest, "${inputs.manifest}"]
    on_fail: abort
    next: confirm_archive

  # Always a person: no `auto:` policy, so an autopilot release stops here too. "Not now" ends the
  # stage with nothing pushed, no lessons harvested, the plan left in docs/plans/active/, the living
  # docs untouched and the worktrees kept (the person pushes from them); running this workflow on
  # the slug later archives it.
  - id: confirm_archive
    type: gate
    label: Wrap up the feature?
    say: The release is approved. One last choice before wrapping up.
    prompt: |
      Wrap up ${inputs.feature} now?
      Wrapping up delivers the code, files the plan as completed and updates the project docs, so the
      next feature starts from an accurate picture.
      ${steps.check_release.outputs.delivery_action}
    options:
      - id: archive
        label: "Archive now"
        description: "Deliver the code, file the plan (you confirm any differences from what was built first), then record the lessons."
        to: deliver
      - id: skip
        label: "Not now — I will deliver the code myself"
        description: "Nothing is delivered for you; the plan stays in docs/plans/active/ and the docs are not updated until you run /maestro ${inputs.slug} .maestro/workflows/archive.yaml."
        to: end

  # Engine-owned: re-checks each branch is still at its verified commit, then (delivery.mode
  # pull-request) pushes it and opens or reuses a pull request — a draft when autopilot approved
  # the release. Never force-pushes; a failure (gh missing, push rejected) asks a person.
  - id: deliver
    type: script
    label: Deliver the code
    say: Delivering the code to your repositories.
    run:
      - python3
      - .maestro/engine/deliver.py
      - --root
      - .
      - --slug
      - "${inputs.slug}"
      - --manifest
      - "${inputs.manifest}"
      - --pack
      - "${inputs.pack}"
      - --trace
      - ".maestro/runs/${inputs.slug}/release/ac-trace.md"
      - --assumptions
      - ".maestro/runs/${inputs.slug}/decisions/decision-log.md"
      - --release-by
      - "${steps.check_release.outputs.release_by}"
    timeout: 900
    on_fail: ask
    next: plan_status

  # Engine-owned: no active plan (a bugfix run, or the plan was archived by an earlier pass) means
  # nothing to file; the lessons are still harvested.
  - id: plan_status
    type: script
    label: Find the plan
    say: Looking for the feature's plan.
    run: [python3, .maestro/engine/plan_doc.py, status, --root, ".", --slug, "${inputs.slug}"]
    routes:
      - {when: "${steps.plan_status.outputs.active} == true", to: plan_reconcile}
      - {to: harvest}

  # Architect role: does the delivered code still match the plan? Proposes the final plan (only
  # differences the commits evidence) and a plain change list; the person picks which is kept.
  # Re-entered with the person's feedback from plan_changes.
  - id: plan_reconcile
    type: agent
    label: Compare the plan with what was built
    say: Comparing the plan with what was built.
    agent: architect
    model: sonnet
    instruction: |
      Compare the approved plan at docs/plans/active/${inputs.slug}.md (in the workspace root) with
      what was delivered. For every repository in ${inputs.manifest}, read the diff from where its
      branch left the main line to its listed commit, in its listed worktree. Start from the drift
      check's report .maestro/runs/${inputs.slug}/reviews/drift.md and its findings
      .maestro/runs/${inputs.slug}/reviews/drift.findings.json when they exist.
      The person's feedback on your last proposal (empty on the first pass): ${steps.plan_changes.outputs.feedback}

      Write the proposed final plan to .maestro/runs/${inputs.slug}/.engine/plan-final.md: the
      approved plan with only the differences the commits show applied, in the same template, its
      header's Status set to completed. Write the plain change list to
      .maestro/runs/${inputs.slug}/release/plan-changes.md (one line per difference, with the
      repository and commit that shows it; one line saying the code matches the plan when there
      are none). Change nothing the commits do not show. Do not edit the approved plan itself.
    skill: plan-reconcile
    inputs:
      slug: "${inputs.slug}"
      plan_path: "docs/plans/active/${inputs.slug}.md"
      manifest_path: "${inputs.manifest}"
      drift_report: ".maestro/runs/${inputs.slug}/reviews/drift.md"
      drift_findings: ".maestro/runs/${inputs.slug}/reviews/drift.findings.json"
      final_plan_path: ".maestro/runs/${inputs.slug}/.engine/plan-final.md"
      changes_path: ".maestro/runs/${inputs.slug}/release/plan-changes.md"
      feedback: "${steps.plan_changes.outputs.feedback}"
    outputs: [changed, summary]
    artifact:
      - ".maestro/runs/${inputs.slug}/.engine/plan-final.md"
      - ".maestro/runs/${inputs.slug}/release/plan-changes.md"
    fresh: true
    max_visits: 5
    routes:
      - {when: "${steps.plan_reconcile.outputs.changed} == true", to: plan_changes}
      - {to: plan_archive}

  # Always a person: no `auto:` policy. The code is delivered either way; this only decides which
  # version of the plan is kept as the feature's record.
  - id: plan_changes
    type: gate
    label: Plan changes
    say: What was built differs from the plan; one decision for you.
    prompt: |
      Which plan should be kept as the record of ${inputs.feature}?
      What was built differs from the approved plan. The code is already delivered; only the filed
      document changes.
      Differences: ${steps.plan_reconcile.outputs.summary}
      The full list: .maestro/runs/${inputs.slug}/release/plan-changes.md
    options:
      - id: accept
        label: "Accept — file the updated plan"
        description: "File the updated plan, which describes what was built."
        to: plan_archive_final
      - id: keep
        label: "Keep — file the plan as approved"
        description: "File the plan as approved; the differences stay only in the change list."
        to: plan_archive
      - id: edit
        label: "Edit — tell me what to change"
        description: "Tell me what to change in the update; I redo it and ask you again."
        to: plan_reconcile
        input: feedback

  # Engine-owned: move the plan to docs/plans/completed/<slug>.md with Status: completed. Refuses
  # when a completed plan already exists under the slug (never overwritten).
  - id: plan_archive
    type: script
    label: File the plan as completed
    say: Filing the plan as completed.
    run: [python3, .maestro/engine/plan_doc.py, archive, --root, ".", --slug, "${inputs.slug}"]
    on_fail: ask
    next: plan_commit

  # The same, with the reconciled plan the person accepted in place of the approved text.
  - id: plan_archive_final
    type: script
    label: File the updated plan as completed
    say: Filing the updated plan as completed.
    run: [python3, .maestro/engine/plan_doc.py, archive, --root, ".", --slug, "${inputs.slug}", --final, ".maestro/runs/${inputs.slug}/.engine/plan-final.md"]
    on_fail: ask
    next: plan_commit

  # Engine-owned: one commit of the move (and any accepted changes) in the workspace root. Never
  # fails the run: a skipped commit is reported in `say`.
  - id: plan_commit
    type: script
    label: Save the completed plan
    say: Saving the completed plan.
    run: [python3, .maestro/engine/plan_doc.py, commit, --root, ".", --slug, "${inputs.slug}", --event, completed]
    next: harvest

  - id: harvest
    type: subworkflow
    label: Record the lessons
    say: Recording the lessons from this feature.
    workflow: .maestro/workflows/retrospect.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    next: cleanup

  # Engine-owned and never fails the run: removes only the worktrees Maestro created, and keeps
  # any with uncommitted changes, or a configured sandbox whose branches were not pushed.
  - id: cleanup
    type: script
    label: "Remove the feature's working copies"
    say: Removing the working copies made for this feature.
    run: [python3, .maestro/engine/worktrees.py, remove, --root, ., --slug, "${inputs.slug}"]
    timeout: 900
    next: end

outputs:
  archive: "${steps.confirm_archive.outputs.choice}"
  delivery: "${steps.deliver.outputs.summary}"
  plan: "${steps.plan_commit.outputs.say}"
  # the completed plan's path once it was filed (empty when there was none, or not now)
  plan_path: "${steps.plan_archive.outputs.path}${steps.plan_archive_final.outputs.path}"
  plan_choice: "${steps.plan_changes.outputs.choice}"
  pull_requests: "${steps.deliver.outputs.pr_urls_csv}"
  worktrees: "${steps.cleanup.outputs.summary}"
