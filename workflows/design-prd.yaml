# Design child: the PRD, owned by the product role — two jobs and the person in between:
#
#   existing-PRD fast path -> PRD source -> [product: normalize a client PRD] -> product: prepare
#   (goal + questions) -> interview -> product: write (first write or targeted revision) -> approval
#
# The product role prepares the feature goal and the material product questions — for a client's
# own PRD, only the facts it leaves open — and writes the PRD once they are settled. A client's
# document is restructured by a worker first, so its full text never enters the lead's session. The engine
# checks both jobs on hand-off and sends a failed check back to the same job with its report.
# Entered by design.yaml after intake, which supplies the project context. The context and goal
# summaries are shown at PRD approval, where the person corrects them; every back-edge (revise,
# rescope, clarify) stays inside this child; a complete existing prd.md goes straight to approval.
version: 1
name: design-prd
title: PRD
description: Clarify and write the feature PRD, then get it approved.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  project_context: {type: string, default: "", description: project context summarized at intake}
  references: {type: string, default: "", description: where the starting references live}
defaults:
  model: opus
  agent: product
  max_visits: 10
start: check_existing_prd
nodes:
  - id: check_existing_prd
    type: script
    label: Check existing PRD fast path
    run: [python3, .maestro/engine/validate_prd.py, ".maestro/runs/${inputs.slug}/requirement/prd.md", --report, --compatible]
    routes:
      - {when: "${steps.check_existing_prd.outputs.valid} == true", to: prd_approval}
      - {to: prd_source}

  # A client PRD in another shape (or format) is restructured, not re-interviewed from scratch; a
  # short request goes through the Grill interview. A client-authored prd.md is kept as
  # prd.original.md before anything is written.
  - id: prd_source
    type: script
    label: Client PRD or short request?
    run: [python3, .maestro/engine/prd_source.py, --requirement, ".maestro/runs/${inputs.slug}/requirement"]
    routes:
      - {when: "${steps.prd_source.outputs.state} == normalize", to: normalize_prd}
      - {to: prepare_prd}

  # Product role, client PRD only: a worker restructures the client's document (which may be a
  # long office/PDF export) so the lead works from the structured PRD, never the raw sources.
  # The check is the compatible one: "(to confirm)" marks stay until the writer folds answers in.
  - id: normalize_prd
    type: agent
    label: Product — restructure the client PRD
    model: sonnet
    instruction: |
      Rewrite the client's own PRD into the required PRD structure at
      .maestro/runs/${inputs.slug}/requirement/prd.md. Sources: ${steps.prd_source.outputs.sources_csv}
      Keep the client's facts, scope, priorities and wording; move content into the matching
      section, tighten only what is unclear, and add nothing the sources do not say. Turn each
      testable requirement into an acceptance criterion. Where a section depends on a fact the
      sources leave unsettled, write the most grounded recommendation and mark it "(to confirm)".
      Do not edit the source files and do not write questions; the next step asks them.
    skill: prd-writing
    inputs:
      slug: "${inputs.slug}"
      sources: "${steps.prd_source.outputs.sources_csv}"
      project_context: "${inputs.project_context}"
      prd_validator: ".maestro/engine/validate_prd.py"
    outputs: [summary]
    artifact: ".maestro/runs/${inputs.slug}/requirement/prd.md"
    check: {run: [python3, .maestro/engine/validate_prd.py, ".maestro/runs/${inputs.slug}/requirement/prd.md", --compatible, --report]}
    max_visits: 4
    next: prepare_prd

  # Product role, job 1. The engine-owned interview persists the answers in prd-context.json.
  - id: prepare_prd
    type: agent
    execution: lead
    label: Product — goal and open questions
    instruction: |
      First restate the requested feature outcome as feature_goal, in at most two short
      sentences. Preserve the user's scope and wording; use the project context, feature seed,
      requirement files and references only; add no capability or technical design. Keep the
      goal from an earlier round unless revision feedback changes it:
      ${steps.prd_approval.outputs.feedback}

      Then build the next feature-specific Grill question queue at
      .maestro/runs/${inputs.slug}/prd-questions.json. Use the project context and feature goal,
      requirement files, explicit references, revision feedback, and earlier decisions when the
      decisions file exists. Ask only unanswered product decisions that materially change scope,
      user-visible behaviour, acceptance, or risk. Each item must resolve one decision, explain
      briefly why it matters, and include a grounded recommendation when possible. When a real
      choice exists, add up to two alternatives, each with its concrete trade-off, so the human
      can weigh options instead of only confirming yours.

      Requirement source: ${steps.prd_source.outputs.state}. When it is normalize, the client's
      own PRD is already restructured at .maestro/runs/${inputs.slug}/requirement/prd.md: work from
      that file, not the raw sources, and ask only the material product facts it leaves unsettled
      — each "(to confirm)" mark, and a missing user, limit, failure behaviour, success signal,
      non-goal, acceptance criterion, or non-functional target that changes scope or design —
      never anything it answers.

      First audit every earlier answer against that question's must_resolve facts. A saved answer
      is not automatically complete. Use only the stored answer as confirmed when its source is
      user-answer; never fill its missing facts from the unaccepted proposal. Ask focused follow-ups
      for missing facts, concrete values, or contradictions between decisions. Use a new ID for a
      follow-up so both answers remain visible. An assumption is a working answer the human could
      not confirm; a deferred decision is parked, never settled; a user-raised point is the human's
      own input that the queue must account for. Read each decision's discussion summary before
      re-asking anything the human already explored.

      Test only relevant lenses: actor permissions; lifecycle and state transitions; timing and
      limits; conflicts or concurrent actions from the user's perspective; cancel, retry, and
      recovery behaviour; invalid or stale input; notifications and external effects; privacy and
      data visibility; admin overrides; migration or backward compatibility; measurable success;
      explicit non-goals; and non-functional targets that would change the design (expected
      volume and growth, response time, availability and recovery, data retention and
      compliance, accessibility). Do not mechanically cover every lens. Do not ask about PRD headings,
      repeat a decided question, ask technical-design questions, inspect application source, or
      draft the PRD. Write schema_version 2 with 4-8 questions when several material gaps remain,
      fewer when nearly clear, and an empty questions array only after all must_resolve facts are
      explicit and no decisions conflict. Every question declares 1-4 short must_resolve facts.
      Include audit.unresolved and audit.contradictions; both must be empty with an empty queue.
      Decision log: .maestro/runs/${inputs.slug}/decision-log.md (every earlier stage's decisions).
      Never ask a topic already decided there or in this stage's decisions: give every question a
      short kebab-case `topic`; to refine a recorded answer, ask at most one follow-up with
      `follow_up_of: <its id>`. Decide from evidence first: when the requirement, an approved
      document, the code or the docs already settle a point, record it under `settled`
      ({topic, title, decision, source: "<path>[#section|:line]"}) instead of asking.
      Validate the file with the supplied deterministic validator before completing.
      If the engine's check failed, fix only the defects it names in the existing file and
      validate again — do not rebuild the queue or re-read sources.
      Run mode: ${run.mode}. In auto mode nobody answers: every recommendation is adopted as a
      logged assumption and this is the only round, so give every question a grounded
      recommendation from the evidence and put every material gap in this one queue.
      Because each recommendation then becomes the decision, never recommend behaviour, a limit
      or edge-case handling the requirement does not ask for: when a question is about behaviour
      beyond the request, recommend leaving it out and recording it as a non-goal.
    skill: prd-interview
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      project_context: "${inputs.project_context}"
      requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
      requirement_source: "${steps.prd_source.outputs.state}"
      references: "${inputs.references}"
      decisions_path: ".maestro/runs/${inputs.slug}/prd-context.json"
      validator: ".maestro/engine/validate_prd_questions.py"
      revision_feedback: "${steps.prd_approval.outputs.feedback}"
    outputs: [feature_goal, summary]
    artifact: ".maestro/runs/${inputs.slug}/prd-questions.json"
    check: {run: [python3, .maestro/engine/validate_prd_questions.py, ".maestro/runs/${inputs.slug}/prd-questions.json", --decisions, ".maestro/runs/${inputs.slug}/prd-context.json", --require-version, "2", --log, ".maestro/runs/${inputs.slug}/decision-log.json", --require-topics, --root, ".", --report]}
    max_visits: 8
    on_exhausted: clarity_limit
    routes:
      - {when: "${steps.prepare_prd.outputs.state} == clear", to: write_prd}
      - {to: prd_interview}

  - id: prd_interview
    type: interview
    label: Clarify material product decisions
    skill: prd-interview
    context: |
      Project: ${inputs.project_context}
      Feature: ${steps.prepare_prd.outputs.feature_goal}
    questions_artifact: ".maestro/runs/${inputs.slug}/prd-questions.json"
    batch_size: 12
    presentation: popup
    discuss:
      inputs:
        requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
        references: "${inputs.references}"
        project_summaries: "AGENTS.md, CLAUDE.md, docs/architecture.md, docs/functional/, docs/technical/"
    artifact: ".maestro/runs/${inputs.slug}/prd-context.json"
    # Autopilot (auto mode): recommendations become logged assumptions; one round, then write.
    auto: {modes: [auto]}
    routes:
      - {when: "${run.mode} == auto", to: write_prd}
      - {to: prepare_prd}

  - id: clarity_limit
    type: gate
    label: PRD clarity checkpoint
    prompt: |
      Eight Grill rounds are complete and unresolved product facts remain. Confirmed decisions are saved at
      .maestro/runs/${inputs.slug}/prd-context.json.

      Maestro will not write the PRD while those facts are unresolved. Continue the focused
      interview, or stop this run?
    options:
      - {id: more, label: Continue with focused questions, to: prepare_prd}
      - {id: reject, label: Abort the run, to: abort}

  # Product role, job 2: the only PRD writer. A revision is a targeted edit; only feedback that
  # needs a new product decision goes back through the Grill loop ('rescope' is the full restart).
  - id: write_prd
    type: agent
    execution: lead
    label: Product — write the PRD
    instruction: |
      PRD approval choice (empty before the first approval): ${steps.prd_approval.outputs.choice}.
      Feedback: ${steps.prd_approval.outputs.feedback}

      When the choice is revise, apply the feedback to
      .maestro/runs/${inputs.slug}/requirement/prd.md as a targeted edit. Change only the sections
      the feedback affects, plus any a decision recorded after the PRD was last written affects (a
      clarification round may have added one); keep every other section, confirmed decision, and
      AC ID unchanged.
      Read only the PRD, the confirmed decisions at .maestro/runs/${inputs.slug}/prd-context.json,
      and what the change needs — do not re-run the interview, scan the repository, or rewrite the
      PRD. If the feedback needs a new product decision the confirmed decisions cannot settle, do
      not guess: leave the PRD unchanged and return needs_clarification true.

      Otherwise, write the final PRD from the confirmed project context, feature goal,
      requirements, references, and any cumulative decisions at .maestro/runs/${inputs.slug}/prd-context.json to
      .maestro/runs/${inputs.slug}/requirement/prd.md. Do not reopen decisions or scan the
      repository. Use only stored answers, never unaccepted proposal text, for user-answer
      decisions. Create the exact twelve-section skeleton before filling it, use the shortest clear
      wording that preserves every confirmed fact, and give every in-scope confirmed behavior an
      observable AC. Never omit necessary context merely to shorten the PRD. Before completing, run
      `python3 .maestro/engine/validate_prd.py
      .maestro/runs/${inputs.slug}/requirement/prd.md --fix-mechanical`; repair any remaining named
      defect inside this same call and run it again. This is the only normal PRD write. If the
      PRD already exists from an earlier pass, update it in place: change only the sections whose
      decisions changed and keep unchanged sections and AC IDs as they are; replace every
      "(to confirm)" mark with its recorded decision.

      When the requirement source is normalize (${steps.prd_source.outputs.state}), the PRD file
      is the client's own PRD, restructured: update it in place, keeping the client's facts,
      scope, priorities and wording, and add nothing the client's document and the decisions do
      not say. Work from that file, not the raw sources.

      Return needs_clarification false unless a revision needs a new decision.
    skill: prd-writing
    inputs:
      slug: "${inputs.slug}"
      project_context: "${inputs.project_context}"
      feature_goal: "${steps.prepare_prd.outputs.feature_goal}"
      requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
      requirement_source: "${steps.prd_source.outputs.state}"
      references: "${inputs.references}"
      decisions_path: ".maestro/runs/${inputs.slug}/prd-context.json"
      prd_path: ".maestro/runs/${inputs.slug}/requirement/prd.md"
      validator: ".maestro/engine/validate_prd.py"
      approval_choice: "${steps.prd_approval.outputs.choice}"
      revision_feedback: "${steps.prd_approval.outputs.feedback}"
    outputs: [summary, needs_clarification]
    artifact: ".maestro/runs/${inputs.slug}/requirement/prd.md"
    check: {run: [python3, .maestro/engine/validate_prd.py, ".maestro/runs/${inputs.slug}/requirement/prd.md", --fix-mechanical, --report]}
    max_visits: 10
    routes:
      - {when: "${steps.write_prd.outputs.needs_clarification} == true", to: prepare_prd}
      - {to: sync_decisions}

  # Engine-owned: rebuild the feature's decision log from every stage's decisions, so later
  # stages never re-ask a decided topic and the approval shows every decision.
  - id: sync_decisions
    type: script
    label: Update the decision log
    run:
      - python3
      - .maestro/engine/decision_log.py
      - sync
      - --root
      - .
      - --log
      - ".maestro/runs/${inputs.slug}/decision-log.json"
      - --stage
      - "PRD=.maestro/runs/${inputs.slug}/prd-context.json,.maestro/runs/${inputs.slug}/prd-questions.json"
      - --stage
      - "HLD=.maestro/runs/${inputs.slug}/hld-context.json,.maestro/runs/${inputs.slug}/hld-questions.json"
      - --stage
      - "LLD=.maestro/runs/${inputs.slug}/lld-context.json,.maestro/runs/${inputs.slug}/lld-questions.json"
    next: prd_approval

  - id: prd_approval
    type: gate
    label: PRD approval
    prompt: |
      PRD ready for review at .maestro/runs/${inputs.slug}/requirement/prd.md

      ${steps.prd_source.outputs.summary}
      Decisions: ${steps.sync_decisions.outputs.summary} (${steps.sync_decisions.outputs.md_path})
      Project context (agent summary): ${inputs.project_context}
      Feature goal (agent summary): ${steps.prepare_prd.outputs.feature_goal}

      Material product decisions and relevant edge cases were clarified before writing. Confirm the concise PRD is
      accurate, and correct the context or goal here if either is wrong; design/technical concerns
      are handled later at the HLD/LLD.
    options:
      - {id: approve, label: Approve — author the HLD, to: end}
      - {id: revise, label: Request changes — targeted edit of this PRD, to: write_prd, input: feedback}
      - {id: rescope, label: Correct the feature goal and regenerate, to: prepare_prd, input: feedback}
      - {id: reject, label: Reject — abort the run, to: abort}
    # Only autopilot approves the PRD itself; design mode keeps the person on the requirement.
    auto: {option: approve, modes: [auto]}

outputs:
  prd_path: ".maestro/runs/${inputs.slug}/requirement/prd.md"
