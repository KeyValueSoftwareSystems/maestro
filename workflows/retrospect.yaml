# Harvest a finished run into memory: distill lessons (a skill's judgement) then consolidate
# (the engine's deterministic reduce step — NOT a skill, so swapping the retrospect skill
# cannot change how corroboration/promotion works).
# Standalone off-cycle harvest: /maestro <slug> workflows/retrospect.yaml
# Also reused as the harvest half of workflows/archive.yaml.
version: 1
name: retrospect
title: Lessons (retrospect)
description: Distill a finished run into staged lessons, then consolidate the memory store.
inputs:
  slug: {type: string, required: true, description: the finished feature to harvest}
  feature: {type: string, default: "${inputs.slug}"}
defaults:
  model: haiku
  agent: analyst
start: plan_maps
nodes:
  - id: plan_maps
    type: script
    label: Plan codebase-map refresh
    run: [python3, .maestro/engine/codebase_scan.py, plan, --root, .]
    routes:
      - {when: "${steps.plan_maps.outputs.stale} == true", to: snapshot_maps}
      - {to: snapshot_docs}

  - id: snapshot_maps
    type: script
    label: Snapshot maps before refresh
    run: [python3, .maestro/engine/codebase_scan.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/retrospect/map-snapshot.json"]
    on_fail: abort
    next: snapshot_docs

  - id: snapshot_docs
    type: script
    label: Snapshot living docs before the refresh
    # --migrate first moves an old-layout docs/ into one doc per domain, content unchanged.
    run: [python3, .maestro/engine/living_docs.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/retrospect/docs-snapshot.json", --migrate]
    on_fail: abort
    next: snapshot_sources

  - id: snapshot_sources
    type: script
    label: Snapshot the team's source docs
    # The team's own documents (every file under docs/ Maestro does not write, plus docs.sources):
    # the writer may add to them, never rewrite them; the copies (git-ignored) let the engine
    # put them back.
    run: [python3, .maestro/engine/source_docs.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/retrospect/sources"]
    on_fail: abort
    next: extract_inventory

  - id: extract_inventory
    type: script
    label: Extract the workspace inventory (engine)
    run: [python3, .maestro/engine/living_docs.py, extract, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/retrospect/inventory.md"]
    on_fail: abort
    next: retrospect

  - id: retrospect
    type: agent
    label: Distill lessons
    instruction: |
      Harvest the finished run for feature "${inputs.slug}". Read its ledger
      .maestro/runs/${inputs.slug}/state.yaml (gate decisions + their feedback/guidance text;
      per-step visits/attempts/status showing loops and retries) and the run's review/QA
      artifacts and design documents under .maestro/runs/${inputs.slug}/ (requirement/, design/,
      decisions/, reviews/, build/, qa/, release/; .engine/ holds only the engine's working
      files). Then do BOTH:
      1. Add to / refresh the living docs — each touched domain's docs/<domain>.md AND the
         architecture — in the shared format (docs-format.md in the build-knowledge skill).
         Product sections: the business rules the feature added or changed (BR rows with edge
         and source, from the approved PRD and gate feedback), new states, flows, terms and open
         questions. Engineering sections: failure behaviour and gotchas the reviews raised, and
         the invariants and change scenarios the run relied on or discovered as proposals
         (§Proposed rules and scenarios, with the anchor that enforces each), for the team to
         accept. Say each fact once, in its own section; cite it by ID elsewhere. Invariants and change scenarios are team-owned: never edit §Invariants and consistency, §Change scenarios, §Platform-wide
         invariants or docs/impact/side-effects.yaml (the engine restores them); write what you
         find under §Proposed rules and scenarios instead.
         Architecture: new repos or providers, cross-repo flows, and a Domain map row for any
         NEW domain (which gets its own docs/<domain>.md). A new business rule takes the next
         free ID; never renumber or reuse one; a fact the feature made untrue becomes
         `Retired YYYY-MM-DD: <why>`. Never restate what the extracted inventory (the
         `inventory` input) lists, and never edit docs/architecture.mmd, docs/code-to-facts.md,
         a generated: block or verified_at — the engine regenerates and stamps them. ALSO refresh each
         affected repo's codebase map (docs/codebase-maps/<repo>.md): run
         `python3 .maestro/engine/codebase_scan.py plan` to get, per repo, the files changed
         since the map was last recorded — update ONLY those areas (new/changed flows,
         execution modes, APIs, conventions); a repo reported `current` is unchanged, skip it.
         Do NOT touch the `<!-- maestro-codebase-map commit=… -->` marker — the engine restamps
         it next. Skip only a surface the feature genuinely did not affect.
      2. Write a STRUCTURED lessons drop to .maestro/memory/incoming/${inputs.slug}.json as
         JSON: {"slug": "${inputs.slug}", "lessons": [{"domain": "<role>",
         "key": "<stable-kebab-key>", "text": "<one actionable sentence>"}, ...]}. Draw the
         lessons from TWO sources: (a) the changes the USER requested — every revise/review
         request and gate feedback/guidance, PLUS the out-of-band instructions in the
         ledger's `notes`, i.e. where the run had to be corrected to meet the requirement
         (read .maestro/runs/${inputs.slug}/requirement/ to frame the gap); and
         (b) the ISSUES faced while running — failed/retried steps, loops that hit their cap,
         contract/QA/build breakages. Phrase each as forward-looking guidance so the next run
         gets it right first time. Choose each `key` so another run seeing the same pattern
         picks the SAME key (that is how the engine corroborates). Do NOT set authoritative.
         Do NOT write knowledge/ or candidates/ — the engine renders those.
      The team's own documents (the `sources` input) come first: the living docs follow them and
      cite them, never contradict them. Where the code disagrees with one, follow the document,
      add the difference to the domain doc's Open questions and known gaps, and list it in
      .maestro/runs/${inputs.slug}/.engine/retrospect/source-conflicts.json as
      {"conflicts":[{"source":"<its path>","source_says":"…","code_says":"…","evidence":"repo · path · symbol","doc":"docs/<domain>.md"}]}
      for a person to decide. You may add to a source document; never change or remove what it
      says (the engine puts the original back and asks a person).
      Fix only what the docs check reports as an ERROR: warnings (token budgets, anchors changed,
      draft docs) do not fail it, and an error that needs a change outside docs/ (an R6 call no
      repository serves) is not yours; say so in your summary and stop.
      A person's answer on the conflicts with the team's documents, if any: ${steps.source_gate.outputs.feedback}
    skill: retrospect
    model: sonnet
    inputs:
      slug: "${inputs.slug}"
      inventory: ".maestro/runs/${inputs.slug}/.engine/retrospect/inventory.md"
      sources: "${steps.snapshot_sources.outputs.paths_csv}"
    outputs: [incoming_path, lessons_count, summary]
    artifact: ".maestro/memory/incoming/${inputs.slug}.json"
    # Regenerates the generated files and blocks, then checks the format, IDs and anchors.
    check:
      # The team's documents first: a rewrite is put back and kept as a proposal, the conflict
      # list is checked, and the person's report is written.
      - {run: [python3, .maestro/engine/source_docs.py, guard, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/retrospect/sources", --conflicts, ".maestro/runs/${inputs.slug}/.engine/retrospect/source-conflicts.json", --report, ".maestro/runs/${inputs.slug}/decisions/source-conflicts-retrospect.md"]}
      - {run: [python3, .maestro/engine/living_docs.py, check, --root, ., --write, --locked-from, ".maestro/runs/${inputs.slug}/.engine/retrospect/docs-snapshot.json", --report]}
    next: source_review

  - id: source_review
    type: script
    label: Any conflicts with the team's docs?
    run: [python3, .maestro/engine/source_docs.py, review, --snapshot, ".maestro/runs/${inputs.slug}/.engine/retrospect/sources"]
    routes:
      - {when: "${steps.source_review.outputs.has_source_conflicts} == true", to: source_gate}
      - {to: stamp_docs}

  - id: source_gate
    type: gate
    label: Decide the conflicts with your documents
    # Person only: no `auto:` policy, so autopilot stops here too. The team's documents win
    # until a person says otherwise.
    prompt: |
      The docs refresh found conflicts with your team's own documents. Nothing of yours was
      changed: the living docs follow your documents for now.

      ${steps.source_review.outputs.summary}
    options:
      - {id: keep, label: Keep my documents as they are — they are right, to: stamp_docs}
      - {id: apply, label: Apply Maestro's proposed edits to my documents, to: apply_sources}
      - {id: revise, label: Tell the writer what to change — then describe it, to: retrospect, input: feedback}

  - id: apply_sources
    type: script
    label: Apply the approved edits to the source docs (engine)
    # Writes each proposal only where the document is still exactly as snapshotted.
    run: [python3, .maestro/engine/source_docs.py, apply, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/retrospect/sources"]
    on_fail: abort
    next: stamp_docs

  - id: stamp_docs
    type: script
    label: Stamp refreshed docs (engine)
    run: [python3, .maestro/engine/living_docs.py, stamp, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/retrospect/docs-snapshot.json"]
    on_fail: abort
    routes:
      # Skipped after failing its check (`valid` stays false): the docs were not verified, so
      # recording map commits and provenance would only be refused and send the agent round again.
      # The lessons it wrote are still folded into memory.
      - {when: "${steps.retrospect.outputs.valid} == false", to: consolidate}
      - {when: "${steps.plan_maps.outputs.stale} == true", to: record_maps}
      - {to: record_knowledge}

  - id: record_maps
    type: script
    label: Record codebase-map commits (engine)
    # Stamp each repo's current HEAD into its map's marker (docs/codebase-maps/<repo>.md) so the
    # NEXT feature refreshes only the diff. Engine-owned (not the skill) so swapping retrospect
    # can't change how incremental tracking works.
    run: [python3, .maestro/engine/codebase_scan.py, record, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/retrospect/map-snapshot.json", --snapshot-sha256, "${steps.snapshot_maps.outputs.snapshot_sha256}"]
    on_fail: retrospect
    next: record_knowledge

  - id: record_knowledge
    type: script
    label: Record living-doc provenance (engine)
    run: [python3, .maestro/engine/workspace_sync.py, record-knowledge, --root, ., --evidence, ".maestro/memory/incoming/${inputs.slug}.json"]
    on_fail: abort
    next: consolidate

  - id: consolidate
    type: script
    label: Consolidate memory (engine)
    # Deterministic reduce step: fold incoming/* into candidates/, count DISTINCT runs,
    # promote past the threshold (config memory.promote_threshold, else 3) into knowledge/,
    # prune/cap, rewrite index.md, clear incoming. Owned by the engine, not a skill.
    run: [python3, .maestro/engine/mem_consolidate.py, ".maestro/memory"]
    next: end
