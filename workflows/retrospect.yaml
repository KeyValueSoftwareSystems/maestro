# Harvest a finished run into memory: distill lessons (a skill's judgement) then consolidate
# (the engine's deterministic reduce step — NOT a skill, so swapping the retrospect skill
# cannot change how corroboration/promotion works).
# Standalone off-cycle harvest: /maestro <slug> workflows/retrospect.yaml
# Also reused as the harvest half of workflows/archive.yaml.
version: 1
name: retrospect
title: Lessons (retrospect)
description: Distill a finished run into staged lessons, then consolidate the memory store.
inputs:
  slug: {type: string, required: true, description: the finished feature to harvest}
  feature: {type: string, default: "${inputs.slug}"}
defaults:
  model: haiku
  agent: analyst
start: plan_maps
nodes:
  - id: plan_maps
    type: script
    label: Plan codebase-map refresh
    run: [python3, .maestro/engine/codebase_scan.py, plan, --root, .]
    routes:
      - {when: "${steps.plan_maps.outputs.stale} == true", to: snapshot_maps}
      - {to: snapshot_docs}

  - id: snapshot_maps
    type: script
    label: Snapshot maps before refresh
    run: [python3, .maestro/engine/codebase_scan.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/retrospect-map-snapshot.json"]
    on_fail: abort
    next: snapshot_docs

  - id: snapshot_docs
    type: script
    label: Snapshot living docs before the refresh
    run: [python3, .maestro/engine/living_docs.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/retrospect-docs-snapshot.json"]
    on_fail: abort
    next: extract_inventory

  - id: extract_inventory
    type: script
    label: Extract the workspace inventory (engine)
    run: [python3, .maestro/engine/living_docs.py, extract, --root, ., --out, ".maestro/runs/${inputs.slug}/retrospect-inventory.md"]
    on_fail: abort
    next: retrospect

  - id: retrospect
    type: agent
    label: Distill lessons
    instruction: |
      Harvest the finished run for feature "${inputs.slug}". Read its ledger
      .maestro/runs/${inputs.slug}/state.yaml (gate decisions + their feedback/guidance text;
      per-step visits/attempts/status showing loops and retries) and the run's review/QA
      artifacts and design documents under .maestro/runs/${inputs.slug}/. Then do BOTH:
      1. Add to / refresh the living docs — functional, technical AND architectural — for the
         domains this feature touched, in the shared format (docs-format.md in the
         build-knowledge skill). Functional: the business rules the feature added or changed
         (BR rows with edge and source, from the approved PRD and gate feedback), new states,
         flows, terms and open questions. Technical: the invariants the design relies on (INV
         rows: what enforces each, the test that proves it), the change scenarios the run
         discovered (CS rows), failure behaviour and gotchas the reviews raised.
         Architecture: new repos or providers, cross-repo flows, platform-wide invariants, and
         a Domain map row for any NEW domain (which gets both files). A new fact takes the next
         free ID; never renumber or reuse one; a fact the feature made untrue becomes
         `Retired YYYY-MM-DD: <why>`. Never restate what the extracted inventory (the
         `inventory` input) lists, and never edit docs/_generated/, docs/_index/, a generated:
         block or verified_at — the engine regenerates and stamps them. ALSO refresh each
         affected repo's codebase map (docs/codebase-maps/<repo>.md): run
         `python3 .maestro/engine/codebase_scan.py plan` to get, per repo, the files changed
         since the map was last recorded — update ONLY those areas (new/changed flows,
         execution modes, APIs, conventions); a repo reported `current` is unchanged, skip it.
         Do NOT touch the `<!-- maestro-codebase-map commit=… -->` marker — the engine restamps
         it next. Skip only a surface the feature genuinely did not affect.
      2. Write a STRUCTURED lessons drop to .maestro/memory/incoming/${inputs.slug}.json as
         JSON: {"slug": "${inputs.slug}", "lessons": [{"domain": "<role>",
         "key": "<stable-kebab-key>", "text": "<one actionable sentence>"}, ...]}. Draw the
         lessons from TWO sources: (a) the changes the USER requested — every revise/review
         request and gate feedback/guidance, PLUS the out-of-band instructions in the
         ledger's `notes`, i.e. where the run had to be corrected to meet the requirement
         (read .maestro/runs/${inputs.slug}/requirement/ to frame the gap); and
         (b) the ISSUES faced while running — failed/retried steps, loops that hit their cap,
         contract/QA/build breakages. Phrase each as forward-looking guidance so the next run
         gets it right first time. Choose each `key` so another run seeing the same pattern
         picks the SAME key (that is how the engine corroborates). Do NOT set authoritative.
         Do NOT write knowledge/ or candidates/ — the engine renders those.
    skill: retrospect
    model: sonnet
    inputs:
      slug: "${inputs.slug}"
      inventory: ".maestro/runs/${inputs.slug}/retrospect-inventory.md"
    outputs: [incoming_path, lessons_count, summary]
    artifact: ".maestro/memory/incoming/${inputs.slug}.json"
    # Regenerates the generated files and blocks, then checks the format, IDs and anchors.
    check: {run: [python3, .maestro/engine/living_docs.py, check, --root, ., --write, --report]}
    next: stamp_docs

  - id: stamp_docs
    type: script
    label: Stamp refreshed docs (engine)
    run: [python3, .maestro/engine/living_docs.py, stamp, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/retrospect-docs-snapshot.json"]
    on_fail: abort
    routes:
      - {when: "${steps.plan_maps.outputs.stale} == true", to: record_maps}
      - {to: record_knowledge}

  - id: record_maps
    type: script
    label: Record codebase-map commits (engine)
    # Stamp each repo's current HEAD into its map's marker (docs/codebase-maps/<repo>.md) so the
    # NEXT feature refreshes only the diff. Engine-owned (not the skill) so swapping retrospect
    # can't change how incremental tracking works.
    run: [python3, .maestro/engine/codebase_scan.py, record, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/retrospect-map-snapshot.json", --snapshot-sha256, "${steps.snapshot_maps.outputs.snapshot_sha256}"]
    on_fail: retrospect
    next: record_knowledge

  - id: record_knowledge
    type: script
    label: Record living-doc provenance (engine)
    run: [python3, .maestro/engine/workspace_sync.py, record-knowledge, --root, ., --evidence, ".maestro/memory/incoming/${inputs.slug}.json"]
    on_fail: abort
    next: consolidate

  - id: consolidate
    type: script
    label: Consolidate memory (engine)
    # Deterministic reduce step: fold incoming/* into candidates/, count DISTINCT runs,
    # promote past the threshold (config memory.promote_threshold, else 3) into knowledge/,
    # prune/cap, rewrite index.md, clear incoming. Owned by the engine, not a skill.
    run: [python3, .maestro/engine/mem_consolidate.py, ".maestro/memory"]
    next: end
