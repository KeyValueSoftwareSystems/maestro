# Harvest a finished run into memory: distill lessons (a skill's judgement) then consolidate
# (the engine's deterministic reduce step — NOT a skill, so swapping the retrospect skill
# cannot change how corroboration/promotion works).
# Standalone off-cycle harvest: /maestro <slug> workflows/retrospect.yaml
# Also reused as the harvest half of workflows/archive.yaml.
version: 1
name: retrospect
title: Lessons (retrospect)
description: Distill a finished run into staged lessons, then consolidate the memory store.
inputs:
  slug: {type: string, required: true, description: the finished feature to harvest}
  feature: {type: string, default: "${inputs.slug}"}
defaults:
  model: haiku
  agent: analyst
start: plan_maps
nodes:
  - id: plan_maps
    type: script
    label: Plan the code map refresh
    say: Checking which code maps need a refresh.
    run: [python3, .maestro/engine/codebase_scan.py, plan, --root, .]
    routes:
      - {when: "${steps.plan_maps.outputs.stale} == true", to: snapshot_maps}
      - {to: snapshot_docs}

  - id: snapshot_maps
    type: script
    label: Save the code maps
    say: Saving a copy of the code maps before the refresh.
    run: [python3, .maestro/engine/codebase_scan.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/retrospect/map-snapshot.json"]
    on_fail: abort
    next: snapshot_docs

  - id: snapshot_docs
    type: script
    label: Save the docs
    say: Saving a copy of the docs before the refresh.
    run: [python3, .maestro/engine/living_docs.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/retrospect/docs-snapshot.json"]
    on_fail: abort
    next: extract_inventory

  - id: extract_inventory
    type: script
    label: List what the code contains
    say: Listing what the code contains.
    run: [python3, .maestro/engine/living_docs.py, extract, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/retrospect/inventory.md"]
    on_fail: abort
    next: retrospect

  - id: retrospect
    type: agent
    label: Distill the lessons
    say: Distilling the lessons from this feature.
    instruction: |
      Harvest the finished run for feature "${inputs.slug}". Read its ledger
      .maestro/runs/${inputs.slug}/state.yaml (gate decisions + their feedback/guidance text;
      per-step visits/attempts/status showing loops and retries), the feature's completed plan
      docs/plans/completed/${inputs.slug}.md (the record of what was built and why: its decisions,
      repositories, interfaces and data changes; a run without a plan, such as a bugfix, has none)
      and the run's requirement, review and QA artifacts under .maestro/runs/${inputs.slug}/
      (requirement/, design/, decisions/, reviews/, build/, qa/, release/; .engine/ holds only the
      engine's working files). Then do BOTH:
      1. Add to / refresh the living docs — functional, technical AND architectural — for the
         domains this feature touched, in the shared format (docs-format.md in the
         build-knowledge skill). Functional: the business rules the feature added or changed
         (BR rows with edge and source, from the approved PRD and gate feedback), new states,
         flows, terms and open questions. Technical: failure behaviour and gotchas the reviews
         raised, and the invariants and change scenarios the run relied on or discovered as
         proposals (§Proposed rules and scenarios, with the anchor that enforces each), for the
         team to accept. Invariants and change scenarios are team-owned: never edit §Invariants and consistency, §Change scenarios, §Platform-wide
         invariants or docs/impact/side-effects.yaml (the engine restores them); write what you
         find under §Proposed rules and scenarios instead.
         Architecture: new repos or providers, cross-repo flows, and a Domain map row for any
         NEW domain (which gets both files). A new business rule takes the next
         free ID; never renumber or reuse one; a fact the feature made untrue becomes
         `Retired YYYY-MM-DD: <why>`. Never restate what the extracted inventory (the
         `inventory` input) lists, and never edit docs/_generated/, docs/_index/, a generated:
         block or verified_at — the engine regenerates and stamps them. ALSO refresh each
         affected repo's codebase map (docs/codebase-maps/<repo>.md): run
         `python3 .maestro/engine/codebase_scan.py plan` to get, per repo, the files changed
         since the map was last recorded — update ONLY those areas (new/changed flows,
         execution modes, APIs, conventions); a repo reported `current` is unchanged, skip it.
         Do NOT touch the `<!-- maestro-codebase-map commit=… -->` marker — the engine restamps
         it next. Skip only a surface the feature genuinely did not affect.
      2. Write a STRUCTURED lessons drop to .maestro/memory/incoming/${inputs.slug}.json as
         JSON: {"slug": "${inputs.slug}", "lessons": [{"domain": "<role>",
         "key": "<stable-kebab-key>", "text": "<one actionable sentence>"}, ...]}. Draw the
         lessons from TWO sources: (a) the changes the USER requested — every revise/review
         request and gate feedback/guidance, PLUS the out-of-band instructions in the
         ledger's `notes`, i.e. where the run had to be corrected to meet the requirement
         (read .maestro/runs/${inputs.slug}/requirement/ to frame the gap); and
         (b) the ISSUES faced while running — failed/retried steps, loops that hit their cap,
         contract/QA/build breakages. Phrase each as forward-looking guidance so the next run
         gets it right first time. Choose each `key` so another run seeing the same pattern
         picks the SAME key (that is how the engine corroborates). Do NOT set authoritative.
         Do NOT write knowledge/ or candidates/ — the engine renders those.
      Fix only what the docs check reports as an ERROR: warnings (token budgets, anchors changed,
      draft docs) do not fail it, and an error that needs a change outside docs/ (an R6 call no
      repository serves) is not yours; say so in your summary and stop.
    skill: retrospect
    model: sonnet
    inputs:
      slug: "${inputs.slug}"
      plan_path: "docs/plans/completed/${inputs.slug}.md"
      inventory: ".maestro/runs/${inputs.slug}/.engine/retrospect/inventory.md"
    outputs: [incoming_path, lessons_count, summary]
    artifact: ".maestro/memory/incoming/${inputs.slug}.json"
    # Regenerates the generated files and blocks, then checks the format, IDs and anchors.
    check: {run: [python3, .maestro/engine/living_docs.py, check, --root, ., --write, --locked-from, ".maestro/runs/${inputs.slug}/.engine/retrospect/docs-snapshot.json", --report]}
    next: stamp_docs

  - id: stamp_docs
    type: script
    label: Mark the docs as refreshed
    say: Marking the docs as refreshed.
    run: [python3, .maestro/engine/living_docs.py, stamp, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/retrospect/docs-snapshot.json"]
    on_fail: abort
    routes:
      # Skipped after failing its check (`valid` stays false): the docs were not verified, so
      # recording map commits and provenance would only be refused and send the agent round again.
      # The lessons it wrote are still folded into memory.
      - {when: "${steps.retrospect.outputs.valid} == false", to: consolidate}
      - {when: "${steps.plan_maps.outputs.stale} == true", to: record_maps}
      - {to: record_knowledge}

  - id: record_maps
    type: script
    label: Record what the code maps cover
    say: Recording which code the maps describe.
    # Stamp each repo's current HEAD into its map's marker (docs/codebase-maps/<repo>.md) so the
    # NEXT feature refreshes only the diff. Engine-owned (not the skill) so swapping retrospect
    # can't change how incremental tracking works.
    run: [python3, .maestro/engine/codebase_scan.py, record, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/retrospect/map-snapshot.json", --snapshot-sha256, "${steps.snapshot_maps.outputs.snapshot_sha256}"]
    on_fail: retrospect
    next: record_knowledge

  - id: record_knowledge
    type: script
    label: Record where the docs came from
    say: "Recording where the docs' facts came from."
    run: [python3, .maestro/engine/workspace_sync.py, record-knowledge, --root, ., --evidence, ".maestro/memory/incoming/${inputs.slug}.json"]
    on_fail: abort
    next: consolidate

  - id: consolidate
    type: script
    label: Fold the lessons into memory
    say: Folding the lessons into memory.
    # Deterministic reduce step: fold incoming/* into candidates/, count DISTINCT runs,
    # promote past the threshold (config memory.promote_threshold, else 3) into knowledge/,
    # prune/cap, rewrite index.md, clear incoming. Owned by the engine, not a skill.
    run: [python3, .maestro/engine/mem_consolidate.py, ".maestro/memory"]
    next: end
