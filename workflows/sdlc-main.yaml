# The full KeyValue AI-SDLC pipeline — the default workflow behind the Maestro skill.
#
#   design -> architecture review -> gates -> repo implementation pool -> verified
#   test-context manifest -> QA -> review pack -> release
#   gate -> archive (stub)
#
# Every producing step writes an artifact under .maestro/runs/<slug>/ and the engine gates
# on it ("proof, not promises"). Human gates own every irreversible decision; their
# revise options are back-edges that cascade-reset everything downstream.
version: 1
name: sdlc-main
description: Full feature pipeline — requirement to release-ready review pack.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  upgrade_manifest: {type: string, default: "", description: engine-created one-time legacy run import plan}
defaults:
  model: haiku
  agent: general
  max_visits: 10
start: workspace_sync_initial
nodes:
  - id: workspace_sync_initial
    type: subworkflow
    label: Workspace sync (feature start)
    workflow: .maestro/workflows/workspace-sync.yaml
    inputs: {slug: "${inputs.slug}", checkpoint: feature-start}
    next: design

  - id: design
    type: subworkflow
    label: Design phase
    workflow: .maestro/workflows/design.yaml
    # `feedback` carries a revise gate's note back into the design phase so a regenerated
    # design knows WHY it was sent back. Empty on the first pass (resolves to "").
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${steps.contract_approval.outputs.feedback} ${steps.release_approval.outputs.feedback}"
      upgrade_manifest: "${inputs.upgrade_manifest}"
    max_visits: 4
    next: effective_design

  - id: arch_design_revision
    type: subworkflow
    label: Scoped architecture-review revision
    workflow: .maestro/workflows/design.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${steps.arch_gate.outputs.feedback}"
      revision_mode: "${steps.arch_gate.outputs.choice}"
      revision_scope: "${steps.arch_review_validate.outputs.revision_scope}"
      affected_repos: "${steps.arch_review_validate.outputs.affected_repos_csv}"
      correction_text: "${steps.arch_review_validate.outputs.correction_text}"
      upgrade_manifest: "${inputs.upgrade_manifest}"
    max_visits: 4
    next: effective_design

  - id: effective_design
    type: script
    label: Freeze effective design context
    run: [python3, .maestro/engine/design_corrections.py, render, --root, ., --slug, "${inputs.slug}"]
    on_fail: abort
    next: arch_review

  - id: arch_review
    type: agent
    label: Architecture review
    instruction: |
      Review the full design set for this feature (HLD, every selected repo LLD, contract, test
      cases, effective-design.json, and approved-corrections.md under
      .maestro/runs/${inputs.slug}/) for soundness, consistency and risk. Approved corrections
      override conflicting base statements.
      Findings need evidence; set blocking=true only for must-fix issues. For a blocking verdict,
      also identify the earliest authoritative layer that should normally change as revision_scope,
      name every selected repository whose LLD must reflect the change in affected_repos_csv, and
      provide one concise correction_text that is complete enough for a human to approve as an
      effective-design override. For a clean verdict return revision_scope=none and empty strings.
    skill: architecture-review
    agent: reviewer
    model: opus
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}", lessons: "${memory.knowledge.architecture-review}"}
    outputs: [review_path, blocking, summary, revision_scope, affected_repos_csv, correction_text]
    artifact: ".maestro/runs/${inputs.slug}/reviews/architecture.md"
    max_visits: 4
    next: arch_review_validate

  - id: arch_review_validate
    type: script
    label: Validate architecture revision routing
    run:
      - python3
      - .maestro/engine/lld_repo_pool.py
      - validate-review
      - --root
      - "."
      - --slug
      - "${inputs.slug}"
      - --blocking
      - "${steps.arch_review.outputs.blocking}"
      - --revision-scope
      - "${steps.arch_review.outputs.revision_scope}"
      - --repos-text
      - "${steps.arch_review.outputs.affected_repos_csv}"
      - --correction-text
      - "${steps.arch_review.outputs.correction_text}"
    on_fail: arch_review
    routes:
      - {when: "${steps.arch_review_validate.outputs.blocking} == true", to: arch_gate}
      - {to: contract_approval}

  - id: arch_gate
    type: gate
    label: Blocking architecture findings
    prompt: |
      Architecture review found BLOCKING issues:
      ${steps.arch_review.outputs.summary}
      Full review: ${steps.arch_review.outputs.review_path}

      Normal source-layer revision: ${steps.arch_review_validate.outputs.revision_scope}
      LLDs that must reflect the change: ${steps.arch_review_validate.outputs.affected_repos_csv}
      Proposed approved correction: ${steps.arch_review_validate.outputs.correction_text}
    options:
      - {id: lld_only, label: Approve correction — update affected LLDs only and continue, to: arch_design_revision}
      - {id: revise, label: Revise the identified source layer — then add guidance, to: arch_design_revision, input: feedback}
      - {id: waive, label: Waive — proceed anyway, to: contract_approval}
      - {id: reject, label: Abort the run, to: abort}

  - id: contract_approval
    type: gate
    label: Contract approval
    prompt: |
      Design approved for implementation?
      Design: ${steps.design.outputs.hld_path}
      Contract: ${steps.design.outputs.contract_path}
      Architecture review: ${steps.arch_review.outputs.summary}
    options:
      - {id: approve, label: Approve — verify effective design and workspace, to: effective_design_pre_impl}
      - {id: revise, label: Request design revisions — then describe what to change, to: design, input: feedback}
      - {id: reject, label: Reject — abort, to: abort}

  - id: effective_design_pre_impl
    type: script
    label: Refresh effective design before implementation
    run: [python3, .maestro/engine/design_corrections.py, render, --root, ., --slug, "${inputs.slug}"]
    on_fail: abort
    next: workspace_sync_pre_impl

  - id: workspace_sync_pre_impl
    type: subworkflow
    label: Workspace sync (pre-implementation)
    workflow: .maestro/workflows/workspace-sync.yaml
    inputs: {slug: "${inputs.slug}", checkpoint: pre-implementation}
    max_visits: 8
    routes:
      # If HEAD moved since the design was grounded, regenerate/reapprove the design before
      # implementation. Continuing at the already-pinned commits falls through immediately.
      - {when: "${steps.workspace_sync_pre_impl.outputs.changed} == true", to: design}
      - {to: impl_scope_serve}

  - id: impl_scope_serve
    type: script
    label: List repositories available for implementation
    run: [python3, .maestro/engine/implementation_pool.py, list, --root, ., --slug, "${inputs.slug}"]
    on_fail: abort
    next: impl_scope

  - id: impl_scope
    type: gate
    label: Implementation scope
    prompt: |
      Approved repositories available to implement now:
      ${steps.impl_scope_serve.outputs.available_csv}

      Already implemented in an earlier batch:
      ${steps.impl_scope_serve.outputs.implemented_csv}

      Choose this delivery batch. Unselected repositories remain deferred and can be resumed from
      this parent run without repeating PRD, HLD, LLD, contract, or architecture review.
    options:
      - {id: all, label: Implement all available repositories, to: impl_scope_init}
      - {id: pick, label: Pick repositories for this batch, to: impl_scope_init, input: repos_text}
      - {id: reject, label: Abort implementation, to: abort}

  - id: impl_scope_init
    type: script
    label: Initialize implementation repo pool
    run: [python3, .maestro/engine/implementation_pool.py, init, --root, ., --slug, "${inputs.slug}", --choice, "${steps.impl_scope.outputs.choice}", --repos-text, "${steps.impl_scope.outputs.repos_text}"]
    on_fail: abort
    next: implement

  - id: implement
    type: parallel
    label: Implementation (repo pool)
    join: all
    on_branch_fail: ask
    branches:
      - id: slot_1
        start: claim
        steps:
          - id: claim
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, claim, --root, ., --slug, "${inputs.slug}"]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: impl}
          - id: impl
            type: subworkflow
            workflow: .maestro/workflows/impl.yaml
            inputs:
              slug: "${inputs.slug}"
              stack: "${steps.claim.outputs.repo}"
              repo_path: "${steps.claim.outputs.repo_path}"
              feature: "${inputs.feature}"
            next: record
          - id: record
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${steps.claim.outputs.repo}", --branch, "${steps.impl.outputs.branch}", --worktree, "${steps.impl.outputs.worktree}", --commit, "${steps.impl.outputs.commit}"]
            on_fail: abort
            next: claim
      - id: slot_2
        start: claim
        steps:
          - id: claim
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, claim, --root, ., --slug, "${inputs.slug}"]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: impl}
          - id: impl
            type: subworkflow
            workflow: .maestro/workflows/impl.yaml
            inputs:
              slug: "${inputs.slug}"
              stack: "${steps.claim.outputs.repo}"
              repo_path: "${steps.claim.outputs.repo_path}"
              feature: "${inputs.feature}"
            next: record
          - id: record
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${steps.claim.outputs.repo}", --branch, "${steps.impl.outputs.branch}", --worktree, "${steps.impl.outputs.worktree}", --commit, "${steps.impl.outputs.commit}"]
            on_fail: abort
            next: claim
      - id: slot_3
        start: claim
        steps:
          - id: claim
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, claim, --root, ., --slug, "${inputs.slug}"]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: impl}
          - id: impl
            type: subworkflow
            workflow: .maestro/workflows/impl.yaml
            inputs:
              slug: "${inputs.slug}"
              stack: "${steps.claim.outputs.repo}"
              repo_path: "${steps.claim.outputs.repo_path}"
              feature: "${inputs.feature}"
            next: record
          - id: record
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${steps.claim.outputs.repo}", --branch, "${steps.impl.outputs.branch}", --worktree, "${steps.impl.outputs.worktree}", --commit, "${steps.impl.outputs.commit}"]
            on_fail: abort
            next: claim
      - id: slot_4
        start: claim
        steps:
          - id: claim
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, claim, --root, ., --slug, "${inputs.slug}"]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: impl}
          - id: impl
            type: subworkflow
            workflow: .maestro/workflows/impl.yaml
            inputs:
              slug: "${inputs.slug}"
              stack: "${steps.claim.outputs.repo}"
              repo_path: "${steps.claim.outputs.repo_path}"
              feature: "${inputs.feature}"
            next: record
          - id: record
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${steps.claim.outputs.repo}", --branch, "${steps.impl.outputs.branch}", --worktree, "${steps.impl.outputs.worktree}", --commit, "${steps.impl.outputs.commit}"]
            on_fail: abort
            next: claim
    next: finalize_implementation

  - id: finalize_implementation
    type: script
    label: Verify implementation test context
    run: [python3, .maestro/engine/implementation_pool.py, finalize, --root, ., --slug, "${inputs.slug}"]
    on_fail: abort
    next: qa

  - id: qa
    type: subworkflow
    label: QA phase
    workflow: .maestro/workflows/qa.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      implementation_manifest: "${steps.finalize_implementation.outputs.manifest_path}"
      implementation_manifest_sha256: "${steps.finalize_implementation.outputs.manifest_sha256}"
    max_visits: 3
    next: review_pack

  - id: review_pack
    type: agent
    label: Human review pack
    instruction: |
      Assemble the release review pack for this feature: what was built (per stack),
      review outcomes, QA results, open risks, and how to verify locally. Digest the
      artifacts under .maestro/runs/${inputs.slug}/ — the pack is what the human reads at
      the release gate. Treat implementation-manifest.json as the source of truth for every
      repository's exact branch, worktree, and commit; include all of them in the pack.
      Treat approved-corrections.md as authoritative over conflicting base design text.
    skill: human-review-pack
    agent: analyst
    model: opus
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    outputs: [pack_path, recommendation, summary]
    artifact: ".maestro/runs/${inputs.slug}/review-pack.md"
    next: release_approval

  - id: release_approval
    type: gate
    label: Release approval
    prompt: |
      Ready to release?
      Recommendation: ${steps.review_pack.outputs.recommendation}
      ${steps.review_pack.outputs.summary}
      Review pack: ${steps.review_pack.outputs.pack_path}
      QA: ${steps.qa.outputs.qa_summary}
    options:
      - {id: approve, label: Approve this implementation batch, to: impl_deferred_check}
      - {id: revise, label: Send back to design — then describe what to change, to: design, input: feedback}
      - {id: reject, label: Reject — abort, to: abort}

  - id: impl_deferred_check
    type: script
    label: Check deferred implementation repositories
    run: [python3, .maestro/engine/implementation_pool.py, check, --root, ., --slug, "${inputs.slug}"]
    on_fail: abort
    routes:
      - {when: "${steps.impl_deferred_check.outputs.has_deferred} == true", to: impl_deferred_gate}
      - {to: archive}

  - id: impl_deferred_gate
    type: gate
    label: Deferred implementation repositories
    prompt: |
      This batch is approved. These approved repositories remain deferred:
      ${steps.impl_deferred_check.outputs.deferred_csv}

      You can leave this run at this gate and resume it later without repeating design.
    options:
      - {id: implement_more, label: Implement another deferred batch now, to: effective_design_pre_impl}
      - {id: finish, label: Finish this feature with those repositories deferred, to: archive}
      - {id: reject, label: Abort the remaining feature work, to: abort}

  - id: archive
    type: subworkflow
    label: Archival (harvest + publish)
    # Runs AFTER release approval and BEFORE the human merges the feature branch to master:
    # folds this run's lessons into domain memory, then publishes curated docs.
    workflow: .maestro/workflows/archive.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    next: end

outputs:
  hld: ".maestro/runs/${inputs.slug}/hld.md"
  contract: ".maestro/runs/${inputs.slug}/openapi.yaml"
  review_pack: "${steps.review_pack.outputs.pack_path}"
  implementation_manifest: "${steps.finalize_implementation.outputs.manifest_path}"
