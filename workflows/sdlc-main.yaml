# The full KeyValue AI-SDLC pipeline — the default workflow behind the Maestro skill.
#
#   workspace sync -> design (PRD, reviewed HLD, contract, repository LLDs) -> delivery
#   (staleness check -> implementation pool -> verified test-context manifest -> QA -> review
#   pack -> release gate) -> archive
#
# Each stage is a child workflow; this file owns only the ordering and the loops between stages.
# A stage's human gates decide (approve / revise / send back) and the stage reports the choice in
# its outputs; the routes below act on it. Every producing step writes an artifact under
# .maestro/runs/<slug>/ and the engine gates on it ("proof, not promises"). Stage nodes set
# `on_fail: abort`, so a rejection inside a stage aborts the run as it did inline.
version: 1
name: sdlc-main
description: Full feature pipeline — requirement to release-ready review pack.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
defaults:
  model: haiku
  agent: general
  max_visits: 10
start: workspace_sync_initial
nodes:
  - id: workspace_sync_initial
    type: subworkflow
    label: Workspace sync (feature start)
    workflow: .maestro/workflows/workspace-sync.yaml
    inputs: {slug: "${inputs.slug}", checkpoint: feature-start}
    next: design

  - id: design
    type: subworkflow
    label: Design phase
    workflow: .maestro/workflows/design.yaml
    # `feedback` carries a revise gate's note back into the design phase so a regenerated
    # design knows WHY it was sent back. Empty on the first pass (resolves to "").
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${steps.delivery.outputs.release_feedback} ${steps.delivery.outputs.stale_reasons}"
    max_visits: 4
    on_fail: abort
    next: delivery

  - id: delivery
    type: subworkflow
    label: Implementation, QA and release
    workflow: .maestro/workflows/delivery.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    on_fail: abort
    routes:
      - {when: "${steps.delivery.outputs.design_changed} == true", to: design}
      - {when: "${steps.delivery.outputs.design_stale} == true", to: design}
      - {when: "${steps.delivery.outputs.release} == revise", to: design}
      - {when: "${steps.delivery.outputs.release} == approve", to: archive}
      # Unreachable: the stage only ends through one of the choices above.
      - {to: abort}

  - id: archive
    type: subworkflow
    label: Archival (harvest + publish)
    # Runs AFTER release approval and BEFORE the human merges the feature branch to master:
    # folds this run's lessons into domain memory, then publishes curated docs.
    workflow: .maestro/workflows/archive.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    next: end

outputs:
  hld: ".maestro/runs/${inputs.slug}/hld.md"
  contract: ".maestro/runs/${inputs.slug}/openapi.yaml"
  review_pack: "${steps.delivery.outputs.pack_path}"
  implementation_manifest: "${steps.delivery.outputs.manifest_path}"
