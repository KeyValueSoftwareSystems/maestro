# Build the codebase knowledge base by scanning the code: docs/architecture.md plus per-domain
# functional + technical docs (format: docs-format.md in the build-knowledge skill). The engine
# extracts and generates everything the code already lists (docs/_generated/), checks the docs
# the agent writes (living_docs.py) and stamps them.
# Also (optionally) seeds cross-cutting review lessons into the memory store, which the engine
# consolidates. Run once per workspace (recommended before your first feature): /build-knowledge
# Re-runnable — refresh in place. Skips the authoring agent when maps + knowledge provenance
# are already current (idempotent /maestro-init and /build-knowledge).
version: 1
name: build-knowledge
title: Build the knowledge base
description: Build docs/ (architecture + functional and technical per domain) from the codebase.
inputs:
  slug: {type: string, default: bootstrap, description: throwaway run id for the bootstrap}
  feature: {type: string, default: knowledge-bootstrap}
defaults:
  model: haiku
  agent: analyst
start: plan_freshness
nodes:
  - id: plan_freshness
    type: script
    label: Check living-docs + map freshness
    # Combined docs/provenance.yaml + codebase-map gate (no network). refresh_needed false → skip authoring.
    run: [python3, .maestro/engine/workspace_sync.py, plan, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/knowledge/plan.json", --no-fetch]
    routes:
      - {when: "${steps.plan_freshness.outputs.refresh_needed} == true", to: plan_maps}
      - {to: already_fresh}

  - id: already_fresh
    type: script
    label: Docs already current — skip authoring
    run: [python3, -c, "import json; print(json.dumps({'domains_written': 0, 'architecture_path': 'docs/architecture.md', 'summary': 'docs already current; skipped authoring'}))"]
    next: ensure_index_state

  - id: ensure_index_state
    type: script
    label: Ensure docs_sha256/evidence on shared index-state
    # Template workspace-index may have written commits without docs_sha256; fill those
    # without re-authoring. No-op when provenance is already complete or docs are stale.
    run: [python3, .maestro/engine/workspace_sync.py, ensure-index-state, --root, ., --evidence, docs/architecture.md]
    next: consolidate

  - id: plan_maps
    type: script
    label: Plan codebase-map refresh
    run: [python3, .maestro/engine/codebase_scan.py, plan, --root, .]
    routes:
      - {when: "${steps.plan_maps.outputs.stale} == true", to: snapshot_maps}
      - {to: snapshot_docs}

  - id: snapshot_maps
    type: script
    label: Snapshot maps before refresh
    run: [python3, .maestro/engine/codebase_scan.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/knowledge/map-snapshot.json"]
    on_fail: abort
    next: snapshot_docs

  - id: snapshot_docs
    type: script
    label: Snapshot living docs before writing
    # Lets stamp_docs mark exactly the docs this run wrote or changed.
    run: [python3, .maestro/engine/living_docs.py, snapshot, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/knowledge/docs-snapshot.json"]
    on_fail: abort
    next: extract_inventory

  - id: extract_inventory
    type: script
    label: Extract the workspace inventory (engine)
    # Endpoints, calls, events, jobs, tables and config read from code and contracts (no LLM),
    # so the writer sees them without grepping and never restates them.
    run: [python3, .maestro/engine/living_docs.py, extract, --root, ., --out, ".maestro/runs/${inputs.slug}/.engine/knowledge/inventory.md"]
    on_fail: abort
    next: build

  - id: build
    type: agent
    label: Build the knowledge base
    model: sonnet
    instruction: |
      Scan this workspace and build its living knowledge base under docs/. Read the repos
      under codebase/ (or the single repo), each repo's AGENTS.md / CLAUDE.md /
      .cursor/rules, any existing docs/, and the workspace inventory (the `inventory` input):
      every endpoint, call between repos, event, job, table and config key the engine extracted.
      Every file follows docs-format.md in the build-knowledge skill exactly: front-matter,
      required headings in order, table columns, IDs, `repo · path · symbol` anchors (never line
      numbers), owned unknowns, budgets. Then:
      1. Identify the domains (kebab-case bounded contexts); give each an id_prefix and
         code_roots.
      2. For EACH domain write docs/functional/<domain>.md (purpose and actors, glossary,
         business rules as BR rows with edge and source, states and flows, open questions) and
         docs/technical/<domain>.md (failure/concurrency/idempotency, gotchas, known gaps, and
         the invariants and change scenarios you find, as proposals with the anchor that
         enforces each; the Cross-repo connections section holds only the empty generated block
         markers). Invariants and change scenarios are team-owned: never edit §Invariants and consistency, §Change scenarios, §Platform-wide
         invariants or docs/impact/side-effects.yaml (the engine restores them); write what you
         find under §Proposed rules and scenarios instead. A new
         technical doc's §Invariants and consistency and §Change scenarios say None. Read the
         code that enforces each rule before proposing it.
      3. Write docs/architecture.md: system context and repos (with Runs on), the Domain map
         linking both files of every domain, cross-repo flows and contracts, conventions and
         boundaries, shared glossary; platform-wide invariants you find go under its
         §Proposed rules and scenarios.
      4. For EACH repo write docs/codebase-maps/<repo>.md — the standing per-repo grounding the HLD
         reads: entry points, key modules, the primary flows and EVERY distinct execution mode
         each runs in (single-turn/multi-turn, sync/async, batch/streaming, …) and what selects
         it, the data model, APIs exposed/consumed, auth pattern and conventions, as
         `path · symbol` anchors. Run `python3 .maestro/engine/codebase_scan.py plan` to see
         which repos to map (bootstrap = full). Do NOT write the
         `<!-- maestro-codebase-map commit=… -->` marker — the engine stamps it next.
      5. Optionally seed cross-cutting REVIEW lessons (not domain docs) as an authoritative
         drop to .maestro/memory/incoming/bootstrap.json
         ({"slug":"bootstrap","lessons":[{"domain":"backend-review","key":"<kebab>","text":"...",
         "authoritative":true}]}) — the engine renders those; do not write knowledge/ yourself.
      Never restate what the inventory lists, never invent an owner or reviewer, and never edit
      docs/_generated/, docs/_index/, a generated: block or verified_at — the engine writes
      those. Re-run = refresh in place; keep IDs stable and human edits intact.
    skill: build-knowledge
    inputs:
      inventory: ".maestro/runs/${inputs.slug}/.engine/knowledge/inventory.md"
    outputs: [domains_written, architecture_path, summary]
    artifact: "docs/architecture.md"
    # Regenerates the generated files and blocks, then checks the format, IDs and anchors; a
    # failure sends the report back to this agent.
    check: {run: [python3, .maestro/engine/living_docs.py, check, --root, ., --write, --locked-from, ".maestro/runs/${inputs.slug}/.engine/knowledge/docs-snapshot.json", --report]}
    next: stamp_docs

  - id: stamp_docs
    type: script
    label: Stamp written docs (engine)
    # verified_at = each repo's HEAD, status back to draft, only on docs this run changed.
    run: [python3, .maestro/engine/living_docs.py, stamp, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/knowledge/docs-snapshot.json"]
    on_fail: abort
    routes:
      - {when: "${steps.plan_maps.outputs.stale} == true", to: record_maps}
      - {to: record_knowledge}

  - id: record_maps
    type: script
    label: Record codebase-map commits (engine)
    # Stamp each repo's current HEAD into its map's marker (docs/codebase-maps/<repo>.md), so the next
    # build-knowledge / retrospect run refreshes only the diff. Owned by the engine, not the
    # skill — swapping build-knowledge can't change how incremental tracking works.
    run: [python3, .maestro/engine/codebase_scan.py, record, --root, ., --snapshot, ".maestro/runs/${inputs.slug}/.engine/knowledge/map-snapshot.json", --snapshot-sha256, "${steps.snapshot_maps.outputs.snapshot_sha256}"]
    on_fail: build
    next: record_knowledge

  - id: record_knowledge
    type: script
    label: Record living-doc provenance (engine)
    run: [python3, .maestro/engine/workspace_sync.py, record-knowledge, --root, ., --evidence, docs/architecture.md]
    on_fail: abort
    next: consolidate

  - id: consolidate
    type: script
    label: Render seeded lessons (engine)
    # Folds any authoritative lessons build-knowledge seeded into the memory store. No-op if
    # none were seeded. Deterministic engine step — see .maestro/engine/mem_consolidate.py.
    run: [python3, .maestro/engine/mem_consolidate.py, ".maestro/memory"]
    next: end
