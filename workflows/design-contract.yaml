# Design child: the cross-repository contract, defined from the approved HLD's Interfaces list
# BEFORE the repository LLDs, so every repository builds against one version of it. design.yaml
# enters this stage only when the HLD validator reports `interfaces_changed`; a feature that
# changes no interface between repositories skips it.
version: 1
name: design-contract
title: Interface contract
description: Define the API/event contract for every interface the approved HLD lists.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  feedback: {type: string, default: "", description: revision note from the release gate (empty on first pass)}
defaults:
  model: opus
  agent: architect
  max_visits: 10
start: contract
nodes:
  - id: contract
    type: agent
    label: API contract
    instruction: |
      Define the contract for every interface listed in the Interfaces section of the approved HLD
      at .maestro/runs/${inputs.slug}/hld.md, as OpenAPI (AsyncAPI or OpenAPI webhooks for
      events) at .maestro/runs/${inputs.slug}/openapi.yaml. Follow the owning repository's existing
      API conventions; read its codebase map and current routes or schemas. Do not invent an
      interface the HLD does not list. If the contract exists from an earlier pass, update it in
      place and keep unaffected operations unchanged. Honour revision feedback: ${inputs.feedback}
    skill: api-contract
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      hld_path: ".maestro/runs/${inputs.slug}/hld.md"
      contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
    outputs: [contract_summary]
    artifact: ".maestro/runs/${inputs.slug}/openapi.yaml"
    next: end

outputs:
  contract_summary: "${steps.contract.outputs.contract_summary}"
  contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
