# Design child: every repository's LLD in one run — one interview, one write, a readiness check,
# one approval — plus the functional test cases.
#
#   scope -> interview -> write LLDs -> validate -> readiness check -> test cases (AC trace) -> approval
#
# Roles: the architect prepares the questions, writes the LLDs and revises them (person feedback,
# readiness findings, contract changes and LLD check defects alike); the reviewer runs the
# readiness check; QA writes the test cases. The engine checks each job on hand-off.
#
# The test cases are written once the LLDs pass the readiness check, not on every revision round:
# the engine's AC trace checks their coverage, and the person reviews them at approval.
# One file per repository (lld/<repo>.md) keeps each implementation agent's context to its own
# repository. LLDs implement or call the contract exactly; a repository that needs a contract
# change reports it, the contract is updated first, and the affected LLDs are revised. Approval
# records the exact HLD, contract and LLD hashes (lld_set.py), so a later change to any of them
# makes the design stale and delivery sends it back here. Entered by design.yaml after the HLD
# (and the contract, when the HLD lists interfaces).
version: 1
name: design-lld
title: Repository designs (LLD) and test cases
description: Clarify, write, check and approve the repository LLDs and the functional test cases.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  feedback: {type: string, default: "", description: revision note from the release gate (empty on first pass)}
  light: {type: string, default: full, description: "light when the feature took the light path (no HLD)"}
  required_repos: {type: string, default: "", description: repositories the HLD's infrastructure changes need in scope}
  impact_repos: {type: string, default: "", description: repositories the impact assessment says the feature changes}
defaults:
  model: opus
  agent: architect
  max_visits: 10
start: lld_scope_serve
nodes:
  - id: lld_scope_serve
    type: script
    label: Discover repos
    run: [python3, .maestro/engine/lld_set.py, list, --root, .]
    next: lld_scope

  - id: lld_scope
    type: gate
    label: LLD scope
    prompt: |
      Detected repos: ${steps.lld_scope_serve.outputs.names_csv}
      The impact assessment says this feature changes: ${inputs.impact_repos}

      Write the detailed design for the repositories this feature changes, all of them, or a set
      you pick? Repositories that own infrastructure changes in the HLD stay in scope: ${inputs.required_repos}
    options:
      - {id: impact, label: The repositories this feature changes (all when no assessment ran), to: lld_scope_init}
      - {id: all, label: All of them, to: lld_scope_init}
      - {id: pick, label: Pick specific repos, to: lld_scope_init, input: repos_text}
    auto: {option: impact}

  - id: lld_scope_init
    type: script
    label: Record the repositories in scope
    run:
      - python3
      - .maestro/engine/lld_set.py
      - init
      - --root
      - "."
      - --slug
      - "${inputs.slug}"
      - --choice
      - "${steps.lld_scope.outputs.choice}"
      - --repos-text
      - "${steps.lld_scope.outputs.repos_text}"
      - --require
      - "${inputs.required_repos}"
      - --impact
      - ".maestro/runs/${inputs.slug}/impact.json"
    on_fail: lld_scope
    next: prepare_lld_questions

  - id: prepare_lld_questions
    type: agent
    execution: lead
    label: Find material repository design gaps
    instruction: |
      Build the next focused queue at .maestro/runs/${inputs.slug}/lld-questions.json before writing
      LLD prose for the repositories in scope: ${steps.lld_scope_init.outputs.selected_csv}. Read the
      approved HLD and its deferred questions, the contract at
      .maestro/runs/${inputs.slug}/openapi.yaml when it exists, confirmed LLD decisions, and for each
      repository its docs/codebase-map.md, guidance, manifest, and only the source/tests around the
      affected seam. Do not scan broadly.

      Decide normal implementation details from clear existing conventions. Ask only unresolved
      choices that materially change correctness, the extension seam, local state/data lifecycle,
      a repository's side of the contract, visible failure/retry/concurrency/offline behavior,
      authorization or privacy, compatibility/migration/rollout, execution modes, or the
      verification seam. Do not reopen PRD, HLD or contract choices or ask for filenames,
      boilerplate, library syntax, or task estimates. Keep one queue: prefix each question title
      with its repository and ask a decision that spans repositories once.

      Audit prior answers against must_resolve facts and code/HLD/contract constraints. Treat
      user-raised points as the human's own constraints and honour discussion summaries. A deferred
      blocking decision must be re-asked with sharper options; it cannot stay parked.

      Make it a design conversation, not a questionnaire: give every genuine trade-off its
      recommendation plus up to two real alternatives with their concrete consequences, grounded in
      the code you inspected. When no other gap remains, ask one kind "direction" question whose
      proposal summarises the intended change in each repository (seam, data/state, contract side,
      failure handling) for the human to confirm, challenge, or discuss; ask a fresh one whenever
      later answers change it.

      Write schema version 2 with 3-7 grouped questions when several gaps remain, fewer when nearly
      clear, and an empty queue only when every blocking decision is concrete and consistent and
      the latest direction is confirmed. Validate it before completing.
      Design path: ${inputs.light}. On the light path there is no HLD or contract: ground every
      decision in the approved PRD and the code, and put in the LLD what an HLD would hold for this
      change (ownership, failure handling, rollout).
      Decision log: .maestro/runs/${inputs.slug}/decision-log.md (every earlier stage's decisions).
      Never ask a topic already decided there or in this stage's decisions: give every question a
      short kebab-case `topic`; to refine a recorded answer, ask at most one follow-up with
      `follow_up_of: <its id>`. Decide from evidence first: when the requirement, an approved
      document, the code or the docs already settle a point, record it under `settled`
      ({topic, title, decision, source: "<path>[#section|:line]"}) instead of asking.
      If the engine's check failed, fix only the defects it names in the existing file and
      validate again — do not rebuild the queue or re-read sources.
      Run mode: ${run.mode}. In auto mode nobody answers: every recommendation is adopted as a
      logged assumption and this is the only round, so give every question a grounded
      recommendation from the evidence and put every material gap in this one queue.
    skill: lld-interview
    inputs:
      slug: "${inputs.slug}"
      repos: "${steps.lld_scope_init.outputs.selected_csv}"
      hld_path: ".maestro/runs/${inputs.slug}/hld.md"
      deferred_questions: ".maestro/runs/${inputs.slug}/open-questions.json"
      contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
      decisions_path: ".maestro/runs/${inputs.slug}/lld-context.json"
      revision_feedback: "${steps.lld_approval.outputs.feedback} ${inputs.feedback}"
      validator: ".maestro/engine/validate_prd_questions.py"
    outputs: [summary]
    artifact: ".maestro/runs/${inputs.slug}/lld-questions.json"
    check: {run: [python3, .maestro/engine/validate_prd_questions.py, ".maestro/runs/${inputs.slug}/lld-questions.json", --decisions, ".maestro/runs/${inputs.slug}/lld-context.json", --require-version, "2", --require-direction, --log, ".maestro/runs/${inputs.slug}/decision-log.json", --require-topics, --root, ".", --report]}
    max_visits: 8
    on_exhausted: lld_clarity_limit
    routes:
      - {when: "${steps.prepare_lld_questions.outputs.state} == clear", to: author_llds}
      - {to: lld_interview}

  - id: lld_interview
    type: interview
    label: Clarify repository implementation decisions
    skill: lld-interview
    context: |
      Feature: ${inputs.feature}
      Repositories: ${steps.lld_scope_init.outputs.selected_csv}
      Approved HLD: .maestro/runs/${inputs.slug}/hld.md
    questions_artifact: ".maestro/runs/${inputs.slug}/lld-questions.json"
    batch_size: 12
    presentation: popup
    discuss:
      inputs:
        hld: ".maestro/runs/${inputs.slug}/hld.md"
        contract: ".maestro/runs/${inputs.slug}/openapi.yaml"
        codebase_maps: "each in-scope repository's docs/codebase-map.md"
        source: "only the source and tests around the seam this question concerns"
    artifact: ".maestro/runs/${inputs.slug}/lld-context.json"
    # Autopilot (auto mode): recommendations become logged assumptions; one round, then write.
    auto: {modes: [auto]}
    routes:
      - {when: "${run.mode} == auto", to: author_llds}
      - {to: prepare_lld_questions}

  - id: lld_clarity_limit
    type: gate
    label: Repository LLD clarity checkpoint
    prompt: |
      Eight grouped clarification rounds are complete, but blocking repository design decisions
      remain. Continue with focused questions, or abort?
    options:
      - {id: more, label: Continue focused clarification, to: prepare_lld_questions}
      - {id: reject, label: Abort the run, to: abort}

  - id: author_llds
    type: agent
    execution: lead
    label: Write the repository LLDs once
    instruction: |
      Design path: ${inputs.light}. On the light path there is no HLD or contract: ground every
      decision in the approved PRD and the code, and put in the LLD what an HLD would hold for this
      change (ownership, failure handling, rollout).
      Write one concise, buildable LLD per repository in scope, at these paths:
      ${steps.lld_scope_init.outputs.lld_paths_csv}
      Use the approved HLD, the contract at .maestro/runs/${inputs.slug}/openapi.yaml when it exists,
      the confirmed decisions at .maestro/runs/${inputs.slug}/lld-context.json, each repository's
      guidance and maintained map, and the bounded source/test evidence already inspected.

      Use plain, skimmable technical English and the exact nine-section LLD contract, with the
      feature slug ${inputs.slug} as the parent feature. Make each repository's implementation
      seam, persistence schema/migration, its exact side of the contract, state/flows, failure
      behavior, dependency order, and verification concrete. Implement or call the contract
      exactly; if a repository needs something the contract lacks, report it as a contract change
      instead of designing around it. Do not repeat the HLD, include open decisions, produce a
      file-by-file task dump, or implement code. Never remove necessary detail to reduce length.

      Also write .maestro/runs/${inputs.slug}/lld-post-questions.json as a schema-version-2
      post-check. Keep it empty unless synthesis reveals a genuinely new blocking decision; never
      guess. Run the validators and repair deterministic defects inside this same call.

      If the LLDs already exist from an earlier pass, update them in place: change only the sections
      whose decisions changed. If the engine's check failed, only the post-check file failed
      validation: fix just that file and leave the LLDs untouched.
    skill: lld-writing
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      lld_paths: "${steps.lld_scope_init.outputs.lld_paths_csv}"
      hld_path: ".maestro/runs/${inputs.slug}/hld.md"
      contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
      decisions_path: ".maestro/runs/${inputs.slug}/lld-context.json"
      post_questions_path: ".maestro/runs/${inputs.slug}/lld-post-questions.json"
      lld_validator: ".maestro/engine/validate_lld.py"
      question_validator: ".maestro/engine/validate_prd_questions.py"
      lessons: "${memory.knowledge.repo-design}"
    outputs: [summary, contract_change_needed, contract_change]
    artifact: ".maestro/runs/${inputs.slug}/lld-post-questions.json"
    # The post-check only: an LLD waiting on a contract change cannot pass the LLD validator until
    # that change lands, so LLD validity is checked where every writer's path meets (validate_llds).
    check: {run: [python3, .maestro/engine/validate_prd_questions.py, ".maestro/runs/${inputs.slug}/lld-post-questions.json", --decisions, ".maestro/runs/${inputs.slug}/lld-context.json", --require-version, "2", --log, ".maestro/runs/${inputs.slug}/decision-log.json", --require-topics, --root, ".", --report]}
    max_visits: 4
    routes:
      - {when: "${steps.author_llds.outputs.state} == ask", to: lld_post_interview}
      # a contract change is applied only after the post-check is clean, so no gap is skipped
      - {when: "${steps.author_llds.outputs.contract_change_needed} == true", to: contract_change}
      - {to: validate_llds}

  - id: lld_post_interview
    type: interview
    label: Resolve newly discovered repository gaps
    skill: lld-interview
    context: |
      A new blocking decision emerged while connecting the complete LLDs.
    questions_artifact: ".maestro/runs/${inputs.slug}/lld-post-questions.json"
    batch_size: 12
    presentation: popup
    discuss:
      inputs:
        hld: ".maestro/runs/${inputs.slug}/hld.md"
        contract: ".maestro/runs/${inputs.slug}/openapi.yaml"
        lld_drafts: "${steps.lld_scope_init.outputs.lld_paths_csv}"
        source: "only the source and tests around the seam this question concerns"
    artifact: ".maestro/runs/${inputs.slug}/lld-context.json"
    auto: {modes: [auto]}
    next: author_llds

  # A repository needs something the contract does not cover: change the contract first, so every
  # repository builds against the same version, then revise the affected LLDs.
  - id: contract_change
    type: agent
    label: Update the contract for a repository need
    instruction: |
      Apply the requested change to the contract at .maestro/runs/${inputs.slug}/openapi.yaml
      (create it if no contract exists yet). A request below may be one an earlier round already
      applied; apply only what the contract does not already include:
      - from writing the LLDs: ${steps.author_llds.outputs.contract_change}
      - from revising them: ${steps.revise_llds.outputs.contract_change}
      Keep every unaffected operation unchanged and flag the change as breaking or additive.
    skill: api-contract
    inputs:
      slug: "${inputs.slug}"
      hld_path: ".maestro/runs/${inputs.slug}/hld.md"
      contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
    outputs: [contract_summary]
    artifact: ".maestro/runs/${inputs.slug}/openapi.yaml"
    fresh: true
    max_visits: 3
    on_exhausted: test_cases
    next: revise_llds

  - id: validate_llds
    type: script
    label: Validate every repository LLD
    run: [python3, .maestro/engine/lld_set.py, validate, --root, ., --slug, "${inputs.slug}"]
    max_visits: 12
    on_exhausted: abort
    routes:
      - {when: "${steps.validate_llds.outputs.valid} == true", to: sync_decisions}
      - {to: revise_llds}

  - id: test_cases
    type: agent
    label: Functional test cases
    instruction: |
      Produce the functional test-case catalog for this feature at
      .maestro/runs/${inputs.slug}/test-cases.md from the requirement's acceptance criteria, the
      HLD, the contract when it exists, and the repository LLDs — the QA source of truth. If the
      catalog exists from an earlier pass, update in place only the cases the LLD or acceptance
      criteria changes affect; keep every other case and its ID unchanged.
      Start each case with a heading whose first word is its ID (`### TC-${inputs.slug}-001 — title`)
      and name in its body every PRD criterion it verifies exactly as the PRD writes it (AC-01).
      Every AC in .maestro/runs/${inputs.slug}/requirement/prd.md needs at least one case; trace no
      criterion the PRD does not have. The engine checks this after you.
    agent: qa
    skill: functional-testcases
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
      hld_path: ".maestro/runs/${inputs.slug}/hld.md"
      contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
      lld_paths: "${steps.lld_scope_init.outputs.lld_paths_csv}"
    outputs: [test_cases_path, case_count]
    artifact: ".maestro/runs/${inputs.slug}/test-cases.md"
    # Every PRD acceptance criterion is traced by a test case, and no case traces one the PRD lacks.
    check: {run: [python3, .maestro/engine/ac_trace.py, design, --prd, ".maestro/runs/${inputs.slug}/requirement/prd.md", --test-cases, ".maestro/runs/${inputs.slug}/test-cases.md"]}
    next: lld_approval

  # Engine-owned: rebuild the feature's decision log from every stage's decisions, so later
  # stages never re-ask a decided topic and the approval shows every decision.
  - id: sync_decisions
    type: script
    label: Update the decision log
    run:
      - python3
      - .maestro/engine/decision_log.py
      - sync
      - --root
      - .
      - --log
      - ".maestro/runs/${inputs.slug}/decision-log.json"
      - --stage
      - "PRD=.maestro/runs/${inputs.slug}/prd-context.json,.maestro/runs/${inputs.slug}/prd-questions.json"
      - --stage
      - "HLD=.maestro/runs/${inputs.slug}/hld-context.json,.maestro/runs/${inputs.slug}/hld-questions.json"
      - --stage
      - "LLD=.maestro/runs/${inputs.slug}/lld-context.json,.maestro/runs/${inputs.slug}/lld-questions.json"
    next: readiness_scope

  # Engine-owned: a re-review sees the LLD changes since its last round, not the whole set again.
  - id: readiness_scope
    type: script
    label: What changed since the last readiness check
    run: [python3, .maestro/engine/review_scope.py, prepare, --dir, ".maestro/runs/${inputs.slug}/reviews", --name, lld-readiness, --files, "${steps.lld_scope_init.outputs.lld_paths_csv}", --findings, ".maestro/runs/${inputs.slug}/reviews/lld-readiness-findings.json"]
    next: readiness_review

  - id: readiness_review
    type: agent
    label: Implementation readiness check (fresh reviewer)
    brief: full
    instruction: |
      Check that the repository LLDs (${steps.lld_scope_init.outputs.lld_paths_csv}) are ready to
      implement: no design decision left to the implementer, every LLD consistent with the contract
      at .maestro/runs/${inputs.slug}/openapi.yaml (when it exists) and with each other, and every
      acceptance criterion in .maestro/runs/${inputs.slug}/requirement/ covered by an LLD section.
      The test cases are written after this check passes; do not ask for them. Every change in the Infrastructure and operations section of the HLD at
      .maestro/runs/${inputs.slug}/hld.md (absent on the light path) needs an LLD in the repository
      that owns that infrastructure; a missing one is blocking. This is not an architecture review;
      the HLD was reviewed and approved. The decisions the person confirmed are in
      .maestro/runs/${inputs.slug}/decision-log.md: a confirmed decision is not a finding unless it
      breaks a requirement, and then say the finding overrides it.
      Write every finding to .maestro/runs/${inputs.slug}/reviews/lld-readiness-findings.json as well as
      the report (the engine decides from that file; severity blocking only for must-fix). If it
      exists from an earlier round, this is a re-review: read it and the author's resolutions at
      .maestro/runs/${inputs.slug}/reviews/lld-readiness-resolutions.json first. Mark a fixed finding
      resolved; for a contested one, mark it withdrawn when the author is right or upheld with your
      reason; keep ids stable and give new findings new ids. ${steps.readiness_scope.outputs.summary}.
      On a re-review the changes since your last round are at
      ${steps.readiness_scope.outputs.diff_path}: check those, not the unchanged text. Raise a new
      blocking finding only for a problem the revision introduced, and mark it
      "introduced_by_revision": true; anything you could have raised earlier goes to the person as
      late, not back to the author. Then overwrite both files.
    skill: lld-readiness
    agent: reviewer
    model: opus
    inputs:
      slug: "${inputs.slug}"
      lld_paths: "${steps.lld_scope_init.outputs.lld_paths_csv}"
      hld_path: ".maestro/runs/${inputs.slug}/hld.md"
      contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
      requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
      decision_log: ".maestro/runs/${inputs.slug}/decision-log.md"
      previous_review: ".maestro/runs/${inputs.slug}/reviews/lld-readiness.md"
      changes_since_last_review: "${steps.readiness_scope.outputs.diff_path}"
      findings_path: ".maestro/runs/${inputs.slug}/reviews/lld-readiness-findings.json"
      resolutions_path: ".maestro/runs/${inputs.slug}/reviews/lld-readiness-resolutions.json"
    outputs: [review_path, blocking, summary]
    artifact:
      - ".maestro/runs/${inputs.slug}/reviews/lld-readiness.md"
      - ".maestro/runs/${inputs.slug}/reviews/lld-readiness-findings.json"
    fresh: true
    max_visits: 6
    on_exhausted: test_cases
    next: readiness_verdict

  # Engine-owned: blocking is decided from the findings file, not the reviewer's own flag. The
  # engine also bounds the loop: after reviews.max_rounds reviews (default 3), or for a blocking
  # finding first raised on a re-review, a person decides at approval instead of another round.
  - id: readiness_verdict
    type: script
    label: Blocking readiness findings?
    run: [python3, .maestro/engine/findings.py, verdict, --findings, ".maestro/runs/${inputs.slug}/reviews/lld-readiness-findings.json", --previous, ".maestro/runs/${inputs.slug}/reviews/lld-readiness-findings.previous.json", --round, "${steps.readiness_review.visits}", --root, "."]
    max_visits: 8
    on_exhausted: test_cases
    routes:
      - {when: "${steps.readiness_verdict.outputs.valid} == false", to: readiness_review}
      - {when: "${steps.readiness_verdict.outputs.revise} == true", to: revise_llds}
      - {to: test_cases}

  - id: lld_approval
    type: gate
    label: Repository LLD approval
    prompt: |
      Repository LLDs ready: ${steps.lld_scope_init.outputs.lld_paths_csv}
      Test cases: .maestro/runs/${inputs.slug}/test-cases.md
      Readiness check: ${steps.readiness_review.outputs.summary}
      Blocking findings (engine): ${steps.readiness_verdict.outputs.summary}
      Escalated by the author: ${steps.readiness_resolution.outputs.escalated_csv} ${steps.readiness_resolution.outputs.summary}
      Decisions: ${steps.sync_decisions.outputs.summary} (${steps.sync_decisions.outputs.md_path})
      Report: .maestro/runs/${inputs.slug}/reviews/lld-readiness.md

      Approving starts implementation of every repository in scope.
    options:
      - {id: approve, label: Approve — implement these designs, to: record_approval}
      - {id: revise, label: Request changes — targeted edits, to: revise_llds, input: feedback}
      - {id: rethink, label: Re-clarify repository decisions and regenerate, to: prepare_lld_questions, input: feedback}
      - {id: reject, label: Reject — abort the run, to: abort}
    # Design and auto modes approve LLDs that passed the readiness check (the person approved the
    # HLD they implement); blocking findings left after the round limit, or late ones, stop the
    # run here.
    auto:
      option: approve
      when: ["${steps.readiness_verdict.outputs.blocking} == false", "${steps.readiness_verdict.outputs.late} == false"]

  # Targeted edits from the readiness check, the approval gate, or a contract change.
  - id: revise_llds
    type: agent
    execution: lead
    label: Revise the repository LLDs
    instruction: |
      Make targeted edits to the LLDs at ${steps.lld_scope_init.outputs.lld_paths_csv} for whichever
      of these applies (the test cases are updated after the readiness check, not here):
      - human feedback: ${steps.lld_approval.outputs.feedback}
      - blocking readiness findings (status open or upheld) in .maestro/runs/${inputs.slug}/reviews/lld-readiness-findings.json:
        resolve each one and record it in .maestro/runs/${inputs.slug}/reviews/lld-readiness-resolutions.json as
        {"schema_version": 1, "resolutions": [{"id", "resolution", "note"}]} — fixed (a targeted
        edit; the note says what changed), contested (the finding is wrong; the note gives the
        evidence; never a second time for a finding the reviewer upheld) or escalated (it needs a
        person's decision; the note states it);
      - the contract changed (${steps.contract_change.outputs.contract_summary}): bring every LLD
        that implements or calls the changed operation in line with it;
      - the engine's LLD check (${steps.validate_llds.outputs.issues_summary}): when it names
        defects, fix exactly those, bringing only the named structure to the nine-section format.
      Change only the sections affected; keep every confirmed decision. A finding that would
      overturn a decision the person confirmed is never fixed silently: contest it, citing the
      decision, when the decision still meets the requirements; otherwise escalate it so the person
      decides. If a change needs a new
      repository decision the confirmed decisions cannot settle, do not guess: return
      needs_clarification true. If it needs a contract change, return contract_change_needed true
      with the change described in contract_change.
    skill: lld-writing
    inputs:
      slug: "${inputs.slug}"
      lld_paths: "${steps.lld_scope_init.outputs.lld_paths_csv}"
      contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
      decisions_path: ".maestro/runs/${inputs.slug}/lld-context.json"
      lld_validator: ".maestro/engine/validate_lld.py"
      revision_feedback: "${steps.lld_approval.outputs.feedback}"
      findings_path: ".maestro/runs/${inputs.slug}/reviews/lld-readiness-findings.json"
      resolutions_path: ".maestro/runs/${inputs.slug}/reviews/lld-readiness-resolutions.json"
      validator_feedback: "${steps.validate_llds.outputs.issues_summary}"
    outputs: [summary, contract_change_needed, contract_change, needs_clarification]
    max_visits: 10
    routes:
      - {when: "${steps.revise_llds.outputs.needs_clarification} == true", to: prepare_lld_questions}
      - {when: "${steps.revise_llds.outputs.contract_change_needed} == true", to: contract_change}
      - {to: readiness_resolution}

  # Engine-owned: with blocking readiness findings open, each must be fixed, contested or
  # escalated; an escalation (or a second contest) goes to the person at LLD approval, after the
  # test cases are written so the approval shows them.
  - id: readiness_resolution
    type: script
    label: Findings fixed, contested or escalated?
    run: [python3, .maestro/engine/findings.py, resolve, --findings, ".maestro/runs/${inputs.slug}/reviews/lld-readiness-findings.json", --resolutions, ".maestro/runs/${inputs.slug}/reviews/lld-readiness-resolutions.json"]
    max_visits: 10
    on_exhausted: test_cases
    routes:
      - {when: "${steps.readiness_resolution.outputs.state} == escalate", to: test_cases}
      - {when: "${steps.readiness_resolution.outputs.state} == incomplete", to: revise_llds}
      - {to: validate_llds}

  - id: record_approval
    type: script
    label: Record the approved design hashes
    run: [python3, .maestro/engine/lld_set.py, approve, --root, ., --slug, "${inputs.slug}", --light, "${inputs.light}"]
    on_fail: abort
    next: end

outputs:
  repos_csv: "${steps.lld_scope_init.outputs.selected_csv}"
  test_cases_path: ".maestro/runs/${inputs.slug}/test-cases.md"
  readiness_summary: "${steps.readiness_review.outputs.summary}"
  approval_path: "${steps.record_approval.outputs.approval_path}"
