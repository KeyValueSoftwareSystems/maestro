# A small change: a short plan, then build, test, review and ship.
name: minor-feature
description: Plan, build, test and review a small change, and open a PR.
max_steps: 30
steps:
  - id: plan
    agent: keystone
    run: inline
    skills: {brainstorm: grill-me, design: system-design}
    instructions: |
      Plan the change in ${run}/request.md. Read docs/ and .maestro/workspace.yaml first.
      This is a small change: keep the brainstorm to the questions that matter and the plan short,
      and leave out Design unless the change needs one. Write the plan to ${run}/plan.md.
      Record the repos the plan touches as `repos`.

  - id: approve-plan
    mode: gate
    prompt: The plan for ${slug} is in ${run}/plan.md. Approve, or tell me what to change.
    on_reject: plan

  - id: worktree
    agent: worker
    model: haiku
    foreach: repo
    instructions: |
      In repo ${repo} (its path is in .maestro/workspace.yaml), update the default branch from
      origin if there is a remote. Then create a git worktree at the absolute path of
      .maestro/worktrees/${slug}/${repo} on a new branch feat/${slug}, starting from the default branch.
      Record the worktree path as `worktree` and the branch name as `branch`.

  - id: build
    agent: brew
    foreach: repo
    instructions: |
      Build the ${repo} tasks in ${run}/plan.md in ${worktree} on branch ${branch}, with their tests.

  - id: checks
    mode: exec
    foreach: repo
    command: [build, lint, test]
    on_fail: build

  - id: test
    agent: litmus
    instructions: |
      Write mode, then run mode. Add any test in the Test plan of ${run}/plan.md that is still
      missing, and commit it on ${branch}. Then run the whole Test plan in ${worktree}.
      Write the report to ${run}/test-report.md.
    on_fail: build

  - id: review
    agent: birbal
    instructions: |
      Review the changes on branch ${branch} in ${worktree} against ${run}/plan.md.
      Write the review to ${run}/review.md.
    on_fail: build

  - id: archive
    mode: workflow
    workflow: subworkflows/archive.yaml
