# A small change: a short plan, then build, test, review and ship.
name: minor-feature
description: Plan, build, test and review a small change, and open a PR.
max_steps: 30
steps:
  - id: plan
    agent: keystone
    run: inline
    skills: {brainstorm: grill-the-idea, design: system-design}
    instructions: |
      Plan the change in ${run}/requirements.md. Read docs/ (skip docs/plans/) and .maestro/workspace.yaml first.
      This is a small change: keep the brainstorm to the questions that matter and the plan short,
      and leave out Design unless the change needs one. Write the plan to ${run}/plan.md.
      Record the repos the plan touches as `repos`.

  - id: approve-plan
    mode: gate
    prompt: The plan for ${slug} is in ${run}/plan.md. Approve, or tell me what to change.
    on_reject: plan

  - id: worktree
    agent: worker
    model: haiku
    instructions: |
      Create a worktree for each repo in ${repos}, on a new branch feat/${slug} from origin's
      latest default branch. Reuse any that already exist.
      - If .maestro/workspace.yaml has `worktrees`, run its `create` command once from the
        workspace root, with {slug} and {branch} filled in, unless every repo's `path` already
        exists. Each repo's worktree is at its `path`.
      - Otherwise, in each repo (path in .maestro/workspace.yaml), create a git worktree at the
        absolute path of .maestro/worktrees/${slug}/<repo>.
      Then run each repo's `setup` command in its worktree, if it has one.
      Record `worktree` (absolute paths) and `branch` as maps keyed by repo, such as
      `worktree: {api: /abs/path/api, web: /abs/path/web}`.

  - id: build
    agent: brew
    model: sonnet
    foreach: repo
    instructions: |
      Build the ${repo} tasks in ${run}/plan.md in ${worktree} on branch ${branch}, with their tests.

  - id: checks
    mode: exec
    foreach: repo
    command: [build, lint, test]
    on_fail: build

  - id: test
    agent: litmus
    model: sonnet
    instructions: |
      Write mode, then run mode. Add any test in the Test plan of ${run}/plan.md that is still
      missing. Then run the whole Test plan in ${worktree}.
      If .maestro/workspace.yaml has `environment`, start, find and stop the stack with its
      `start`, `urls` and `stop` commands, run from the workspace root with {slug} as ${slug}.
      Write the report to ${run}/test-report.md.
    on_fail: build

  - id: review
    agent: birbal
    instructions: |
      Review the changes on branch ${branch} in ${worktree} against ${run}/plan.md.
      Write the review to ${run}/review.md.
    on_fail: build

  - id: archive
    mode: workflow
    workflow: subworkflows/archive.yaml
