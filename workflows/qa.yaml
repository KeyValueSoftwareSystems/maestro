# QA phase: the engine brings the QA environment up from maestro.config.yaml (built from the
# verified worktrees) and reports whether the workspace has an E2E suite. With one, the QA agent
# automates the test-case catalog in that framework and runs it; without one, it checks each case
# directly against the running system and adds no framework. Then the engine runs each
# repository's own e2e command. Test-harness failures get a bounded fix cycle; a product bug
# ends QA with `product_bug` and the repos to fix, and delivery fixes them in their worktrees and
# re-runs QA. The environment is stopped on every normal exit.
version: 1
name: qa
title: QA
description: Automate and run the functional test suite; fix loop on failures.
inputs:
  slug: {type: string, required: true}
  feature: {type: string, default: "${inputs.slug}"}
  implementation_manifest: {type: string, required: true, description: engine-verified repo/worktree/commit manifest}
  implementation_manifest_sha256: {type: string, required: true, description: engine-produced manifest digest}
defaults:
  model: sonnet
  agent: qa
  max_visits: 10
start: env_up
nodes:
  - id: env_up
    type: script
    label: Start the QA environment
    run: [python3, .maestro/engine/qa_env.py, up, --root, ".", --manifest, "${inputs.implementation_manifest}", --logs, ".maestro/runs/${inputs.slug}/.engine/logs/qa"]
    timeout: 1800
    on_fail: ask
    next: e2e_plan

  # Whether the workspace has an E2E suite, from the `e2e` commands init/sync confirmed.
  - id: e2e_plan
    type: script
    label: Find the project's E2E suite
    run: [python3, .maestro/engine/qa_env.py, plan, --root, "."]
    next: qa_run

  - id: qa_run
    type: agent
    label: Run the test cases (E2E suite when the project has one)
    brief: full
    instruction: |
      Test the functional test-case catalog at .maestro/runs/${inputs.slug}/design/test-cases.md
      (critical journeys first). ${steps.e2e_plan.outputs.summary}.
      The catalog states each expected result in the PRD's terms. Take the exact values to assert
      (status codes, error codes, field names, messages, limits) from the approved design: the
      contract at .maestro/runs/${inputs.slug}/design/openapi.yaml and the HLD at
      .maestro/runs/${inputs.slug}/design/hld.md when they exist, and the repository LLDs in
      .maestro/runs/${inputs.slug}/design/lld/ (the only source on the light path, which has neither).
      Where the design cannot meet a case's expected behaviour, the case fails: never bend the case
      to the design.
      Project E2E suite present: ${steps.e2e_plan.outputs.has_e2e}.
      - true: automate the catalog into an executable E2E suite under
        .maestro/runs/${inputs.slug}/qa/ in that framework, reusing its config, fixtures and
        helpers, and RUN it. Do not install packages or browsers.
      - false: do not add a framework, install packages or write a suite. Check each case
        directly against the running system with tools already available (HTTP requests, the
        CLI, database queries, the repositories' own test runners) and record what you observed
        as each case's evidence in the report.
      Write the run report. Report
      results honestly — failures route into the fix loop, they are not yours to hide.
      Before doing anything, SHA-256 ${inputs.implementation_manifest} and require it to
      equal ${inputs.implementation_manifest_sha256}; fail integrity if it differs. Then
      read it. For every repository,
      verify the listed worktree is still on the exact listed branch and commit. Run and
      author tests ONLY against those worktree paths; never use codebase/<repo> or another
      default checkout. If any identity check fails, report a failed integrity check and do
      not test a different revision.
      On a re-run after a fix round, reuse the existing suite under .maestro/runs/${inputs.slug}/qa/:
      re-run the specs that failed in the previous report first, author only specs that are still
      missing, and run the full suite once at the end — do not re-author passing specs.
      Record each catalog case's result in .maestro/runs/${inputs.slug}/qa/results.json:
      {"schema_version": 1, "cases": [{"id": "<TC id from the catalog>", "status": "passed" |
      "failed" | "skipped", "note": "<why, for failed or skipped>"}]}. A case you did not automate
      or run is "skipped" with the reason; the engine traces every acceptance criterion through it.
      QA environment: ${steps.env_up.outputs.summary}. When the engine started it, test against
      that running stack; do not start or stop it yourself.
    skill: qa-automation
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      implementation_manifest: "${inputs.implementation_manifest}"
      implementation_manifest_sha256: "${inputs.implementation_manifest_sha256}"
      test_cases_path: ".maestro/runs/${inputs.slug}/design/test-cases.md"
      contract_path: ".maestro/runs/${inputs.slug}/design/openapi.yaml"
      hld_path: ".maestro/runs/${inputs.slug}/design/hld.md"
      lld_dir: ".maestro/runs/${inputs.slug}/design/lld"
    outputs: [passed, failed_count, summary]
    artifact:
      - ".maestro/runs/${inputs.slug}/qa/report.md"
      - ".maestro/runs/${inputs.slug}/qa/results.json"
    fresh: true
    max_visits: 5
    on_exhausted: qa_gate
    routes:
      - {when: "${steps.qa_run.outputs.passed} == true", to: e2e_suite}
      - {to: qa_fix}

  # The engine runs each repository's own e2e command in its verified worktree; a failure is
  # diagnosed like any QA failure.
  - id: e2e_suite
    type: script
    label: Project e2e suites (engine)
    run: [python3, .maestro/engine/qa_env.py, e2e, --root, ".", --manifest, "${inputs.implementation_manifest}", --out, ".maestro/runs/${inputs.slug}/qa/e2e-receipt.json", --logs, ".maestro/runs/${inputs.slug}/.engine/logs/qa"]
    timeout: 3600
    max_visits: 6
    on_exhausted: qa_gate
    routes:
      - {when: "${steps.e2e_suite.outputs.passed} == true", to: env_down}
      - {to: qa_fix}

  - id: qa_fix
    type: agent
    label: Fix failures
    instruction: |
      One fix attempt: diagnose the failures in .maestro/runs/${inputs.slug}/qa/report.md and, when
      the project's e2e suites failed (${steps.e2e_suite.outputs.summary}), the receipt at
      .maestro/runs/${inputs.slug}/qa/e2e-receipt.json and the logs it names.
      You may fix only a genuine test-harness bug under .maestro/runs/${inputs.slug}/qa/;
      never weaken or delete a legitimate assertion. Do NOT change product code or any
      worktree listed in ${inputs.implementation_manifest}: that would invalidate its
      reviewed commit identity.
      If the product is wrong, return product_bug=true, the repositories to fix in bug_repos
      (comma-separated names from the manifest), and write the diagnosis to
      .maestro/runs/${inputs.slug}/qa/bugs.md: per repository, the failing case IDs, expected vs
      actual behaviour, how to reproduce, and the suspected code. The workflow then fixes those
      repositories and re-runs QA. For any other hard stop (an environment you cannot fix, a
      contract or design question), return escalate=true. Re-run the failing specs before
      returning; skip the full suite, since the workflow re-runs QA after you. Honour any human
      guidance: ${steps.qa_gate.outputs.guidance}
      Do NOT loop — the workflow re-invokes you if needed.
    skill: fix-loop
    inputs:
      slug: "${inputs.slug}"
      report: ".maestro/runs/${inputs.slug}/qa/report.md"
      implementation_manifest: "${inputs.implementation_manifest}"
      implementation_manifest_sha256: "${inputs.implementation_manifest_sha256}"
      guidance: "${steps.qa_gate.outputs.guidance}"
    outputs: [fix_summary, checks_passed, escalate, product_bug, bug_repos]
    max_visits: 3
    on_exhausted: qa_gate
    routes:
      - {when: "${steps.qa_fix.outputs.product_bug} == true", to: env_down}
      - {when: "${steps.qa_fix.outputs.escalate} == true", to: qa_gate}
      - {to: qa_run}

  - id: qa_gate
    type: gate
    label: QA escalation
    prompt: |
      QA is still failing after the automated fix rounds, or the fix step escalated.
      Last run: ${steps.qa_run.outputs.summary}
      Project e2e: ${steps.e2e_suite.outputs.summary}
      Last fix attempt: ${steps.qa_fix.outputs.fix_summary}
      Report: .maestro/runs/${inputs.slug}/qa/report.md
    options:
      - {id: retry, label: One more fix round (with your guidance), to: qa_fix, input: guidance}
      - {id: accept, label: Accept with known failures, to: env_down}
      - {id: abandon, label: Abort, to: abort}

  - id: env_down
    type: script
    label: Stop the QA environment
    run: [python3, .maestro/engine/qa_env.py, down, --root, ".", --manifest, "${inputs.implementation_manifest}", --logs, ".maestro/runs/${inputs.slug}/.engine/logs/qa"]
    timeout: 900
    next: end

outputs:
  qa_summary: "${steps.qa_run.outputs.summary}"
  qa_results: ".maestro/runs/${inputs.slug}/qa/results.json"
  e2e_summary: "${steps.e2e_suite.outputs.summary}"
  product_bug: "${steps.qa_fix.outputs.product_bug}"
  bug_repos: "${steps.qa_fix.outputs.bug_repos}"
  bug_report: ".maestro/runs/${inputs.slug}/qa/bugs.md"
  qa_report: ".maestro/runs/${inputs.slug}/qa/report.md"
