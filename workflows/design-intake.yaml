# Design child: requirement folder -> project context summary. No confirmation stops: the
# summary is shown at PRD approval, where the human corrects it. Reference links and files go
# in the requirement folder. Entered by design.yaml first, and again for a product or
# cross-cutting architecture-review revision. The lead reads maintained summaries and
# requirement inputs only; it never scans application source. Its outputs ground the PRD phase.
version: 1
name: design-intake
description: Check the requirement and summarize the project context.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
defaults:
  model: opus
  agent: planner
  max_visits: 10
start: assert_requirement
nodes:
  - id: assert_requirement
    type: script
    label: Requirement present?
    run: [python3, .maestro/engine/requirement_serve.py, ".maestro/runs/${inputs.slug}/requirement"]
    routes:
      - {when: "${steps.assert_requirement.outputs.state} == have", to: project_context}
      - {to: requirement_intake}

  - id: requirement_intake
    type: gate
    label: No requirement found
    prompt: |
      No requirement files in .maestro/runs/${inputs.slug}/requirement/.

      How do you want to supply the requirement for "${inputs.feature}"? Put any reference
      links (Figma, tickets, docs) in a file in that folder too.
    options:
      - {id: add-files, label: I'll add files now — re-check, to: assert_requirement}
      - {id: clarify, label: Clarify it with me, to: project_context}
      - {id: reject, label: Abort the run, to: abort}

  - id: project_context
    type: agent
    execution: lead
    label: Summarize project context
    instruction: |
      State this project's product context in at most three short sentences. Read only root
      AGENTS.md / CLAUDE.md, maintained summaries under docs/ (architecture.md, technical/,
      functional/), and every file under .maestro/runs/${inputs.slug}/requirement/, including
      any reference links listed there. Local paths are read; links that cannot be opened are
      recorded for the PRD and become a question only if their content matters. Do not read
      application source or search outside this repository. If context is missing, say so
      plainly.
    skill: prd-interview
    inputs:
      slug: "${inputs.slug}"
      requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
    outputs: [project_context]
    next: end

outputs:
  project_context: "${steps.project_context.outputs.project_context}"
  references: "reference links and files in .maestro/runs/${inputs.slug}/requirement/"
