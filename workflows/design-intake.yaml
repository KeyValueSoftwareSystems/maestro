# Design child: requirement folder -> project context summary. No confirmation stops: the
# summary is shown at PRD approval, where the human corrects it. Reference links and files go
# in the requirement folder. Entered by design.yaml first. The lead reads maintained summaries
# and requirement inputs only; it never scans application source. Its outputs ground the PRD phase.
version: 1
name: design-intake
title: Intake
description: Check the requirement and summarize the project context.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
defaults:
  model: opus
  agent: product
  max_visits: 10
start: assert_requirement
nodes:
  - id: assert_requirement
    type: script
    label: Find the requirement
    say: Looking for the requirement you gave.
    run: [python3, .maestro/engine/requirement_serve.py, ".maestro/runs/${inputs.slug}/requirement"]
    routes:
      - {when: "${steps.assert_requirement.outputs.state} == have", to: project_context}
      - {to: requirement_intake}

  - id: requirement_intake
    type: gate
    label: No requirement found
    say: I found no requirement for this feature; one choice for you.
    prompt: |
      How do you want to give me the requirement for "${inputs.feature}"?
      Everything that follows is built from it, and I found no files for it yet.
      Requirement folder: .maestro/runs/${inputs.slug}/requirement/ (put reference links to designs,
      tickets or docs in a file there too)
    options:
      - id: add-files
        label: "I'll add files now — re-check"
        description: "Drop the files in the folder, then pick this; I read every one."
        to: assert_requirement
      - id: clarify
        label: "Clarify it with me"
        description: "We work it out together in a short conversation."
        to: project_context
      - id: reject
        label: "Abort the run"
        description: "Stop here; nothing is built."
        to: abort

  - id: project_context
    type: agent
    execution: lead
    label: Summarize the project
    say: Reading the project to sum up its context.
    instruction: |
      State this project's product context in at most three short sentences. Read only root
      AGENTS.md / CLAUDE.md, docs/architecture.md (System context and repos, Domain map,
      Glossary and aliases), docs/product/ when present, the docs/functional/<domain>.md of the
      domains the request touches (pick them from the Domain map), and every file under
      .maestro/runs/${inputs.slug}/requirement/, including
      any reference links listed there. Local paths are read; links that cannot be opened are
      recorded for the PRD and become a question only if their content matters. Do not read
      application source or search outside this repository. If context is missing, say so
      plainly.
    skill: prd-interview
    inputs:
      slug: "${inputs.slug}"
      requirement_dir: ".maestro/runs/${inputs.slug}/requirement"
    outputs: [project_context]
    next: end

outputs:
  project_context: "${steps.project_context.outputs.project_context}"
  references: "reference links and files in .maestro/runs/${inputs.slug}/requirement/"
