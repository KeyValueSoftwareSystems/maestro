# Design child: everything after PRD approval except the test cases: impact assessment, sizing,
# HLD (reviewed by a fresh architect, then approved), scaffold (new product only), contract (only
# when the HLD lists cross-repository interfaces) and the repository LLDs (one run,
# readiness-checked, approved).
#
#   full:   impact -> sizing -> hld -> [scaffold] -> [contract] -> lld
#   light:  impact -> sizing -> lld
#
# design.yaml runs it beside design-tests.yaml: the test cases need only the approved PRD. Each
# stage keeps its own revision loops and sets `on_fail: abort`, so a rejection inside a stage fails
# this workflow. The contract comes before the LLDs so every repository builds against one version
# of it; the HLD validator's `interfaces_changed` decides whether it runs.
version: 1
name: design-solution
title: Solution design
description: Size the feature, then design it - HLD, contract and repository LLDs - from the approved PRD.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  feedback: {type: string, default: "", description: revision note from the release gate (empty on first pass)}
  path: {type: string, default: auto, description: "design path: auto (sized after the PRD), full or light"}
defaults:
  model: opus
  agent: architect
  max_visits: 10
start: greenfield_check
nodes:
  # Engine-owned: no repository in the workspace yet means the HLD decides which to create and a
  # scaffold stage builds them before the contract and LLDs.
  - id: greenfield_check
    type: script
    label: Existing code or a new product?
    run: [python3, .maestro/engine/greenfield.py, check, --root, "."]
    routes:
      - {when: "${steps.greenfield_check.outputs.greenfield} == true", to: sizing}
      - {to: impact}

  # Which repositories the feature changes, whether it crosses a boundary between them, and whether
  # it is a minor or a major change. The agent judges; the engine checks the names and the size, and
  # takes the light design path for minor and the LLD scope from the repositories.
  - id: impact
    type: agent
    label: Impact assessment
    model: sonnet
    brief: minimal
    instruction: |
      Assess which repositories the approved PRD at
      .maestro/runs/${inputs.slug}/requirement/prd.md changes, and whether it changes an interface
      between repositories, stored data (a migration) or infrastructure, and whether it is a minor
      or a major change. Then list everything it touches (schema_version 2): domains, tables,
      jobs, queues, endpoints with the screens and clients that call them, the INV rules at risk and
      the CS change scenarios it triggers, each with a one-line reason and a pointer to its
      evidence. Every later design must deal with each item, so a missed one is missed work. Use
      each repository's codebase map, the domain pages and change scenarios when present, and only
      the source needed to place a change; do not design. Write the assessment to
      .maestro/runs/${inputs.slug}/impact.json.
    skill: feature-impact
    inputs:
      slug: "${inputs.slug}"
      prd_path: ".maestro/runs/${inputs.slug}/requirement/prd.md"
      impact_path: ".maestro/runs/${inputs.slug}/impact.json"
      domain_pages: "docs/functional/"
      change_scenarios: "docs/impact/side-effects.yaml"
    outputs: [impact_summary, repos_csv]
    artifact: ".maestro/runs/${inputs.slug}/impact.json"
    fresh: true
    # repos_csv downstream is the engine's validated list, not the agent's claim; the engine also
    # adds every change scenario the PRD triggers, so a rule-driven match never rests on the agent
    check: {run: [python3, .maestro/engine/impact.py, validate, --root, ".", --impact, ".maestro/runs/${inputs.slug}/impact.json", --prd, ".maestro/runs/${inputs.slug}/requirement/prd.md"]}
    max_visits: 3
    on_exhausted: sizing
    # the assessment only narrows the LLD scope: one that never validates is skipped
    on_fail: sizing
    next: sizing

  # Engine-owned: a feature the impact assessment calls minor skips the HLD and contract
  # (PRD -> LLD -> readiness -> approval); major, the full path. Without a valid
  # assessment the engine falls back to its rules (few criteria, no non-functional targets, one repo).
  - id: sizing
    type: script
    label: Full or light design?
    run: [python3, .maestro/engine/sizing.py, --root, ".", --prd, ".maestro/runs/${inputs.slug}/requirement/prd.md", --impact, ".maestro/runs/${inputs.slug}/impact.json", --path, "${inputs.path}"]
    routes:
      - {when: "${steps.sizing.outputs.path} == light", to: lld}
      - {to: hld}

  - id: hld
    type: subworkflow
    label: HLD and architecture review
    workflow: .maestro/workflows/design-hld.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${inputs.feedback}"
      greenfield: "${steps.greenfield_check.outputs.greenfield}"
    on_fail: abort
    routes:
      - {when: "${steps.greenfield_check.outputs.greenfield} == true", to: scaffold}
      - {when: "${steps.hld.outputs.interfaces_changed} == true", to: contract}
      - {to: lld}

  - id: scaffold
    type: subworkflow
    label: Scaffold the new repositories
    workflow: .maestro/workflows/scaffold.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    on_fail: abort
    routes:
      - {when: "${steps.hld.outputs.interfaces_changed} == true", to: contract}
      - {to: lld}

  - id: contract
    type: subworkflow
    label: API contract
    workflow: .maestro/workflows/design-contract.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${inputs.feedback}"
    on_fail: abort
    next: lld

  - id: lld
    type: subworkflow
    label: Repository LLDs
    workflow: .maestro/workflows/design-lld.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      feedback: "${inputs.feedback}"
      light: "${steps.sizing.outputs.path}"
      required_repos: "${steps.hld.outputs.infra_repos_csv}"
      impact_repos: "${steps.impact.outputs.repos_csv}"
    on_fail: abort
    next: end

outputs:
  design_path: "${steps.sizing.outputs.path}"
  hld_summary: "${steps.hld.outputs.hld_summary}"
  contract_summary: "${steps.contract.outputs.contract_summary}"
  # empty when the stage did not run (the light path writes no HLD or contract)
  hld_path: "${steps.hld.outputs.hld_path}"
  contract_path: "${steps.contract.outputs.contract_path}"
  repos_csv: "${steps.lld.outputs.repos_csv}"
