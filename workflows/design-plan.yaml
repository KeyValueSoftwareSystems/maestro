# Design child: the plan — one document at docs/plans/active/<slug>.md that says what gets built,
# where and why: the design for every repository, and the interfaces between them.
#
#   greenfield? -> plan status -> brainstorm (person-led) -> write? -> write plan -> commit
#   -> [scaffold] -> plan approval -> record approval
#
# The person opens the brainstorm; the architect suggests, flags issues and challenges with
# evidence, then writes the agreed notes. The plan is written from the approved PRD and those notes
# (major: the full plan; minor: 5-10 lines), checked by the engine, and committed in the workspace
# root on every write. A person approves the plan in every run mode: no gate here has an `auto:`
# policy. "Later" pauses the run at the approval; resuming asks the same question again.
#
# Entered by design.yaml after PRD approval, beside the functional test cases. A release sent back
# with feedback re-enters at the plan writer when a plan exists (no fresh brainstorm unless the
# person picks rethink). The approval binds the PRD and the plan; design.yaml binds the test
# cases once both branches are done.
version: 1
name: design-plan
title: Plan
description: Brainstorm the change with the person, write the plan, commit it and get it approved.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
  feedback: {type: string, default: "", description: revision note from the release gate or a stale design (empty on first pass)}
  path: {type: string, required: true, enum: [major, minor], description: "major: the full plan; minor: a 5-10 line plan"}
defaults:
  model: opus
  agent: architect
  max_visits: 10
start: greenfield_check
nodes:
  # Engine-owned: no repository in the workspace yet means the plan names the repositories to
  # create, and the scaffold stage builds them before the plan is approved.
  - id: greenfield_check
    type: script
    label: Existing code or new product?
    say: Checking whether the workspace already has code.
    run: [python3, .maestro/engine/greenfield.py, check, --root, "."]
    next: plan_status

  # Engine-owned: a plan sent back with feedback (release revise, a stale design) is edited, not
  # re-brainstormed; anything else starts or resumes the conversation.
  - id: plan_status
    type: script
    label: Find an existing plan
    say: Looking for an existing plan.
    run: [python3, .maestro/engine/plan_doc.py, status, --root, ".", --slug, "${inputs.slug}"]
    routes:
      - {when: "${steps.plan_status.outputs.active} == false", to: brainstorm}
      - {when: "${inputs.feedback}", to: write_plan}
      - {to: brainstorm}

  # Architect role, in the lead's session: an open conversation the person leads and ends.
  - id: brainstorm
    type: agent
    execution: lead
    label: Brainstorm the change
    say: Let's talk the change through before the plan is written.
    instruction: |
      Brainstorm how to build ${inputs.feature} with the person, as a conversation. Change type:
      ${inputs.path}. Read the approved PRD at .maestro/runs/${inputs.slug}/requirement/prd.md, the
      decision log at .maestro/runs/${inputs.slug}/decisions/decision-log.md, docs/architecture.md and
      the codebase maps under docs/codebase-maps/ for the repositories it touches; read source only
      where a point depends on it. Greenfield (no code yet): ${steps.greenfield_check.outputs.greenfield}.
      Feedback to address (empty on the first pass): ${steps.plan_approval.outputs.feedback} ${inputs.feedback}

      Let the person open. Then suggest, name improvements and issues, and challenge with
      evidence, one topic per turn; wait for every reply. Do not complete this step until the
      person says they are done. Then write the recap to
      .maestro/runs/${inputs.slug}/decisions/brainstorm.md (Direction, Decisions, Open points). If
      that file exists from an earlier pass, pick up from it and update it in place.
    skill: plan-brainstorm
    inputs:
      feature: "${inputs.feature}"
      slug: "${inputs.slug}"
      plan_type: "${inputs.path}"
      prd_path: ".maestro/runs/${inputs.slug}/requirement/prd.md"
      decision_log: ".maestro/runs/${inputs.slug}/decisions/decision-log.md"
      notes_path: ".maestro/runs/${inputs.slug}/decisions/brainstorm.md"
      feedback: "${steps.plan_approval.outputs.feedback} ${inputs.feedback}"
      greenfield: "${steps.greenfield_check.outputs.greenfield}"
      codebase_lessons: "${memory.knowledge.codebase}"
    outputs: [summary]
    artifact: ".maestro/runs/${inputs.slug}/decisions/brainstorm.md"
    max_visits: 6
    on_exhausted: brainstorm_confirm
    next: brainstorm_confirm

  - id: brainstorm_confirm
    type: gate
    label: Write the plan?
    say: The discussion is wrapped up; one choice for you.
    prompt: |
      Should I write the plan from our discussion?
      The plan is what gets built, so write it only once the approach feels settled.
      ${steps.brainstorm.outputs.summary}
      Notes: .maestro/runs/${inputs.slug}/decisions/brainstorm.md
    options:
      - id: write
        label: "Write the plan"
        description: "I write the plan from the notes, then ask you to approve it."
        to: write_plan
      - id: more
        label: "Keep talking"
        description: "We carry on the discussion; nothing is written yet."
        to: brainstorm

  # Architect role: the only plan writer. A revision applies the feedback only.
  - id: write_plan
    type: agent
    execution: lead
    label: Write the plan
    say: Writing the plan.
    instruction: |
      Plan type: ${inputs.path}. Plan approval choice (empty before the first approval):
      ${steps.plan_approval.outputs.choice}. Feedback: ${steps.plan_approval.outputs.feedback} ${inputs.feedback}

      When there is feedback and the plan exists at docs/plans/active/${inputs.slug}.md, apply only
      that feedback as a targeted edit: keep every other line, decision and repository unchanged.

      Otherwise write the plan to docs/plans/active/${inputs.slug}.md (the workspace root, not a
      repository) from the approved PRD at .maestro/runs/${inputs.slug}/requirement/prd.md and the
      brainstorm notes at .maestro/runs/${inputs.slug}/decisions/brainstorm.md. Its header names this
      run (`Run: ${inputs.slug}`). Decisions come from the brainstorm notes only. Name every
      repository it changes; use the names in maestro.config.yaml, and mark a repository to
      create as new. A major plan maps every PRD acceptance criterion in Acceptance coverage; a
      minor plan is 5-10 lines. When more than one repository is involved, write the exact
      interface shapes (method, path, fields, errors) in the plan: there is no separate contract.

      Check it with `python3 .maestro/engine/plan_doc.py validate --root . --slug ${inputs.slug}
      --type ${inputs.path} --prd .maestro/runs/${inputs.slug}/requirement/prd.md` and fix what it
      reports before completing. If the engine's check failed, fix only what it names.
    skill: plan-writing
    inputs:
      feature: "${inputs.feature}"
      slug: "${inputs.slug}"
      plan_type: "${inputs.path}"
      plan_path: "docs/plans/active/${inputs.slug}.md"
      prd_path: ".maestro/runs/${inputs.slug}/requirement/prd.md"
      brainstorm_path: ".maestro/runs/${inputs.slug}/decisions/brainstorm.md"
      decision_log: ".maestro/runs/${inputs.slug}/decisions/decision-log.md"
      approval_choice: "${steps.plan_approval.outputs.choice}"
      revision_feedback: "${steps.plan_approval.outputs.feedback} ${inputs.feedback}"
      validator: ".maestro/engine/plan_doc.py"
      living_docs: "docs/architecture.md"
      codebase_lessons: "${memory.knowledge.codebase}"
      lessons: "${memory.knowledge.plan}"
    outputs: [summary]
    artifact: "docs/plans/active/${inputs.slug}.md"
    check: {run: [python3, .maestro/engine/plan_doc.py, validate, --root, ".", --slug, "${inputs.slug}", --type, "${inputs.path}", --prd, ".maestro/runs/${inputs.slug}/requirement/prd.md"]}
    max_visits: 8
    next: commit_plan

  # Engine-owned: commit only the plan file in the workspace root (`created` the first time,
  # `updated` after). Never fails the run: a skipped commit is reported in `say`.
  - id: commit_plan
    type: script
    label: Save the plan
    say: Saving the plan.
    run: [python3, .maestro/engine/plan_doc.py, commit, --root, ".", --slug, "${inputs.slug}", --event, auto]
    routes:
      # a new product: create the repositories the plan names, once per pass
      - {when: "${steps.greenfield_check.outputs.greenfield}:${steps.scaffold.outputs.repos_csv} == true:", to: scaffold}
      - {to: plan_approval}

  - id: scaffold
    type: subworkflow
    label: Scaffold the new repositories
    say: Creating the new repositories the plan names.
    workflow: .maestro/workflows/scaffold.yaml
    inputs: {slug: "${inputs.slug}", feature: "${inputs.feature}"}
    on_fail: abort
    next: plan_approval

  # A person approves the plan in every run mode (no `auto:` policy).
  - id: plan_approval
    type: gate
    label: Plan approval
    say: The plan is ready for your approval.
    prompt: |
      Approve the plan for ${inputs.feature}?
      Once approved, the code is written to it; changing the plan later sends the run back here.
      ${steps.write_plan.outputs.summary}
      The plan: docs/plans/active/${inputs.slug}.md
      ${steps.commit_plan.outputs.say}
    options:
      - id: approve
        label: "Approve — build from this plan"
        description: "Build from this plan."
        to: record_approval
      - id: revise
        label: "Revise — tell me what to change"
        description: "Tell me what to change; I edit the plan and ask you again."
        to: write_plan
        input: feedback
      - id: rethink
        label: "Rethink — discuss it again first"
        description: "Go back to the discussion, then rewrite the plan."
        to: brainstorm
        input: feedback
      - id: later
        label: "Later — stop here and resume when ready"
        description: "Stop here and keep everything; resume with /maestro ${inputs.slug}."
        pause: true
      - id: reject
        label: "Reject — stop this run"
        description: "Stop this run; nothing is built."
        to: abort

  # Engine-owned: bind the approval to the exact PRD and plan, and record the repositories in
  # scope. design.yaml binds the test cases once they are written too.
  - id: record_approval
    type: script
    label: Record the plan approval
    say: Recording your approval.
    run: [python3, .maestro/engine/plan_doc.py, approve, --root, ".", --slug, "${inputs.slug}"]
    on_fail: abort
    next: end

outputs:
  plan_path: "docs/plans/active/${inputs.slug}.md"
  repos_csv: "${steps.record_approval.outputs.repos_csv}"
  plan_summary: "${steps.write_plan.outputs.summary}"
