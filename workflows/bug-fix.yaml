# Ask the person's guess at the cause, find the root cause, fix it with a regression test,
# review the fix and ship it.
name: bug-fix
description: Root-cause a bug, fix it with a regression test, review it, and open a PR.
max_steps: 30
steps:
  - id: hypothesis
    agent: worker
    run: inline
    instructions: |
      Ask the person for one sentence on what they think causes the bug. "No idea" is a fine
      answer. Don't suggest causes. Write their answer, word for word, to ${run}/hypothesis.md.

  - id: investigate
    agent: sherlock
    model: opus
    instructions: |
      Investigate the bug described in ${run}/requirements.md. For context, read
      docs/architecture.md, then only the domain docs it points to for this bug.
      Test the person's guess in ${run}/hypothesis.md first, without assuming it is right. Say in
      rca.md whether it held, with the evidence.
      Write the root-cause report to ${run}/rca.md.
      To bisect, debug or write the failing test, use a git worktree at the absolute path of
      .maestro/worktrees/${slug}/<repo> on a new branch fix/${slug}, from origin's latest default branch.
      Record the repos the fix touches as `repos` (names from .maestro/workspace.yaml).

  - id: confirm
    mode: gate
    prompt: |
      The root cause for ${slug} is in ${run}/rca.md.
      Approve the fix direction, or tell me what to look at instead.
    on_reject: investigate

  - id: worktree
    agent: worker
    model: haiku
    foreach: repo
    instructions: |
      In repo ${repo} (path in .maestro/workspace.yaml), create a git worktree at the absolute path of
      .maestro/worktrees/${slug}/${repo} on a new branch fix/${slug}, starting from origin's latest
      default branch. If that worktree already exists, reuse it.
      Then run the repo's `setup` command in the worktree, if it has one.
      Record the worktree path as `worktree` and the branch name as `branch`.

  - id: fix
    agent: brew
    model: sonnet
    foreach: repo
    instructions: |
      Fix the bug in ${worktree} on branch ${branch}, following ${run}/rca.md.
      First add the report's failing test as a regression test, then fix the code.

  - id: checks
    mode: exec
    foreach: repo
    command: [build, lint, test]
    on_fail: fix

  - id: review
    agent: birbal
    instructions: |
      Review the changes on branch ${branch} in ${worktree} against ${run}/rca.md.
      Write the review to ${run}/review.md.
    on_fail: fix

  - id: archive
    mode: workflow
    workflow: subworkflows/archive.yaml
