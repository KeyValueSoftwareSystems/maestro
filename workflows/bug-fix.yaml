# Ask the person's guess at the cause, find the root cause, fix it with a regression test,
# review the fix and ship it.
name: bug-fix
description: Root-cause a bug, fix it with a regression test, review it, and open a PR.
max_steps: 30
steps:
  - id: hypothesis
    agent: worker
    run: inline
    instructions: |
      Ask the person for one sentence on what they think causes the bug. "No idea" is a fine
      answer. Don't suggest causes. Write their answer, word for word, to ${run}/hypothesis.md.

  - id: investigate
    agent: sherlock
    model: opus
    instructions: |
      Investigate the bug described in ${run}/requirements.md. Read docs/ (skip docs/plans/) for context.
      Test the person's guess in ${run}/hypothesis.md first, without assuming it is right. Say in
      rca.md whether it held, with the evidence.
      Write the root-cause report to ${run}/rca.md.
      To bisect, debug or write the failing test, work in a worktree on a new branch fix/${slug}
      from origin's latest default branch: from the `worktrees` tool in .maestro/workspace.yaml if
      it has one, otherwise a git worktree at .maestro/worktrees/${slug}/<repo>.
      Record the repos the fix touches as `repos` (names from .maestro/workspace.yaml).

  - id: confirm
    mode: gate
    prompt: |
      The root cause for ${slug} is in ${run}/rca.md.
      Approve the fix direction, or tell me what to look at instead.
    on_reject: investigate

  - id: worktree
    agent: worker
    model: haiku
    instructions: |
      Create a worktree for each repo in ${repos} on a new branch fix/${slug} from origin's
      latest default branch, reusing any that exist.
      - If .maestro/workspace.yaml has `worktrees`, run its `create` command from the workspace
        root unless every repo's `path` exists. Rename each worktree's branch to fix/${slug}, or
        check out fix/${slug} if it exists.
      - Otherwise create a git worktree in each repo at .maestro/worktrees/${slug}/<repo>.
      Then run each repo's `setup` command in its worktree, if it has one.
      Record `worktree` (absolute paths) and `branch` as maps keyed by repo.

  - id: fix
    agent: brew
    model: sonnet
    foreach: repo
    instructions: |
      Fix the bug in ${worktree} on branch ${branch}, following ${run}/rca.md.
      First add the report's failing test as a regression test, then fix the code.

  - id: checks
    mode: exec
    foreach: repo
    command: [build, lint, test]
    on_fail: fix

  - id: review
    agent: birbal
    instructions: |
      Review the changes on branch ${branch} in ${worktree} against ${run}/rca.md.
      Write the review to ${run}/review.md.
    on_fail: fix

  - id: archive
    mode: workflow
    workflow: subworkflows/archive.yaml
