# Child of sdlc-main: design staleness check -> implement every designed repository -> verified
# test context -> QA (product bugs: fix the named repos, rebuild the manifest, QA again) ->
# acceptance-criteria trace -> design-vs-code drift check -> assumption log -> review pack ->
# release approval. It decides; the parent acts. Leaving for a
# design revision (the approved design changed, the workspace moved since the design was
# grounded, or the human sent the release back) ends the child and is reported in its outputs:
# `design_stale` or `design_changed` true, or `release` revise -> the
# parent re-runs design and this child then implements every repository afresh; otherwise the
# parent archives.
version: 1
name: delivery
title: Delivery
description: Implement every repository of the approved design, verify it with QA, and approve the release.
inputs:
  slug: {type: string, required: true, description: kebab-case feature id}
  feature: {type: string, default: "${inputs.slug}", description: one-line feature summary}
defaults:
  model: haiku
  agent: general
  max_visits: 10
start: design_check
nodes:
  # The approved LLDs are bound to the exact HLD and contract they were written against. Any change
  # since approval (an edited HLD, a contract change, an edited LLD) sends the design back first.
  - id: design_check
    type: script
    label: Approved design still current?
    run: [python3, .maestro/engine/lld_set.py, verify, --root, ., --slug, "${inputs.slug}"]
    on_fail: abort
    routes:
      - {when: "${steps.design_check.outputs.stale} == true", to: end}
      - {to: workspace_sync_pre_impl}

  - id: workspace_sync_pre_impl
    type: subworkflow
    label: Workspace sync (pre-implementation)
    workflow: .maestro/workflows/workspace-sync.yaml
    inputs: {slug: "${inputs.slug}", checkpoint: pre-implementation, fetch_errors: note}
    max_visits: 8
    routes:
      # If HEAD moved since the design was grounded, end so the parent regenerates/reapproves
      # the design before implementation. Continuing at the already-pinned commits falls through immediately.
      - {when: "${steps.workspace_sync_pre_impl.outputs.changed} == true", to: end}
      - {to: impl_scope_init}

  # Every repository in the approved design, afresh on each pass (a redesign invalidates earlier
  # handoffs). Batching repos is a team-workflow choice: the engine still supports `--choice pick`.
  - id: impl_scope_init
    type: script
    label: Initialize implementation repo pool
    run: [python3, .maestro/engine/implementation_pool.py, init, --root, ., --slug, "${inputs.slug}", --choice, all, --fresh]
    on_fail: abort
    next: implement

  - id: implement
    type: parallel
    label: Implementation (repo pool)
    join: all
    on_branch_fail: ask
    branches:
      - id: slot_1
        start: claim
        steps:
          - id: claim
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, claim, --root, ., --slug, "${inputs.slug}"]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: impl}
          - id: impl
            type: subworkflow
            workflow: .maestro/workflows/impl.yaml
            inputs:
              slug: "${inputs.slug}"
              stack: "${steps.claim.outputs.repo}"
              repo_path: "${steps.claim.outputs.repo_path}"
              feature: "${inputs.feature}"
              stack_skills: "${steps.claim.outputs.stack_skills_csv}"
            next: record
          - id: record
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${steps.claim.outputs.repo}", --branch, "${steps.impl.outputs.branch}", --worktree, "${steps.impl.outputs.worktree}", --commit, "${steps.impl.outputs.commit}"]
            on_fail: abort
            next: claim
      - id: slot_2
        start: claim
        steps:
          - id: claim
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, claim, --root, ., --slug, "${inputs.slug}"]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: impl}
          - id: impl
            type: subworkflow
            workflow: .maestro/workflows/impl.yaml
            inputs:
              slug: "${inputs.slug}"
              stack: "${steps.claim.outputs.repo}"
              repo_path: "${steps.claim.outputs.repo_path}"
              feature: "${inputs.feature}"
              stack_skills: "${steps.claim.outputs.stack_skills_csv}"
            next: record
          - id: record
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${steps.claim.outputs.repo}", --branch, "${steps.impl.outputs.branch}", --worktree, "${steps.impl.outputs.worktree}", --commit, "${steps.impl.outputs.commit}"]
            on_fail: abort
            next: claim
      - id: slot_3
        start: claim
        steps:
          - id: claim
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, claim, --root, ., --slug, "${inputs.slug}"]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: impl}
          - id: impl
            type: subworkflow
            workflow: .maestro/workflows/impl.yaml
            inputs:
              slug: "${inputs.slug}"
              stack: "${steps.claim.outputs.repo}"
              repo_path: "${steps.claim.outputs.repo_path}"
              feature: "${inputs.feature}"
              stack_skills: "${steps.claim.outputs.stack_skills_csv}"
            next: record
          - id: record
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${steps.claim.outputs.repo}", --branch, "${steps.impl.outputs.branch}", --worktree, "${steps.impl.outputs.worktree}", --commit, "${steps.impl.outputs.commit}"]
            on_fail: abort
            next: claim
      - id: slot_4
        start: claim
        steps:
          - id: claim
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, claim, --root, ., --slug, "${inputs.slug}"]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: impl}
          - id: impl
            type: subworkflow
            workflow: .maestro/workflows/impl.yaml
            inputs:
              slug: "${inputs.slug}"
              stack: "${steps.claim.outputs.repo}"
              repo_path: "${steps.claim.outputs.repo_path}"
              feature: "${inputs.feature}"
              stack_skills: "${steps.claim.outputs.stack_skills_csv}"
            next: record
          - id: record
            type: script
            run: [python3, .maestro/engine/implementation_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${steps.claim.outputs.repo}", --branch, "${steps.impl.outputs.branch}", --worktree, "${steps.impl.outputs.worktree}", --commit, "${steps.impl.outputs.commit}"]
            on_fail: abort
            next: claim
    next: finalize_implementation

  - id: finalize_implementation
    type: script
    label: Verify implementation test context
    run: [python3, .maestro/engine/implementation_pool.py, finalize, --root, ., --slug, "${inputs.slug}"]
    on_fail: abort
    next: qa

  - id: qa
    type: subworkflow
    label: QA phase
    workflow: .maestro/workflows/qa.yaml
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      implementation_manifest: "${steps.finalize_implementation.outputs.manifest_path}"
      implementation_manifest_sha256: "${steps.finalize_implementation.outputs.manifest_sha256}"
    max_visits: 3
    routes:
      - {when: "${steps.qa.outputs.product_bug} == true", to: bugfix_init}
      - {to: ac_trace}

  # QA diagnosed a product bug: fix each named repository on its own feature branch and worktree
  # (fix -> engine checks -> re-review), record the new commits, rebuild the manifest from them
  # and re-run QA. QA's visit limit bounds the rounds; then a person decides.
  - id: bugfix_init
    type: script
    label: Queue the repositories QA found bugs in
    run: [python3, .maestro/engine/implementation_pool.py, bugfix-init, --root, ".", --slug, "${inputs.slug}", --repos-text, "${steps.qa.outputs.bug_repos}"]
    on_fail: ask
    next: bugfix_claim

  - id: bugfix_claim
    type: script
    label: Next repository to fix
    run: [python3, .maestro/engine/implementation_pool.py, bugfix-claim, --root, ".", --slug, "${inputs.slug}"]
    max_visits: 40
    routes:
      - {when: "${steps.bugfix_claim.outputs.done} == true", to: finalize_implementation}
      - {to: bugfix}

  - id: bugfix
    type: subworkflow
    label: Fix the QA bug
    workflow: .maestro/workflows/qa-bugfix.yaml
    inputs:
      slug: "${inputs.slug}"
      repo: "${steps.bugfix_claim.outputs.repo}"
      repo_path: "${steps.bugfix_claim.outputs.repo_path}"
      branch: "${steps.bugfix_claim.outputs.branch}"
      worktree: "${steps.bugfix_claim.outputs.worktree}"
      commit: "${steps.bugfix_claim.outputs.commit}"
      bug_report: "${steps.qa.outputs.bug_report}"
      stack_skills: "${steps.bugfix_claim.outputs.stack_skills_csv}"
    max_visits: 20
    next: bugfix_record

  - id: bugfix_record
    type: script
    label: Record the fixed commit
    run: [python3, .maestro/engine/implementation_pool.py, record, --root, ".", --slug, "${inputs.slug}", --repo, "${steps.bugfix_claim.outputs.repo}", --branch, "${steps.bugfix_claim.outputs.branch}", --worktree, "${steps.bugfix_claim.outputs.worktree}", --from-worktree]
    on_fail: abort
    max_visits: 40
    next: bugfix_claim

  # Each PRD acceptance criterion -> its test cases -> their QA results. A criterion passes only
  # when a case for it ran and every case that ran passed.
  - id: ac_trace
    type: script
    label: Trace acceptance criteria to QA results
    run:
      - python3
      - .maestro/engine/ac_trace.py
      - qa
      - --prd
      - ".maestro/runs/${inputs.slug}/requirement/prd.md"
      - --test-cases
      - ".maestro/runs/${inputs.slug}/test-cases.md"
      - --results
      - "${steps.qa.outputs.qa_results}"
      - --out
      - ".maestro/runs/${inputs.slug}/ac-trace.md"
    on_fail: abort
    next: drift_check

  # Before release: does the code that will ship match the approved design, across every
  # repository? A fresh reviewer compares each verified commit with the HLD, contract and LLDs;
  # the engine decides blocking from its findings file.
  - id: drift_check
    type: agent
    label: Design-vs-code drift check
    brief: full
    instruction: |
      Compare the implemented code with the approved design before release. For every repository
      in ${steps.finalize_implementation.outputs.manifest_path}, read the diff from where its
      branch left the main line to its listed commit, in its listed worktree, and check it against
      .maestro/runs/${inputs.slug}/hld.md (absent on the light path), the contract at
      .maestro/runs/${inputs.slug}/openapi.yaml (when it exists) and its LLD at
      .maestro/runs/${inputs.slug}/lld/<repo>.md: contract, design decisions, data and migrations,
      infrastructure changes, and scope. Write the report and every finding to
      .maestro/runs/${inputs.slug}/reviews/drift-findings.json; equivalent detail the design left open is not drift.
    skill: design-drift
    agent: reviewer
    model: sonnet
    inputs:
      slug: "${inputs.slug}"
      manifest_path: "${steps.finalize_implementation.outputs.manifest_path}"
      hld_path: ".maestro/runs/${inputs.slug}/hld.md"
      contract_path: ".maestro/runs/${inputs.slug}/openapi.yaml"
      findings_path: ".maestro/runs/${inputs.slug}/reviews/drift-findings.json"
    outputs: [review_path, blocking, summary]
    artifact:
      - ".maestro/runs/${inputs.slug}/reviews/drift.md"
      - ".maestro/runs/${inputs.slug}/reviews/drift-findings.json"
    fresh: true
    max_visits: 4
    next: drift_verdict

  - id: drift_verdict
    type: script
    label: Blocking drift?
    run: [python3, .maestro/engine/findings.py, verdict, --findings, ".maestro/runs/${inputs.slug}/reviews/drift-findings.json"]
    max_visits: 6
    on_exhausted: assumptions
    routes:
      - {when: "${steps.drift_verdict.outputs.valid} == false", to: drift_check}
      - {to: assumptions}

  # Every decision nobody confirmed — interview assumptions, items left open, gates answered on
  # autopilot — in one file the review pack shows first.
  - id: assumptions
    type: script
    label: Collect assumptions and autopilot decisions
    run:
      - python3
      - .maestro/engine/assumptions.py
      - render
      - --root
      - .
      - --slug
      - "${inputs.slug}"
      - --decisions
      - ".maestro/runs/${inputs.slug}/prd-context.json"
      - --decisions
      - ".maestro/runs/${inputs.slug}/hld-context.json"
      - --decisions
      - ".maestro/runs/${inputs.slug}/lld-context.json"
    on_fail: abort
    next: review_pack

  - id: review_pack
    type: agent
    label: Human review pack
    brief: full
    instruction: |
      Assemble the release review pack for this feature: what was built (per stack),
      review outcomes, QA results, open risks, and how to verify locally. Open the pack with the
      assumption log (${steps.assumptions.outputs.path}: ${steps.assumptions.outputs.summary}),
      listing every assumption and open item as written. Then show the acceptance-criteria trace
      (${steps.ac_trace.outputs.path}: ${steps.ac_trace.outputs.summary}) as written: each
      criterion with its test cases and result, and the drift check
      (${steps.drift_verdict.outputs.summary}; reviews/drift.md). Read only these
      inputs: assumptions.md, ac-trace.md, reviews/drift.md, implementation-manifest.json, each repo's <repo>/reviews/summary.md,
      reviews/architecture.md (the HLD review), reviews/lld-readiness.md, and qa/report.md under
      .maestro/runs/${inputs.slug}/ — summarize them; do not re-read the design documents or
      source. The pack is what the human reads at the release gate. Treat implementation-manifest.json as the source of truth for every
      repository's exact branch, worktree, and commit; include all of them in the pack.
      Each repository's `verification` in the manifest is the engine's own evidence: its status
      (verified, failed, stale, missing), the receipt it ran, and the existing test files the
      branch changed. Engine verification: ${steps.finalize_implementation.outputs.verification_summary}.
      Report it as written; any status other than verified means the recommendation is not-ready.
    skill: human-review-pack
    agent: analyst
    model: sonnet
    inputs:
      slug: "${inputs.slug}"
      feature: "${inputs.feature}"
      manifest_path: "${steps.finalize_implementation.outputs.manifest_path}"
      verification_summary: "${steps.finalize_implementation.outputs.verification_summary}"
      assumptions_path: "${steps.assumptions.outputs.path}"
      ac_trace_path: "${steps.ac_trace.outputs.path}"
    outputs: [pack_path, recommendation, summary]
    artifact: ".maestro/runs/${inputs.slug}/review-pack.md"
    fresh: true
    next: release_approval

  - id: release_approval
    type: gate
    label: Release approval
    prompt: |
      Ready to release?
      Engine verification (build/lint/test receipts): ${steps.finalize_implementation.outputs.verification_summary}
      Acceptance criteria: ${steps.ac_trace.outputs.summary} (${steps.ac_trace.outputs.path})
      Design drift (engine): ${steps.drift_verdict.outputs.summary} (.maestro/runs/${inputs.slug}/reviews/drift.md)
      Unconfirmed decisions: ${steps.assumptions.outputs.summary} (${steps.assumptions.outputs.path})
      Recommendation: ${steps.review_pack.outputs.recommendation}
      ${steps.review_pack.outputs.summary}
      Review pack: ${steps.review_pack.outputs.pack_path}
      QA: ${steps.qa.outputs.qa_summary} · ${steps.qa.outputs.e2e_summary}
    options:
      - {id: approve, label: Approve the release, to: end}
      - {id: revise, label: Send back to design — then describe what to change, to: end, input: feedback}
      - {id: reject, label: Reject — abort, to: abort}
    # Design and auto modes release only what the engine itself verified (build/lint/test receipts
    # at the exact commits) with every acceptance criterion passing QA; anything else stops the run
    # for a person.
    auto:
      option: approve
      when:
        - "${steps.finalize_implementation.outputs.verified_ok} == true"
        - "${steps.ac_trace.outputs.all_passed} == true"
        - "${steps.drift_verdict.outputs.blocking} == false"

outputs:
  design_changed: "${steps.workspace_sync_pre_impl.outputs.changed}"
  design_stale: "${steps.design_check.outputs.stale}"
  stale_reasons: "${steps.design_check.outputs.reasons}"
  release: "${steps.release_approval.outputs.choice}"
  release_feedback: "${steps.release_approval.outputs.feedback}"
  release_by: "${steps.release_approval.outputs.by}"
  pack_path: "${steps.review_pack.outputs.pack_path}"
  manifest_path: "${steps.finalize_implementation.outputs.manifest_path}"
  ac_trace: "${steps.ac_trace.outputs.summary}"
