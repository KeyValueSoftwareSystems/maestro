name: bugfix
description: Fix a bug — investigate and reproduce, fix with a regression test, test, review, open a PR.
inputs:
  request: What is broken? A sentence, a ticket, logs or a stack trace.
vars:
  run: .maestro/runs/${slug}

steps:
  - id: investigate
    type: agent
    agent: sherlock
    mode: inline            # may need to ask the user about the symptom
    model: opus
    params:
      interview: auto
      reproduce: true
      commitTest: true
      output: ${run}/rca.md
    instructions: >
      Investigate ${request}. Work on branch fix/${slug} (create it from the current HEAD) and
      commit the failing regression test there.
    next: { found: fix, unclear: confirm }

  - id: confirm
    type: gate
    ask: The cause is not certain yet (see ${run}/rca.md). Try the proposed fix anyway?
    next: { yes: fix, no: investigate }

  - id: fix
    type: agent
    agent: brew
    mode: subagent
    model: sonnet
    params:
      plan: ${run}/rca.md
      branch: fix/${slug}
    instructions: >
      Apply the proposed fix in ${run}/rca.md and make its regression test pass. Smallest change
      only, no refactors. If ${run}/test-report.md has result "fail" or ${run}/review.md has
      verdict "changes", fix those findings.
    next: { done: test, blocked: ask-user }

  - id: test
    type: agent
    agent: litmus
    mode: subagent
    model: sonnet
    params:
      spec: ${run}/rca.md
      target: branch fix/${slug}
      output: ${run}/test-report.md
    instructions: >
      Confirm the regression test now passes, the expected behaviour in the report is restored,
      and nothing nearby regressed.
    next: { pass: review, fail: fix }
    max_loops: 3

  - id: review
    type: agent
    agent: reviewer
    mode: subagent
    model: opus
    params:
      against: ${run}/rca.md
      target: branch fix/${slug} against its base
      output: ${run}/review.md
    instructions: >
      Check the fix addresses the root cause, not just the symptom, and changes nothing beyond
      it. If ${run}/review.md already exists, do a re-review.
    next: { approve: pr, changes: fix }
    max_loops: 3

  - id: pr
    type: worker
    mode: inline
    instructions: >
      Push fix/${slug} and open a pull request: the cause and fix from ${run}/rca.md and the
      regression test name. Report the PR link.
    next: done
