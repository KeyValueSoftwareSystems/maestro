# Fan-out child of impl: build ONE repository's task plan slice group by slice group.
#
# impl runs it only when the engine split the plan (slice_pool.py init, the task step's check:
# two or more slice groups and an engine-created feature worktree). Up to three slots each claim
# one slice group at a time, implement it with a short, fresh context in its own worktree and
# branch off the feature branch, and record the slice's commit. Then the engine merges every slice
# into the feature branch in plan order. A slice that escalates stops further claims; it, or a
# merge conflict (the plan's writes overlapped), is reported in `escalate` for impl's stop gate.
version: 1
name: impl-slices
title: Implement slices in parallel
description: Build one repository's slice groups in parallel worktrees, then merge them into the feature branch.
inputs:
  slug: {type: string, required: true}
  stack: {type: string, required: true, description: selected repository name}
  repo_path: {type: string, required: true, description: path to the selected git repository}
  facts_path: {type: string, default: "", description: the living-doc facts the plan cites}
  guidance: {type: string, default: "", description: the person's guidance from impl's stop gate}
  stack_skills: {type: string, default: "", description: installed stack skills for the steps that write code (stack_skills.py)}
defaults:
  model: sonnet
  agent: implementer
  max_visits: 10
start: pool
nodes:
  - id: pool
    type: parallel
    label: Slice pool
    join: all
    on_branch_fail: ask
    branches:
      - id: slot_1
        start: claim
        steps:
          - id: claim
            type: script
            label: Next slice group
            run: [python3, .maestro/engine/slice_pool.py, claim, --root, ., --slug, "${inputs.slug}", --repo, "${inputs.stack}", --slot, slot_1]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: implement_slice}
          - id: implement_slice
            type: agent
            label: Implement one slice
            instruction: |
              Implement ONLY slice group ${steps.claim.outputs.group_id} of the ${inputs.stack}
              repository: tasks ${steps.claim.outputs.task_ids_csv} of
              .maestro/runs/${inputs.slug}/build/${inputs.stack}/tasks.json, test-first, in the skill's
              slice mode. Other agents build the other groups at the same time in their own
              worktrees: edit only the files your tasks write. Work from the approved plan at
              docs/plans/active/${inputs.slug}.md (in the workspace root, not in the worktree), reading only
              what your tasks need, the codebase map docs/codebase-maps/${inputs.stack}.md and the
              living-doc facts at ${inputs.facts_path}: keep every invariant listed there. Run your
              tasks' tests, commit all of your work on the slice branch and do not merge it. The
              approved plan is the human approval for what it describes, including
              tasks marked needs_human_gate. When the work needs something it does not describe
              (an unplanned migration, permission change, payment logic, production config, secret
              or dependency upgrade, a file outside your tasks' writes, or a design decision that
              looks wrong), stop and return escalate true with the reason in escalation. Honour the
              person's guidance (the `guidance` input) when there is any. Apply the repository's
              stack skills (${inputs.stack_skills}): load only those covering what your tasks touch.
            skill: repo-implement
            isolate: worktree
            inputs:
              slug: "${inputs.slug}"
              stack: "${inputs.stack}"
              group_id: "${steps.claim.outputs.group_id}"
              task_ids: "${steps.claim.outputs.task_ids_csv}"
              tasks_path: ".maestro/runs/${inputs.slug}/build/${inputs.stack}/tasks.json"
              plan_path: "docs/plans/active/${inputs.slug}.md"
              repo_path: "${inputs.repo_path}"
              worktree: "${steps.claim.outputs.worktree}"
              branch: "${steps.claim.outputs.branch}"
              guidance: "${inputs.guidance}"
              stack_skills: "${inputs.stack_skills}"
            outputs: [branch, commit, summary, tests_passed, escalate, escalation]
            retries: 1
            max_visits: 40
            next: record
          # the engine reads the slice's commit from its worktree; the agent's report is not proof
          - id: record
            type: script
            label: Record the slice
            run: [python3, .maestro/engine/slice_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${inputs.stack}", --slot, slot_1, --group, "${steps.claim.outputs.group_id}", "--escalate=${steps.implement_slice.outputs.escalate}", "--escalation=${steps.implement_slice.outputs.escalation}", "--tests-passed=${steps.implement_slice.outputs.tests_passed}", "--summary=${steps.implement_slice.outputs.summary}"]
            max_visits: 40
            on_fail: ask
            next: claim
      - id: slot_2
        start: claim
        steps:
          - id: claim
            type: script
            label: Next slice group
            run: [python3, .maestro/engine/slice_pool.py, claim, --root, ., --slug, "${inputs.slug}", --repo, "${inputs.stack}", --slot, slot_2]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: implement_slice}
          - id: implement_slice
            type: agent
            label: Implement one slice
            instruction: |
              Implement ONLY slice group ${steps.claim.outputs.group_id} of the ${inputs.stack}
              repository: tasks ${steps.claim.outputs.task_ids_csv} of
              .maestro/runs/${inputs.slug}/build/${inputs.stack}/tasks.json, test-first, in the skill's
              slice mode. Other agents build the other groups at the same time in their own
              worktrees: edit only the files your tasks write. Work from the approved plan at
              docs/plans/active/${inputs.slug}.md (in the workspace root, not in the worktree), reading only
              what your tasks need, the codebase map docs/codebase-maps/${inputs.stack}.md and the
              living-doc facts at ${inputs.facts_path}: keep every invariant listed there. Run your
              tasks' tests, commit all of your work on the slice branch and do not merge it. The
              approved plan is the human approval for what it describes, including
              tasks marked needs_human_gate. When the work needs something it does not describe
              (an unplanned migration, permission change, payment logic, production config, secret
              or dependency upgrade, a file outside your tasks' writes, or a design decision that
              looks wrong), stop and return escalate true with the reason in escalation. Honour the
              person's guidance (the `guidance` input) when there is any. Apply the repository's
              stack skills (${inputs.stack_skills}): load only those covering what your tasks touch.
            skill: repo-implement
            isolate: worktree
            inputs:
              slug: "${inputs.slug}"
              stack: "${inputs.stack}"
              group_id: "${steps.claim.outputs.group_id}"
              task_ids: "${steps.claim.outputs.task_ids_csv}"
              tasks_path: ".maestro/runs/${inputs.slug}/build/${inputs.stack}/tasks.json"
              plan_path: "docs/plans/active/${inputs.slug}.md"
              repo_path: "${inputs.repo_path}"
              worktree: "${steps.claim.outputs.worktree}"
              branch: "${steps.claim.outputs.branch}"
              guidance: "${inputs.guidance}"
              stack_skills: "${inputs.stack_skills}"
            outputs: [branch, commit, summary, tests_passed, escalate, escalation]
            retries: 1
            max_visits: 40
            next: record
          # the engine reads the slice's commit from its worktree; the agent's report is not proof
          - id: record
            type: script
            label: Record the slice
            run: [python3, .maestro/engine/slice_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${inputs.stack}", --slot, slot_2, --group, "${steps.claim.outputs.group_id}", "--escalate=${steps.implement_slice.outputs.escalate}", "--escalation=${steps.implement_slice.outputs.escalation}", "--tests-passed=${steps.implement_slice.outputs.tests_passed}", "--summary=${steps.implement_slice.outputs.summary}"]
            max_visits: 40
            on_fail: ask
            next: claim
      - id: slot_3
        start: claim
        steps:
          - id: claim
            type: script
            label: Next slice group
            run: [python3, .maestro/engine/slice_pool.py, claim, --root, ., --slug, "${inputs.slug}", --repo, "${inputs.stack}", --slot, slot_3]
            max_visits: 40
            routes:
              - {when: "${steps.claim.outputs.done} == true", to: end}
              - {to: implement_slice}
          - id: implement_slice
            type: agent
            label: Implement one slice
            instruction: |
              Implement ONLY slice group ${steps.claim.outputs.group_id} of the ${inputs.stack}
              repository: tasks ${steps.claim.outputs.task_ids_csv} of
              .maestro/runs/${inputs.slug}/build/${inputs.stack}/tasks.json, test-first, in the skill's
              slice mode. Other agents build the other groups at the same time in their own
              worktrees: edit only the files your tasks write. Work from the approved plan at
              docs/plans/active/${inputs.slug}.md (in the workspace root, not in the worktree), reading only
              what your tasks need, the codebase map docs/codebase-maps/${inputs.stack}.md and the
              living-doc facts at ${inputs.facts_path}: keep every invariant listed there. Run your
              tasks' tests, commit all of your work on the slice branch and do not merge it. The
              approved plan is the human approval for what it describes, including
              tasks marked needs_human_gate. When the work needs something it does not describe
              (an unplanned migration, permission change, payment logic, production config, secret
              or dependency upgrade, a file outside your tasks' writes, or a design decision that
              looks wrong), stop and return escalate true with the reason in escalation. Honour the
              person's guidance (the `guidance` input) when there is any. Apply the repository's
              stack skills (${inputs.stack_skills}): load only those covering what your tasks touch.
            skill: repo-implement
            isolate: worktree
            inputs:
              slug: "${inputs.slug}"
              stack: "${inputs.stack}"
              group_id: "${steps.claim.outputs.group_id}"
              task_ids: "${steps.claim.outputs.task_ids_csv}"
              tasks_path: ".maestro/runs/${inputs.slug}/build/${inputs.stack}/tasks.json"
              plan_path: "docs/plans/active/${inputs.slug}.md"
              repo_path: "${inputs.repo_path}"
              worktree: "${steps.claim.outputs.worktree}"
              branch: "${steps.claim.outputs.branch}"
              guidance: "${inputs.guidance}"
              stack_skills: "${inputs.stack_skills}"
            outputs: [branch, commit, summary, tests_passed, escalate, escalation]
            retries: 1
            max_visits: 40
            next: record
          # the engine reads the slice's commit from its worktree; the agent's report is not proof
          - id: record
            type: script
            label: Record the slice
            run: [python3, .maestro/engine/slice_pool.py, record, --root, ., --slug, "${inputs.slug}", --repo, "${inputs.stack}", --slot, slot_3, --group, "${steps.claim.outputs.group_id}", "--escalate=${steps.implement_slice.outputs.escalate}", "--escalation=${steps.implement_slice.outputs.escalation}", "--tests-passed=${steps.implement_slice.outputs.tests_passed}", "--summary=${steps.implement_slice.outputs.summary}"]
            max_visits: 40
            on_fail: ask
            next: claim
    next: merge

  # Engine-owned: merges in plan order and moves the feature branch only when every slice merged.
  # A conflict is reported as an escalation, never resolved.
  - id: merge
    type: script
    label: Merge the slices into the feature branch
    run: [python3, .maestro/engine/slice_pool.py, merge, --root, ., --slug, "${inputs.slug}", --repo, "${inputs.stack}"]
    on_fail: ask
    next: end

outputs:
  merged: "${steps.merge.outputs.merged}"
  escalate: "${steps.merge.outputs.escalate}"
  escalation: "${steps.merge.outputs.escalation}"
  branch: "${steps.merge.outputs.branch}"
  worktree: "${steps.merge.outputs.worktree}"
  commit: "${steps.merge.outputs.commit}"
  summary: "${steps.merge.outputs.summary}"
