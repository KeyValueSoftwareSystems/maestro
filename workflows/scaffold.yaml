# Greenfield child of design: the workspace had no code, so once the plan is written the
# repositories it marks new are created, scaffolded to a passing build and test, added to
# maestro.config.yaml and pinned, before the plan is approved and built against them.
#
#   create (engine) -> scaffold (agent; engine check: configure + prove build/test)
#   -> record knowledge -> pin (engine)
version: 1
name: scaffold
title: Scaffold new repositories
description: Create and scaffold the repositories a greenfield plan marks new, then verify and pin them.
inputs:
  slug: {type: string, required: true}
  feature: {type: string, default: "${inputs.slug}"}
defaults:
  model: sonnet
  agent: implementer
  max_visits: 6
start: create
nodes:
  - id: create
    type: script
    label: Create the new repositories
    say: Creating the new repositories.
    run: [python3, .maestro/engine/greenfield.py, create, --root, ".", --slug, "${inputs.slug}", --plan, ".maestro/runs/${inputs.slug}/.engine/greenfield-plan.json"]
    on_fail: abort
    next: scaffold

  - id: scaffold
    type: agent
    label: Scaffold the new repositories
    say: Setting up each new repository with a passing build and test.
    instruction: |
      Scaffold each new repository (${steps.create.outputs.repos_csv}) under codebase/ from the
      plan at docs/plans/active/${inputs.slug}.md (in the workspace root): the stack's layout, a
      passing build and trivial test, lint, a README, CI, a container image when the plan deploys
      it, starting infrastructure definitions when it names a platform, and each repository's
      codebase map at
      docs/codebase-maps/<repo>.md. Write no
      feature behaviour. Commit each skeleton on its default branch. Write the report with each
      repository's stack and commands to .maestro/runs/${inputs.slug}/build/scaffold.json.
      If the engine's check failed, fix exactly what it reports.
    skill: repo-scaffold
    inputs:
      slug: "${inputs.slug}"
      plan_path: "docs/plans/active/${inputs.slug}.md"
      repos: "${steps.create.outputs.repos_csv}"
      report_path: ".maestro/runs/${inputs.slug}/build/scaffold.json"
    outputs: [summary]
    artifact: ".maestro/runs/${inputs.slug}/build/scaffold.json"
    # Engine-owned: the commands go into maestro.config.yaml and must actually pass once.
    check: {run: [python3, .maestro/engine/greenfield.py, configure, --root, ".", --scaffold, ".maestro/runs/${inputs.slug}/build/scaffold.json"], timeout: 1800, attempts: 4}
    max_visits: 3
    next: record_knowledge

  # The scaffold wrote each repository's codebase map: record that knowledge as current at the
  # scaffold commits, so the next workspace check does not ask to refresh it.
  - id: record_knowledge
    type: script
    label: Record what the new repositories contain
    say: Recording what the new repositories contain.
    run: [python3, .maestro/engine/workspace_sync.py, record-knowledge, --root, ".", --evidence, ".maestro/runs/${inputs.slug}/build/scaffold.json"]
    on_fail: abort
    next: pin

  # Pin the new repositories' commits, so delivery's workspace check sees the scaffold as the
  # design's starting point instead of a change since design.
  - id: pin
    type: script
    label: "Record the new repositories' starting point"
    say: Recording the exact starting point of each new repository.
    run: [python3, .maestro/engine/workspace_sync.py, lock, --root, ".", --out, ".maestro/runs/${inputs.slug}/.engine/workspace-lock.json"]
    on_fail: abort
    next: end

outputs:
  repos_csv: "${steps.create.outputs.repos_csv}"
  summary: "${steps.scaffold.outputs.summary}"
