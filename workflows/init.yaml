# Set up a workspace: find its repos and commands, then offer to build the knowledge base.
# Re-run it after adding a repo; it only adds new ones.
name: init
description: Detect the workspace's repos and commands, and offer to build the knowledge base.
max_steps: 15
steps:
  - id: detect
    agent: worker
    instructions: |
      Find the repositories in this workspace: the current folder if it is a git repository with
      code, and each git repository under codebase/ (an umbrella workspace).
      For each one, find its commands: setup (the locked dependency install, such as `npm ci` or
      `uv sync --locked`), build, lint and test. Look in its manifests (package.json,
      pyproject.toml, pom.xml, build.gradle, Makefile), CI config, README and AGENTS.md.
      Write .maestro/workspace.yaml in this format. Keep existing entries unchanged unless the
      person's feedback says otherwise, and only add repos that are new:

        repos:
          <name>:
            path: <path from the workspace root; "." for the current folder>
            commands: {setup: <cmd>, build: <cmd>, lint: <cmd>, test: <cmd>}   # leave out what the repo lacks

      Then look for the workspace's own tools at its root (read their usage, don't run them): one
      that creates a worktree of every repo on a branch you name, and one that starts the whole stack from those
      worktrees. Add these sections only for tools that exist:

        # Run from the workspace root, with {slug} as the run's slug, {branch} as its branch
        # and {repo} as a repo name.
        worktrees:
          create: <makes every repo's worktree on {branch} from origin's latest default branch>
          path: <each repo's worktree from the workspace root, with {slug} and {repo}>
          remove: <removes them>
        environment:
          start: <starts the stack in the background>
          stop: <stops it>

      Then run the build, lint and test commands of each repo you added, once. A command that
      fails doesn't fail this step.
      Record the repo names you added as `repos`, and the commands that failed as `failing`, each
      with its repo and a short reason (such as "invoice-svc lint: 60 errors in src/legacy.js"),
      or `none`.

  - id: confirm
    mode: gate
    prompt: |
      Check .maestro/workspace.yaml: the repos and their commands.
      Commands that already fail: ${failing}. Every run checks its changes with these commands,
      so fix or narrow a failing one now (for example, lint only the changed files).
      Approve, or tell me what to fix.
    on_reject: detect

  - id: offer-knowledge
    mode: gate
    prompt: Build the knowledge base in docs/ now? It reads every repo, so it can take a while.

  - id: knowledge
    mode: workflow
    workflow: knowledge.yaml
